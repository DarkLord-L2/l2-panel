<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Смена пароля — Кабинет клана</title>
<link rel="stylesheet" href="js/theme.css?v=3" />
</head>
<body>

<div class="login-wrap">
  <form class="card login-card" id="changeForm" autocomplete="on">
    <h1>Смена пароля</h1>
    <p class="hint">Это ваш первый вход — придумайте новый пароль, старый (временный) больше не будет действовать.</p>

    <div class="field">
      <label for="newPassword">Новый пароль</label>
      <input type="password" id="newPassword" name="new-password" autocomplete="new-password" required minlength="6" />
    </div>
    <div class="field">
      <label for="newPassword2">Повторите пароль</label>
      <input type="password" id="newPassword2" name="new-password-2" autocomplete="new-password" required minlength="6" />
    </div>

    <p class="error-msg" id="changeError"></p>

    <button type="submit" class="btn btn-primary" id="changeSubmit" style="width:100%;">Сохранить и войти</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js?v=6"></script>
<script>
(async function(){
  const session = await L2Cabinet.requireSession();
  if(!session) return;

  const form = document.getElementById("changeForm");
  const errorEl = document.getElementById("changeError");
  const submitBtn = document.getElementById("changeSubmit");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.textContent = "";

    const p1 = document.getElementById("newPassword").value;
    const p2 = document.getElementById("newPassword2").value;
    if(p1 !== p2){ errorEl.textContent = "Пароли не совпадают."; return; }
    if(p1.length < 6){ errorEl.textContent = "Пароль должен быть не короче 6 символов."; return; }

    submitBtn.disabled = true;
    submitBtn.textContent = "Сохраняем…";
    try{
      const { error } = await L2Cabinet.client.auth.updateUser({ password: p1 });
      if(error) throw error;
      await L2Cabinet.clearMustChangePassword();
      location.href = "index.html";
    }catch(err){
      errorEl.textContent = "Не удалось сохранить: " + err.message;
      submitBtn.disabled = false;
      submitBtn.textContent = "Сохранить и войти";
    }
  });
})();
</script>
</body>
</html>
