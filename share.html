<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Отчёт — Кабинет клана</title>
<link rel="stylesheet" href="js/theme.css?v=12" />
<style>
  .share-wrap{ max-width:900px; margin:0 auto; padding:24px 18px 40px; }
  .share-head{ margin-bottom:16px; }
  .share-head p{ font-size:12.5px; color: var(--text-dim); margin:4px 0 0; }
  .share-search{ margin-bottom:14px; max-width:320px; }
  table.share-table{ border-collapse:separate; border-spacing:0; width:100%; font-size:13px; }
  table.share-table th, table.share-table td{ padding:8px 12px; border-bottom:1px solid var(--border); white-space:nowrap; }
  table.share-table thead th{
    position:sticky; top:0; background: var(--panel); color: var(--text-dim);
    font-size:12px; font-weight:500; text-align:center;
  }
  table.share-table th:first-child, table.share-table td:first-child{ text-align:left; }
  table.share-table tbody tr:hover td{ background: rgba(255,255,255,.03); }
  .share-table-scroll{ overflow:auto; max-height:75vh; border:1px solid var(--border); border-radius:8px; }
</style>
</head>
<body>

<div class="share-wrap" id="wrap" style="display:none;">
  <div class="share-head">
    <h1 id="shareTitle"></h1>
    <p id="shareMeta"></p>
  </div>
  <div class="field share-search">
    <label for="searchInput" data-i18n="share.searchLabel">Поиск по нику</label>
    <input type="text" id="searchInput" data-i18n-attr="placeholder:share.searchPlaceholder" placeholder="Ник" />
  </div>
  <div class="share-table-scroll">
    <table class="share-table">
      <thead id="tHead"></thead>
      <tbody id="tBody"></tbody>
    </table>
  </div>
  <p class="empty-hint" id="emptyHint" style="display:none;" data-i18n="share.emptyHint">Ничего не найдено.</p>
</div>

<div class="login-wrap" id="errorWrap" style="display:none;">
  <div class="card login-card">
    <h1 data-i18n="share.invalidTitle">⛔ Ссылка недействительна</h1>
    <p class="hint" data-i18n="share.invalidHint">Срок действия ссылки истёк (5 дней) или она указана неверно.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js?v=18"></script>
<script src="js/i18n.js?v=2"></script>
<script>
(async function(){
  // публичная страница — никакого requireSession()/getProfile(), читаем анонимно;
  // RLS на report_shares сама решает, отдавать строку или нет (по expires_at)
  const id = new URLSearchParams(location.search).get("id");
  if(!id){ document.getElementById("errorWrap").style.display = ""; return; }

  const { data, error } = await L2Cabinet.client
    .from("report_shares")
    .select("title, columns, search_column, rows, expires_at")
    .eq("id", id)
    .maybeSingle();

  if(error || !data){
    document.getElementById("errorWrap").style.display = "";
    return;
  }

  document.getElementById("wrap").style.display = "";
  document.getElementById("shareTitle").textContent = data.title;
  const until = new Date(data.expires_at);
  document.getElementById("shareMeta").textContent =
    L2I18n.t("share.validUntil", "Ссылка действует до") + " " + until.toLocaleDateString(L2I18n.locale()) + " " + until.toLocaleTimeString(L2I18n.locale(), { hour: "2-digit", minute: "2-digit" });

  const columns = data.columns || [];
  const allRows = data.rows || [];
  const searchColumn = data.search_column;

  document.getElementById("tHead").innerHTML =
    "<tr>" + columns.map(c => `<th>${escapeHtml(c.label)}</th>`).join("") + "</tr>";

  function escapeHtml(s){
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function render(filterText){
    const q = (filterText || "").trim().toLowerCase();
    const shown = !q || !searchColumn
      ? allRows
      : allRows.filter(r => String(r[searchColumn] ?? "").toLowerCase().includes(q));

    const body = document.getElementById("tBody");
    body.innerHTML = shown.map(r =>
      "<tr>" + columns.map(c => `<td>${escapeHtml(r[c.key])}</td>`).join("") + "</tr>"
    ).join("");
    document.getElementById("emptyHint").style.display = shown.length ? "none" : "";
  }

  document.getElementById("searchInput").addEventListener("input", (e) => render(e.target.value));
  if(!searchColumn) document.querySelector(".share-search").style.display = "none";

  render("");
})();
</script>
</body>
</html>
