<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Админ-панель — Кабинет клана</title>
<link rel="stylesheet" href="js/theme.css?v=3" />
<style>
  .admin-wrap{ display:flex; flex-direction:column; gap:14px; padding:0 0 32px; }
  .admin-head{ display:flex; align-items:center; justify-content:space-between; }
  .form-row{ display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
  .form-row .field{ margin:0; min-width:160px; flex:1; }
  select{ width:100%; }
</style>
</head>
<body>

<div class="admin-wrap" id="adminWrap" style="display:none;">
  <div class="admin-head">
    <h1>Админ-панель</h1>
  </div>

  <section class="card">
    <h2>Новый пользователь</h2>
    <form id="createUserForm">
      <div class="form-row">
        <div class="field">
          <label for="newUsername">Логин</label>
          <input type="text" id="newUsername" required pattern="[a-zA-Z0-9_\-]{3,32}" title="3–32 символа: латиница, цифры, - и _" />
        </div>
        <div class="field">
          <label for="newPassword">Пароль</label>
          <input type="text" id="newPassword" required minlength="6" />
        </div>
        <div class="field">
          <label for="newNickname">Ник в игре (необязательно)</label>
          <input type="text" id="newNickname" placeholder="Любой, хоть кириллицей" />
        </div>
        <div class="field">
          <label for="newRole">Роль</label>
          <select id="newRole"></select>
        </div>
        <div class="field">
          <label for="newParty">Пати (необязательно)</label>
          <select id="newParty"><option value="">—</option></select>
        </div>
        <button type="submit" class="btn btn-primary" id="createUserBtn">Создать</button>
      </div>
      <p class="error-msg" id="createUserError"></p>
      <p class="ok-msg" id="createUserOk"></p>
    </form>
  </section>

  <section class="card">
    <h2>Пользователи</h2>
    <table class="data-table" id="usersTable">
      <thead>
        <tr><th>Логин</th><th>Ник в игре</th><th>Роль</th><th>Пати</th><th>Создан</th><th></th></tr>
      </thead>
      <tbody id="usersBody"></tbody>
    </table>
    <p class="error-msg" id="usersError"></p>
  </section>

  <section class="card">
    <h2>Какие разделы видит каждая роль</h2>
    <p class="hint">Снимите галочку — раздел исчезнет из навигации у всех с этой ролью. Админ-панель всегда видна только главному админу.</p>
    <div style="overflow-x:auto;">
      <table class="matrix-table" id="permMatrix"></table>
    </div>
  </section>
</div>

<div class="login-wrap" id="deniedWrap" style="display:none;">
  <div class="card login-card">
    <h1>⛔ Нет доступа</h1>
    <p class="hint">Эта страница только для главного админа.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js?v=4"></script>
<script>
(async function(){
  const session = await L2Cabinet.requireSession();
  if(!session) return;

  const profile = await L2Cabinet.getProfile();
  if(!profile || profile.roles?.key !== "glavadmin"){
    document.getElementById("deniedWrap").style.display = "";
    return;
  }
  document.getElementById("adminWrap").style.display = "";

  const db = L2Cabinet.client;
  let roles = [], parties = [], sections = [];

  async function loadLookups(){
    const [{ data: r }, { data: p }, { data: s }] = await Promise.all([
      db.from("roles").select("id, key, label, rank").order("rank", { ascending: false }),
      db.from("clan_groups").select("id, name").eq("hidden", false).order("name"),
      db.from("sections").select("key, label, sort").order("sort"),
    ]);
    roles = r || []; parties = p || []; sections = s || [];
  }

  function fillSelect(sel, items, labelFn, withEmpty){
    sel.innerHTML = (withEmpty ? '<option value="">—</option>' : "") +
      items.map(it => `<option value="${it.id}">${labelFn(it)}</option>`).join("");
  }

  async function loadUsers(){
    const { data, error } = await db
      .from("profiles")
      .select("id, username, nickname, role_id, party_id, created_at, roles(label), clan_groups(name)")
      .eq("clan_id", profile.clan_id)
      .order("created_at", { ascending: false });
    if(error){ console.error(error); return; }

    const body = document.getElementById("usersBody");
    body.innerHTML = "";

    data.forEach(u => {
      const isSelf = u.id === profile.id;
      const tr = document.createElement("tr");

      const tdUsername = document.createElement("td");
      tdUsername.textContent = u.username;

      const tdNickname = document.createElement("td");
      const nickInput = document.createElement("input");
      nickInput.type = "text";
      nickInput.value = u.nickname || "";
      nickInput.placeholder = "—";
      nickInput.style.width = "140px";
      async function saveNickname(){
        const errEl = document.getElementById("usersError");
        errEl.textContent = "";
        const val = nickInput.value.trim();
        nickInput.disabled = true;
        const { error } = await db.from("profiles").update({ nickname: val || null }).eq("id", u.id);
        if(error) errEl.textContent = "Не удалось сохранить ник: " + error.message;
        nickInput.disabled = false;
      }
      nickInput.addEventListener("blur", saveNickname);
      nickInput.addEventListener("keydown", (e) => { if(e.key === "Enter") nickInput.blur(); });
      tdNickname.appendChild(nickInput);

      const tdRole = document.createElement("td");
      if(isSelf){
        tdRole.textContent = u.roles?.label || "—";
      } else {
        const sel = document.createElement("select");
        roles.forEach(r => {
          const opt = document.createElement("option");
          opt.value = r.id;
          opt.textContent = r.label;
          if(r.id === u.role_id) opt.selected = true;
          sel.appendChild(opt);
        });
        sel.addEventListener("change", async () => {
          sel.disabled = true;
          const errEl = document.getElementById("usersError");
          errEl.textContent = "";
          const { error } = await db.from("profiles").update({ role_id: sel.value }).eq("id", u.id);
          if(error) errEl.textContent = "Не удалось изменить роль: " + error.message;
          sel.disabled = false;
        });
        tdRole.appendChild(sel);
      }

      const tdParty = document.createElement("td");
      if(isSelf){
        tdParty.textContent = u.clan_groups?.name || "—";
      } else {
        const partySel = document.createElement("select");
        const emptyOpt = document.createElement("option");
        emptyOpt.value = ""; emptyOpt.textContent = "—";
        partySel.appendChild(emptyOpt);
        parties.forEach(p => {
          const opt = document.createElement("option");
          opt.value = p.id; opt.textContent = p.name;
          if(p.id === u.party_id) opt.selected = true;
          partySel.appendChild(opt);
        });
        partySel.addEventListener("change", async () => {
          partySel.disabled = true;
          const errEl = document.getElementById("usersError");
          errEl.textContent = "";
          const { error } = await db.from("profiles").update({ party_id: partySel.value || null }).eq("id", u.id);
          if(error) errEl.textContent = "Не удалось изменить пати: " + error.message;
          partySel.disabled = false;
        });
        tdParty.appendChild(partySel);
      }

      const tdCreated = document.createElement("td");
      tdCreated.textContent = new Date(u.created_at).toLocaleDateString("ru-RU");

      const tdActions = document.createElement("td");
      if(!isSelf){
        const delBtn = document.createElement("button");
        delBtn.className = "btn btn-danger";
        delBtn.textContent = "Удалить";
        delBtn.addEventListener("click", async () => {
          if(!confirm(`Удалить пользователя «${u.username}»? Это необратимо.`)) return;
          delBtn.disabled = true;
          const errEl = document.getElementById("usersError");
          errEl.textContent = "";
          try{
            await L2Cabinet.adminDeleteUser(u.id);
            await loadUsers();
          }catch(err){
            errEl.textContent = "Не удалось удалить: " + err.message;
            delBtn.disabled = false;
          }
        });
        tdActions.appendChild(delBtn);
      }

      tr.append(tdUsername, tdNickname, tdRole, tdParty, tdCreated, tdActions);
      body.appendChild(tr);
    });
  }

  function escapeHtml(s){
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }

  async function loadMatrix(){
    const { data, error } = await db.from("role_sections")
      .select("role_id, section_key, visible")
      .eq("clan_id", profile.clan_id);
    if(error){ console.error(error); return; }
    const map = new Map(data.map(row => [row.role_id + "|" + row.section_key, row]));

    const table = document.getElementById("permMatrix");
    let html = "<tr><th>Роль</th>" + sections.map(s => `<th>${escapeHtml(s.label)}</th>`).join("") + "</tr>";
    roles.forEach(role => {
      html += `<tr><td>${escapeHtml(role.label)}</td>`;
      sections.forEach(sec => {
        const row = map.get(role.id + "|" + sec.key);
        const visible = row ? row.visible : false;
        const disabled = (sec.key === "admin" && role.key !== "glavadmin") ? "disabled" : "";
        html += `<td><input type="checkbox" data-role="${role.id}" data-section="${sec.key}" ${visible ? "checked" : ""} ${disabled} /></td>`;
      });
      html += "</tr>";
    });
    table.innerHTML = html;

    table.querySelectorAll("input[type=checkbox]").forEach(cb => {
      cb.addEventListener("change", async () => {
        const roleId = cb.dataset.role, sectionKey = cb.dataset.section;
        cb.disabled = true;
        const { error } = await db.from("role_sections")
          .upsert(
            { clan_id: profile.clan_id, role_id: roleId, section_key: sectionKey, visible: cb.checked },
            { onConflict: "clan_id,role_id,section_key" }
          );
        if(error) console.error(error);
        cb.disabled = false;
      });
    });
  }

  document.getElementById("createUserForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errEl = document.getElementById("createUserError");
    const okEl = document.getElementById("createUserOk");
    const btn = document.getElementById("createUserBtn");
    errEl.textContent = ""; okEl.textContent = "";
    btn.disabled = true;

    const username = document.getElementById("newUsername").value.trim();
    const password = document.getElementById("newPassword").value;
    const nickname = document.getElementById("newNickname").value.trim();
    const roleId = document.getElementById("newRole").value;
    const partyId = document.getElementById("newParty").value;
    const role = roles.find(r => r.id === roleId);

    try{
      await L2Cabinet.adminCreateUser({ username, password, nickname: nickname || null, role_key: role?.key, party_id: partyId || null });
      okEl.textContent = `Пользователь «${username}» создан.`;
      document.getElementById("createUserForm").reset();
      await loadUsers();
    }catch(err){
      errEl.textContent = "Не удалось создать: " + err.message;
    }finally{
      btn.disabled = false;
    }
  });

  await loadLookups();
  fillSelect(document.getElementById("newRole"), roles, r => escapeHtml(r.label), false);
  fillSelect(document.getElementById("newParty"), parties, p => escapeHtml(p.name), true);
  await Promise.all([loadUsers(), loadMatrix()]);
})();
</script>
</body>
</html>
