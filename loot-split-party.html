<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ДКП Пати — Кабинет клана</title>
<link rel="stylesheet" href="js/theme.css?v=13" />
<style>
  .ls-wrap{ padding:0 0 24px; }
  .ls-wrap .page-head{ margin-bottom:0; }
  .ls-filters{ display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin:2px 0 10px; }
  .ls-filters .field{ margin:0; }
  .ls-filters input[type="date"]{ min-width:150px; }
  .ls-filters input[type="number"]{ width:140px; }
  .ls-wrap .card{ padding-top:12px; }

  /* тот же приём, что в «ДКП Соло»/matrix-scroll: без своего overflow — таблица
     продолжается вниз и вбок вместе со всей страницей, не в отдельном "окошке" */
  .ls-table-scroll{ display:inline-block; vertical-align:top; overflow:visible; }
  /* строки-«карточки»: border-spacing по вертикали разводит соседние строки, а
     скруглённые левый/правый край первой/последней ячейки делает каждую строку
     отдельным закруглённым блоком — без цвета по значению, разница между
     колонками только в насыщенности/жирности шрифта */
  table.ls-table{ border-collapse:separate; border-spacing:0 8px; width:auto; font-size:13px; }
  table.ls-table th{
    padding:0 14px 10px;
    position:sticky; top:0; z-index:2;
    background: var(--panel);
    color: var(--text-dim); font-size:11px; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
    vertical-align:bottom; text-align:center;
  }
  /* угловая ячейка шапки «прилипает» сразу и сверху (top, как вся шапка), и слева
     (left, как колонка ников) — ей нужен z-index выше всех остальных sticky-ячеек,
     иначе при вертикальном скролле её перекрывает уезжающая шапка данных */
  table.ls-table th.ls-col-nick{ text-align:left; left:0; z-index:3; }
  table.ls-table th.ls-sortable{ cursor:pointer; user-select:none; }
  table.ls-table th.ls-sortable:hover{ color: var(--text); }
  table.ls-table tbody td{
    padding:14px;
    background: var(--panel-2);
    border-top:1px solid var(--border-lit);
    border-bottom:1px solid var(--border-lit);
    white-space:nowrap;
  }
  table.ls-table tbody tr:not(.ls-roster-row) td:first-child{ border-left:1px solid var(--border-lit); border-top-left-radius:10px; border-bottom-left-radius:10px; }
  table.ls-table tbody tr:not(.ls-roster-row) td:last-child{ border-right:1px solid var(--border-lit); border-top-right-radius:10px; border-bottom-right-radius:10px; }
  table.ls-table tbody td.ls-col-nick{
    position:sticky; left:0; z-index:1;
  }
  table.ls-table tbody tr:not(.ls-roster-row):hover td{ background: var(--panel); border-color: var(--gold-dim); }

  .ls-party{ display:flex; align-items:center; gap:10px; cursor:pointer; }
  .ls-party .avatar{
    width:32px; height:32px; flex:none;
    border-radius:50%; object-fit:cover;
    border:1px solid var(--border); background: var(--panel);
    transition: border-color .15s ease;
  }
  .ls-party:hover .avatar{ border-color: var(--border-lit); }
  .ls-party .who{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .ls-party .name{ color: var(--text); font-weight:600; display:flex; align-items:center; gap:6px; }
  /* стрелка-шеврон разворота — крутится через class="open" на .chevron, который
     ставит/снимает updateRosterOpenState() вместе с раскрытием самого списка */
  .ls-party .chevron{ display:inline-block; font-size:10px; color: var(--text-dim); transition: transform .18s ease; }
  .ls-party .chevron.open{ transform: rotate(90deg); }
  .ls-party .cnt{ font-size:11px; color: var(--text-dim); }

  /* список участников, выезжающий вниз под строкой пати при клике на её название —
     мини-таблица с теми же колонками, что и у пати целиком, но цифры уже личные:
     свои баллы явки, свой % буста, свой коэффициент (по классу, как в «ДКП Соло»),
     свои финальные баллы и своя доля голды пати. Своя рамка с акцентной левой
     полосой — чтобы визуально читалось как «выехавшая деталь» строки пати, а не
     ещё один самостоятельный кусок таблицы */
  tr.ls-roster-row td{ padding:0; border:none !important; background:none !important; border-radius:0 !important; }
  .ls-roster-wrap{
    max-height:0; opacity:0; overflow:hidden;
    transition: max-height .28s ease, opacity .2s ease;
  }
  .ls-roster-wrap.open{ max-height:900px; opacity:1; }
  .ls-roster-scroll{
    margin:0 10px 10px 42px;
    padding:6px;
    background: var(--panel);
    border:1px solid var(--border);
    border-left:2px solid var(--border-lit);
    border-radius:8px;
    overflow-x:auto;
  }
  table.ls-roster-table{ border-collapse:separate; border-spacing:0; width:auto; font-size:12px; }
  table.ls-roster-table th, table.ls-roster-table td{ padding:6px 10px; border-bottom:1px solid var(--border); white-space:nowrap; text-align:center; background:none; border-radius:0; }
  table.ls-roster-table thead th{ color: var(--text-dim); font-weight:600; font-size:10.5px; letter-spacing:.02em; text-transform:uppercase; }
  table.ls-roster-table th.ls-col-nick, table.ls-roster-table td.ls-col-nick{ text-align:left; }
  table.ls-roster-table th.ls-col-day, table.ls-roster-table td.ls-col-day{ width:32px; min-width:32px; max-width:32px; }
  table.ls-roster-table tbody tr:hover td{ background: var(--panel-2); }
  table.ls-roster-table tbody tr:last-child td{ border-bottom:none; }
  .ls-roster-item{ display:flex; align-items:center; gap:8px; cursor:pointer; }
  .ls-roster-item:hover .nm{ color: var(--gold); }
  .ls-roster-item .avatar{
    width:24px; height:24px; flex:none; border-radius:50%; object-fit:cover;
    border:1px solid var(--border); background: var(--panel-2);
  }
  .ls-roster-item .who{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .ls-roster-item .nm{ color: var(--text); font-weight:600; font-size:12.5px; }
  .ls-roster-item .cls{ font-size:10.5px; color: var(--text-dim); }

  .ls-num{ text-align:center; color: var(--text); font-variant-numeric: tabular-nums; }
  .ls-final{ text-align:center; color: var(--text); font-weight:700; font-size:14px; font-variant-numeric: tabular-nums; }
  .ls-gold{ text-align:center; color: var(--text); font-weight:700; font-size:14px; font-variant-numeric: tabular-nums; }

  table.ls-table th.ls-col-day, table.ls-table td.ls-col-day{ width:52px; min-width:52px; max-width:52px; text-align:center; }
  .ls-day-head{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .ls-day-icon-btn{
    width:28px; height:28px; padding:0; border-radius:8px;
    border:1px solid var(--border); background: var(--panel-2);
    color: var(--text-dim); font-size:13px; line-height:1; cursor:pointer;
    background-size:cover; background-position:center;
  }
  .ls-day-icon-btn:hover{ border-color: var(--border-lit); }
  .ls-day-icon-btn:disabled{ cursor:default; }
  .ls-day-wd{ font-size:10.5px; color: var(--text-dim); font-weight:600; }
  /* явка/неявка — тоже без цвета, только насыщенность: у нуля цифра тусклее и тоньше */
  .ls-mark{ color: var(--text); font-weight:600; }
  .ls-mark.zero{ color: var(--text-dim); opacity:.5; font-weight:400; }

  /* участник, которого нет в последней переписи — уже не в клане, но ещё числится
     в пати; красный крестик рядом с ником, никаких других изменений в расчётах */
  .ls-left-cross{ color: var(--danger-lit); font-weight:700; margin-left:4px; }
</style>
</head>
<body>

<div class="ls-wrap" id="wrap" style="display:none;">
  <div class="page-head">
    <h1 data-i18n="section.loot_split_party">ДКП Пати</h1>
  </div>

  <section class="card">
    <div class="ls-filters">
      <div class="field">
        <label for="fromDate" data-i18n="dkp.fromDateLabel">Начальная дата</label>
        <input type="date" id="fromDate" />
      </div>
      <div class="field">
        <label for="toDate" data-i18n="dkp.toDateLabel">Конечная дата</label>
        <input type="date" id="toDate" />
      </div>
      <div class="field">
        <label for="goldInput" data-i18n="dkp.goldLabel">Голда</label>
        <input type="number" id="goldInput" min="0" step="1" value="0" />
      </div>
      <button class="btn btn-primary" id="splitBtn" data-i18n="dkp.splitBtn">Разделить дроп</button>
      <button class="btn btn-danger" id="toPayoutBtn" data-i18n="dkp.toPayoutBtn" disabled style="display:none;">Раздать</button>
    </div>
    <p class="hint" id="toPayoutHint" style="margin:-4px 0 10px; display:none;"></p>
    <p class="error-msg" id="lsError"></p>

    <div class="ls-table-scroll">
      <table class="ls-table">
        <thead id="lsHead"></thead>
        <tbody id="lsBody"></tbody>
      </table>
    </div>
    <p class="empty-hint" id="lsEmpty" style="display:none;"></p>
  </section>
</div>

<input type="file" id="dayIconPicker" accept="image/*" style="display:none;" />

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js?v=19"></script>
<script src="js/classes.js?v=1"></script>
<script src="js/i18n.js?v=17"></script>
<script>
(async function(){
  const session = await L2Cabinet.requireSession();
  if(!session) return;

  const profile = await L2Cabinet.getProfile();
  if(!profile){
    document.body.innerHTML = '<div class="login-wrap"><div class="card login-card">' +
      '<h1>' + L2I18n.t("shell.profileNotFoundTitle", "⚠ Профиль не найден") + '</h1>' +
      '<p class="hint">' + L2I18n.t("common.contactLeader", "Обратитесь к клан-лидеру.") + '</p></div></div>';
    return;
  }

  const isAdmin = ["glavadmin", "admin"].includes(profile.roles?.key);
  const db = L2Cabinet.client;
  document.getElementById("wrap").style.display = "";
  // «Раздать» пишет общую на весь клан таблицу — доступно только админам
  if(isAdmin) document.getElementById("toPayoutBtn").style.display = "";

  function escapeHtml(s){
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }

  // перепись/явка/классы иногда пишут один и тот же ник по-разному (кириллица/латиница
  // похожих букв, регистр) — та же схема нормализации, что в «ДКП Соло»/reports.html
  const CYR_LOOKALIKES = { "а":"a","в":"b","е":"e","к":"k","м":"m","н":"h","о":"o","р":"p","с":"c","т":"t","у":"y","х":"x","ё":"e","0":"o","l":"i" };
  function normalizeNick(s){
    return String(s || "")
      .toLowerCase()
      .split("").map(ch => CYR_LOOKALIKES[ch] || ch).join("")
      .replace(/[^a-zа-яё0-9]/gi, "");
  }

  const BLANK_IMG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'></svg>";
  function classIcon(name){ return name && window.L2_CLASS_ICON ? window.L2_CLASS_ICON(name) : null; }

  let boostSections = [];
  let boostItems = [];
  let boostValueSet = new Set();   // `${nickname}|${item_id}`

  let partyCoefficients = new Map(); // group_id -> coefficient

  let events = [];                 // [{id, event_date, event_name, icon}] в диапазоне, по дате
  let attendedByEvent = new Map(); // event_id -> Set(normalizeNick)

  let parties = [];                // [{id, name, class_name, leader_nickname}] — видимые (не скрытые) пати
  let membersByGroup = new Map();  // group_id -> [nickname, ...]

  // последняя перепись — чтобы пометить красным крестиком тех, кто ещё числится
  // в пати (в «Группах»), но уже пропал из клана; пусто, если переписи вообще нет —
  // тогда никого не помечаем (нечего сравнивать)
  let censusNormSet = new Set();
  // normalizeNick(nickname) -> самая свежая неделя переписи, в которой он вообще
  // встречался (не только последняя/предпоследняя) — для подсказки «был в
  // переписи от {дата}» у тех, кто пропал из клана давно, а не только на неделе
  let lastSeenWeekByNorm = new Map();
  async function loadCensus(){
    const { data } = await db.from("census_entries").select("nickname, week_start");
    const weeks = [...new Set((data || []).map(r => r.week_start))].sort();
    const latest = weeks.length ? weeks[weeks.length - 1] : null;
    censusNormSet = latest
      ? new Set((data || []).filter(r => r.week_start === latest).map(r => normalizeNick(r.nickname)))
      : new Set();
    lastSeenWeekByNorm = new Map();
    (data || []).forEach(r => {
      const norm = normalizeNick(r.nickname);
      const prev = lastSeenWeekByNorm.get(norm);
      if(!prev || r.week_start > prev) lastSeenWeekByNorm.set(norm, r.week_start);
    });
  }
  function isLeftClan(nick){ return censusNormSet.size > 0 && !censusNormSet.has(normalizeNick(nick)); }
  function fmtDate(iso){
    if(!iso) return "";
    const [y, m, d] = iso.split("-");
    return `${d}.${m}.${y}`;
  }
  function leftClanTitleOf(nick){
    const lastWeek = lastSeenWeekByNorm.get(normalizeNick(nick));
    if(lastWeek) return L2I18n.t("dkp.leftClanTitleWithDate", "Уже не в клане — был в переписи от {date}").replace("{date}", fmtDate(lastWeek));
    // не просто «пропал из последней переписи», а вообще ни разу не встречался
    // ни в одной неделе — отдельный явный текст, чтобы не выглядело как
    // «подсказка не работает» на фоне остальных строк с датой
    return L2I18n.t("dkp.leftClanTitleNoHistory", "Уже не в клане — в переписи вообще не встречался");
  }

  let lastRows = [];               // последний посчитанный «Разделить дроп»

  async function loadParties(){
    const [{ data: groups }, { data: members }] = await Promise.all([
      db.from("clan_groups").select("id, name, sort_order, class_name, leader_nickname").eq("hidden", false).order("sort_order").order("name"),
      db.from("clan_group_members").select("group_id, nickname"),
    ]);
    parties = groups || [];
    membersByGroup = new Map();
    (members || []).forEach(r => {
      if(!membersByGroup.has(r.group_id)) membersByGroup.set(r.group_id, []);
      membersByGroup.get(r.group_id).push(r.nickname);
    });
  }

  // ---- клик на название пати выкатывает вниз список её участников с профессиями
  // (клик на ник — переход в его личный кабинет; my-cabinet.html сам проверит права,
  // тут дублировать проверку лидера/зама не нужно) ----
  let memberClassByNorm = new Map(); // normalizeNick(nick) -> {class_name, class_name_2, icon}
  async function loadMemberClasses(){
    const { data } = await db.from("member_classes").select("nickname, class_name, class_name_2, icon");
    memberClassByNorm = new Map();
    (data || []).forEach(r => memberClassByNorm.set(normalizeNick(r.nickname), r));
  }
  function classLabelOf(nick){
    const info = memberClassByNorm.get(normalizeNick(nick));
    if(!info || !info.class_name) return L2I18n.t("cab.classNotSet", "Класс не указан");
    return info.class_name_2 ? `${info.class_name} / ${info.class_name_2}` : info.class_name;
  }
  function rosterAvatarOf(nick){
    const info = memberClassByNorm.get(normalizeNick(nick));
    return (info && info.icon) || classIcon(info && info.class_name) || BLANK_IMG;
  }
  // мини-таблица личной статистики участника внутри раскрытой пати — те же колонки,
  // что и у пати целиком (m.initial/pct/coef/final/gold считаются в computeRows ниже)
  function memberRowHtml(m){
    let html = `<tr>` +
      `<td class="ls-col-nick"><div class="ls-roster-item" data-nick="${escapeHtml(m.nick)}">` +
      `<img class="avatar" src="${rosterAvatarOf(m.nick)}" alt="" />` +
      `<span class="who"><span class="nm">${escapeHtml(m.nick)}${isLeftClan(m.nick) ? ` <span class="ls-left-cross" title="${escapeHtml(leftClanTitleOf(m.nick))}">✗</span>` : ""}</span><span class="cls">${escapeHtml(classLabelOf(m.nick))}</span></span>` +
      `</div></td>` +
      `<td class="ls-num">${m.initial}</td>` +
      `<td class="ls-num">${m.pct.toFixed(2)}%</td>` +
      `<td class="ls-num">${m.coef}</td>` +
      `<td class="ls-final">${m.final.toFixed(2)}</td>` +
      `<td class="ls-gold">${fmtInt(m.gold)}</td>`;
    events.forEach(e => {
      const was = (attendedByEvent.get(e.id) || new Set()).has(m.norm);
      html += `<td class="ls-col-day"><span class="ls-mark${was ? "" : " zero"}">${was ? 1 : 0}</span></td>`;
    });
    html += `</tr>`;
    return html;
  }

  function rosterTableHtml(memberRows){
    if(!memberRows.length){
      return `<p class="hint" style="margin:0;">${L2I18n.t("dkp.noMembersInRoster", "Участников нет.")}</p>`;
    }
    const sorted = memberRows.slice().sort((a, b) => a.nick.localeCompare(b.nick));
    let h = `<table class="ls-roster-table"><thead><tr>` +
      `<th class="ls-col-nick">${L2I18n.t("dkp.colNick", "Участники")}</th>` +
      `<th>${L2I18n.t("dkp.colInitial", "Начальные баллы")}</th>` +
      `<th>${L2I18n.t("dkp.colPct", "% буста")}</th>` +
      `<th>${L2I18n.t("dkp.colCoef", "Коэффициент")}</th>` +
      `<th>${L2I18n.t("dkp.colFinal", "Финальные баллы")}</th>` +
      `<th>${L2I18n.t("dkp.goldLabel", "Голда")}</th>`;
    events.forEach(e => {
      const dt = new Date(e.event_date + "T00:00:00");
      const dateLabel = String(dt.getDate()).padStart(2, "0") + "." + String(dt.getMonth() + 1).padStart(2, "0");
      h += `<th class="ls-col-day">${dateLabel}</th>`;
    });
    h += `</tr></thead><tbody>${sorted.map(memberRowHtml).join("")}</tbody></table>`;
    return h;
  }

  let expandedPartyId = null; // id пати, чей список участников сейчас раскрыт (одна за раз)
  function updateRosterOpenState(){
    document.querySelectorAll(".ls-roster-wrap").forEach(w => {
      w.classList.toggle("open", w.dataset.partyId === expandedPartyId);
    });
    document.querySelectorAll(".ls-party").forEach(p => {
      p.querySelector(".chevron")?.classList.toggle("open", p.dataset.partyId === expandedPartyId);
    });
  }

  async function loadBoostStructure(){
    const [{ data: s }, { data: it }] = await Promise.all([
      db.from("boost_sections").select("id, sort_order").order("sort_order"),
      db.from("boost_items")
        .select("id, section_id, name, weight, sort_order, subgroup, hidden, merged_with_prev, merge_all_required")
        .order("sort_order"),
    ]);
    boostSections = s || [];
    boostItems = (it || []).map(x => ({ ...x, weight: Number(x.weight) }));
  }

  async function loadBoostValues(){
    const { data } = await db.from("boost_member_values").select("nickname, item_id, enabled");
    boostValueSet = new Set();
    (data || []).forEach(r => { if(r.enabled) boostValueSet.add(r.nickname + "|" + r.item_id); });
  }

  // ---- те же формулы, что в «Проверке буста»/«ДКП Соло», чтобы % совпадал 1-в-1 ----
  function itemsOfSection(secId){
    return boostItems.filter(i => i.section_id === secId).sort((a,b)=> a.sort_order - b.sort_order || a.name.localeCompare(b.name));
  }
  function orderedBoostItems(){
    return boostSections.flatMap(s => itemsOfSection(s.id)).filter(i => !i.hidden);
  }
  function mergeGroups(list){
    const out = [];
    list.forEach(item => {
      const prev = out[out.length - 1];
      const sameBlock = prev && prev[0].section_id === item.section_id && (prev[0].subgroup || "") === (item.subgroup || "");
      if(item.merged_with_prev && sameBlock) prev.push(item);
      else out.push([item]);
    });
    return out;
  }
  function isAllRequired(group){ return group.length > 1 && group.some(i => i.merge_all_required); }
  function groupScore(group, nick){
    const onItems = group.filter(i => boostValueSet.has(nick + "|" + i.id));
    if(isAllRequired(group)) return onItems.length === group.length ? group.reduce((s,i)=>s+i.weight,0) : 0;
    return onItems.reduce((s,i)=>s+i.weight,0);
  }
  function maxBoostScore(){ return orderedBoostItems().reduce((s,i)=> s + i.weight, 0); }
  function boostScoreOf(nick){ return mergeGroups(orderedBoostItems()).reduce((s,g)=> s + groupScore(g, nick), 0); }
  // «Минимальный % буста» (Админ-панель → «ДКП») — только пока реальный балл
  // человека ровно 0 (в «Проверке буста» ничего не отмечено); хоть один
  // отмеченный пункт сразу возвращает приоритет реальному проценту
  function percentOf(nick){
    if(minBoostPercent > 0 && boostScoreOf(nick) === 0) return minBoostPercent;
    const mx = maxBoostScore();
    return mx ? (boostScoreOf(nick) / mx) * 100 : 0;
  }
  // коэффициент задаётся прямо на пати (Админ-панель → «Правила клана», список
  // рядом с коэффициентами профессий) — не считается средним по участникам
  async function loadPartyCoefficients(){
    const { data } = await db.from("loot_party_coefficients").select("group_id, coefficient");
    partyCoefficients = new Map((data || []).map(r => [r.group_id, Number(r.coefficient)]));
  }
  function coefficientOf(partyId){
    const c = partyCoefficients.get(partyId);
    return c === undefined ? 1 : c;
  }

  // коэффициент КОНКРЕТНОГО участника (по его классу) — та же настройка «Раздел
  // дропа» в Админ-панели, что и в «ДКП Соло»; нужен только для личной статистики
  // внутри раскрытой пати, саму пати эти коэффициенты не затрагивают
  let classCoefficients = new Map(); // class_name -> coefficient
  async function loadClassCoefficients(){
    const { data } = await db.from("loot_class_coefficients").select("class_name, coefficient");
    classCoefficients = new Map((data || []).map(r => [r.class_name, Number(r.coefficient)]));
  }
  function memberCoefficientOf(nick){
    const info = memberClassByNorm.get(normalizeNick(nick));
    const cls = info && info.class_name;
    if(!cls) return 1;
    const c = classCoefficients.get(cls);
    return c === undefined ? 1 : c;
  }

  // «показывать только тех, кто хоть раз ходил» — общая с «ДКП Соло» настройка из
  // Админ-панели → «ДКП»; здесь означает «пати, где вообще была явка»
  let hideZeroAttendance = false;
  // «Минимальный % буста» — тоже общая с «ДКП Соло» настройка; см. percentOf() выше
  let minBoostPercent = 0;
  async function loadLootSplitSettings(){
    const { data } = await db.from("loot_split_settings").select("hide_zero_attendance, min_boost_percent").eq("clan_id", profile.clan_id).maybeSingle();
    hideZeroAttendance = !!data?.hide_zero_attendance;
    minBoostPercent = Number(data?.min_boost_percent) || 0;
  }

  // «Коэффициент пати-лидерам» — свой множитель для каждого текущего пати-лидера
  // (Админ-панель → «ДКП»); коэффициенты не складываются — у лидера этот множитель
  // ЗАМЕНЯЕТ коэффициент профессии целиком, не умножается на него
  let leaderCoefByNorm = new Map(); // normalizeNick(nickname) -> coefficient
  async function loadLootLeaderCoefficients(){
    const { data } = await db.from("loot_leader_coefficients").select("nickname, coefficient");
    leaderCoefByNorm = new Map((data || []).map(r => [normalizeNick(r.nickname), Number(r.coefficient)]));
  }
  function leaderCoefficientOf(nick){
    const c = leaderCoefByNorm.get(normalizeNick(nick));
    return c === undefined ? 1 : c;
  }

  async function loadEventsAndAttendance(fromStr, toStr){
    const { data: evs, error: evErr } = await db
      .from("attendance_events")
      .select("id, event_date, event_name, icon")
      .gte("event_date", fromStr)
      .lte("event_date", toStr)
      .order("event_date");
    if(evErr){ console.error(evErr); events = []; attendedByEvent = new Map(); return; }
    events = evs || [];

    attendedByEvent = new Map();
    const eventIds = events.map(e => e.id);
    if(!eventIds.length) return;

    const { data: entries, error: entErr } = await db
      .from("attendance_entries")
      .select("nickname, event_id")
      .in("event_id", eventIds);
    if(entErr){ console.error(entErr); return; }
    (entries || []).forEach(row => {
      const norm = normalizeNick(row.nickname);
      if(!attendedByEvent.has(row.event_id)) attendedByEvent.set(row.event_id, new Set());
      attendedByEvent.get(row.event_id).add(norm);
    });
  }

  function fmtInt(n){ return Math.round(n).toLocaleString(L2I18n.locale()); }

  // начальные баллы пати — суммарная явка всех её участников (сколько раз кто-то
  // из пати отметился на мероприятии, сложено по всем); % буста — среднее по
  // участникам пати; коэффициент — не среднее, а прямая настройка на саму пати
  // (Админ-панель → «Правила клана»). Личная статистика каждого участника (memberRows)
  // считается отдельно, теми же формулами, что и в «ДКП Соло» — она нужна только
  // для раскрывающегося списка участников, на саму пати не влияет.
  function computeRows(){
    return parties.map(party => {
      const roster = membersByGroup.get(party.id) || [];
      const isLeader = (nick) => party.leader_nickname && normalizeNick(nick) === normalizeNick(party.leader_nickname);
      const memberRows = roster.map(nick => {
        const norm = normalizeNick(nick);
        const mInitial = events.reduce((s, e) => s + ((attendedByEvent.get(e.id) || new Set()).has(norm) ? 1 : 0), 0);
        const mPct = percentOf(nick);
        // коэффициенты не стакаются: лидер пати получает ТОЛЬКО свой личный
        // коэффициент лидера (полностью вместо коэффициента профессии, а не
        // поверх него); остальные участники — как раньше, коэффициент профессии
        const mCoef = isLeader(nick) ? leaderCoefficientOf(nick) : memberCoefficientOf(nick);
        const mFinal = Math.round(mInitial * (mPct / 100) * mCoef * 4) / 4;
        return { nick, norm, initial: mInitial, pct: mPct, coef: mCoef, final: mFinal };
      });
      const initial = memberRows.reduce((s, m) => s + m.initial, 0);
      const pct = roster.length ? roster.reduce((s, nick) => s + percentOf(nick), 0) / roster.length : 0;
      const coef = coefficientOf(party.id);
      // доли округляются до четверти — та же логика, что и в «ДКП Соло»
      const final = Math.round(initial * (pct / 100) * coef * 4) / 4;
      return { party, roster, memberRows, initial, pct, coef, final };
    });
  }

  function applyGold(rows){
    const gold = Number(document.getElementById("goldInput").value) || 0;
    const sumFinal = rows.reduce((s,r)=> s + r.final, 0);
    const rate = sumFinal ? gold / sumFinal : 0;
    rows.forEach(r => { r.gold = r.final * rate; });
    return rows;
  }

  // голда пати делится между её участниками пропорционально их личным финальным
  // баллам — второй уровень того же принципа, что «сумма → пати» выше
  function applyMemberGold(rows){
    rows.forEach(r => {
      const sumMemberFinal = r.memberRows.reduce((s, m) => s + m.final, 0);
      r.memberRows.forEach(m => { m.gold = sumMemberFinal ? (m.final / sumMemberFinal) * r.gold : 0; });
    });
    return rows;
  }

  // сортировка по клику на заголовок — та же схема, что в «ДКП Соло»/«Отчёте по
  // мероприятиям»: повторный клик по той же колонке переключает направление.
  // По умолчанию — голда по убыванию (сначала самые большие суммы)
  let sortKey = "gold";
  let sortDir = "desc";
  function sortRows(rows){
    return rows.slice().sort((a, b) => {
      const mul = sortDir === "asc" ? 1 : -1;
      if(sortKey === "name") return a.party.name.localeCompare(b.party.name) * mul;
      return (a[sortKey] - b[sortKey]) * mul || a.party.name.localeCompare(b.party.name);
    });
  }
  function sortArrow(key){ return sortKey === key ? (sortDir === "asc" ? " ▲" : " ▼") : ""; }
  function sortableTh(key, label, extraClass){
    const cls = "ls-sortable" + (extraClass ? " " + extraClass : "");
    return `<th class="${cls}" data-sort-key="${key}">${escapeHtml(label)}${sortArrow(key)}</th>`;
  }

  function renderHead(){
    const head = document.getElementById("lsHead");
    let h = '<tr>' +
      sortableTh("name", L2I18n.t("dkp.colParty", "Пати"), "ls-col-nick") +
      sortableTh("initial", L2I18n.t("dkp.colInitial", "Начальные баллы")) +
      sortableTh("pct", L2I18n.t("dkp.colPct", "% буста")) +
      sortableTh("coef", L2I18n.t("dkp.colCoef", "Коэффициент")) +
      sortableTh("final", L2I18n.t("dkp.colFinal", "Финальные баллы")) +
      sortableTh("gold", L2I18n.t("dkp.goldLabel", "Голда"));
    events.forEach(e => {
      const dt = new Date(e.event_date + "T00:00:00");
      const dateLabel = String(dt.getDate()).padStart(2, "0") + "." + String(dt.getMonth() + 1).padStart(2, "0");
      const title = escapeHtml((e.event_name || "") + " — " + e.event_date);
      const bg = e.icon ? ` style="background-image:url('${e.icon}')"` : "";
      h += `<th class="ls-col-day" title="${title}"><div class="ls-day-head">` +
        `<button type="button" class="ls-day-icon-btn" data-event="${e.id}"${bg} ${isAdmin ? "" : "disabled"}>${e.icon ? "" : "+"}</button>` +
        `<span class="ls-day-wd">${dateLabel}</span></div></th>`;
    });
    h += "</tr>";
    head.innerHTML = h;

    head.querySelectorAll(".ls-sortable").forEach(th => {
      th.addEventListener("click", () => {
        const key = th.dataset.sortKey;
        if(sortKey === key) sortDir = sortDir === "asc" ? "desc" : "asc";
        else { sortKey = key; sortDir = key === "name" ? "asc" : "desc"; }
        renderTable(lastRows);
      });
    });

    if(isAdmin){
      head.querySelectorAll(".ls-day-icon-btn").forEach(btn => {
        btn.addEventListener("click", () => openDayIconPicker(btn.dataset.event));
      });
    }
  }

  function renderBody(rows){
    const body = document.getElementById("lsBody");
    body.innerHTML = "";
    const colspan = 6 + events.length;
    rows.forEach(r => {
      const tr = document.createElement("tr");
      const avatarSrc = classIcon(r.party.class_name) || BLANK_IMG;
      const leaderText = r.party.leader_nickname ? L2I18n.t("dkp.leaderPrefix", " · лидер ") + escapeHtml(r.party.leader_nickname) : "";
      const chevronOpen = expandedPartyId === r.party.id ? " open" : "";
      let html = `<td class="ls-col-nick"><div class="ls-party" data-party-id="${r.party.id}"><img class="avatar" src="${avatarSrc}" alt="" />` +
        `<span class="who"><span class="name"><span class="chevron${chevronOpen}">▸</span>${escapeHtml(r.party.name)}</span>` +
        `<span class="cnt">${r.roster.length}${L2I18n.t("dkp.membersCountSuffix", " участников")}${leaderText}</span></span></div></td>`;
      html += `<td class="ls-num">${r.initial}</td>`;
      html += `<td class="ls-num">${r.pct.toFixed(2)}%</td>`;
      html += `<td class="ls-num">${r.coef.toFixed(2)}</td>`;
      html += `<td class="ls-final">${r.final.toFixed(2)}</td>`;
      html += `<td class="ls-gold">${fmtInt(r.gold)}</td>`;
      events.forEach(e => {
        const set = attendedByEvent.get(e.id) || new Set();
        const count = r.roster.filter(nick => set.has(normalizeNick(nick))).length;
        html += `<td class="ls-col-day"><span class="ls-mark${count > 0 ? "" : " zero"}">${count}</span></td>`;
      });
      tr.innerHTML = html;
      body.appendChild(tr);

      const rosterTr = document.createElement("tr");
      rosterTr.className = "ls-roster-row";
      const itemsHtml = rosterTableHtml(r.memberRows);
      const openCls = expandedPartyId === r.party.id ? " open" : "";
      rosterTr.innerHTML = `<td colspan="${colspan}"><div class="ls-roster-wrap${openCls}" data-party-id="${r.party.id}">` +
        `<div class="ls-roster-scroll">${itemsHtml}</div></div></td>`;
      body.appendChild(rosterTr);
    });
  }

  let hasSplit = false; // «Разделить дроп» ещё не нажимали — пока рано говорить, что мероприятий нет

  function renderTable(rows){
    renderHead();
    renderBody(sortRows(rows));
    const emptyEl = document.getElementById("lsEmpty");
    if(!parties.length){
      emptyEl.textContent = L2I18n.t("dkp.emptyNoPartiesYet", "Пати ещё не заведены — сначала создайте их в разделе «Группы».");
      emptyEl.style.display = "";
    } else if(!hasSplit){
      emptyEl.textContent = L2I18n.t("dkp.emptySetPeriod", "Укажите период и нажмите «Разделить дроп».");
      emptyEl.style.display = "";
    } else if(!events.length){
      emptyEl.textContent = L2I18n.t("dkp.emptyNoEvents", "За выбранный период нет мероприятий в «Журнале посещаемости».");
      emptyEl.style.display = "";
    } else if(!rows.length && hideZeroAttendance){
      emptyEl.textContent = L2I18n.t("dkp.emptyHiddenZeroParty", "Ни в одной пати за этот период не было явки — настройка «Показывать только тех, кто хоть раз ходил» (Админ-панель → «Правила клана») скрыла всех.");
      emptyEl.style.display = "";
    } else {
      emptyEl.style.display = "none";
    }
  }

  async function doSplit(){
    const errEl = document.getElementById("lsError");
    errEl.textContent = "";
    const fromStr = document.getElementById("fromDate").value;
    const toStr = document.getElementById("toDate").value;
    if(!fromStr || !toStr){ errEl.textContent = L2I18n.t("dkp.validateBothDates", "Укажите начальную и конечную дату."); return; }
    if(fromStr > toStr){ errEl.textContent = L2I18n.t("dkp.validateDateOrder", "Начальная дата позже конечной."); return; }

    document.getElementById("splitBtn").disabled = true;
    await loadEventsAndAttendance(fromStr, toStr);
    hasSplit = true;
    const rows = computeRows().filter(r => !hideZeroAttendance || r.initial > 0);
    lastRows = applyMemberGold(applyGold(rows));
    renderTable(lastRows);
    document.getElementById("splitBtn").disabled = false;
    document.getElementById("toPayoutBtn").disabled = !lastRows.length;
  }

  // «Раздать» пишет посчитанную личную голду каждого участника пати (не саму
  // пати целиком) и период в общую на весь клан таблицу payout_batches — не
  // sessionStorage, тот виден только в браузере того, кто нажал, соседний
  // пати-лидер на своём устройстве его не видел. «Раздача» больше не считает
  // голду сама, а показывает именно эти суммы; каждый пати-лидер при заходе
  // видит только свою часть — см. loot-payout.html
  document.getElementById("toPayoutBtn").addEventListener("click", async () => {
    if(!lastRows.length) return;
    const btn = document.getElementById("toPayoutBtn");
    const hintEl = document.getElementById("toPayoutHint");
    btn.disabled = true;
    const goldByNick = {};
    lastRows.forEach(r => { r.memberRows.forEach(m => { goldByNick[m.nick] = m.gold; }); });
    const { error } = await db.from("payout_batches").upsert(
      {
        clan_id: profile.clan_id,
        from_date: document.getElementById("fromDate").value,
        to_date: document.getElementById("toDate").value,
        gold_by_nick: goldByNick,
        source: "party",
        created_by: profile.id,
        created_at: new Date().toISOString(),
      },
      { onConflict: "clan_id" }
    );
    if(error){
      document.getElementById("lsError").textContent = L2I18n.t("dkp.payoutSaveFailed", "Не удалось отправить в раздачу: ") + error.message;
    } else {
      hintEl.textContent = L2I18n.t("dkp.payoutSentHint", "Отправлено — у каждого пати-лидера в «Раздаче» появится своя часть (на 24 часа).");
      hintEl.style.display = "";
      if(window.top && window.top.L2Nav) window.top.L2Nav.openSection("loot_payout");
    }
    btn.disabled = false;
  });

  // клик на название пати — раскрыть/свернуть список участников (одна пати за раз);
  // клик на участника внутри списка — перейти в его личный кабинет
  document.getElementById("lsBody").addEventListener("click", (e) => {
    const partyEl = e.target.closest(".ls-party");
    if(partyEl){
      const id = partyEl.dataset.partyId;
      expandedPartyId = (expandedPartyId === id) ? null : id;
      updateRosterOpenState();
      return;
    }
    const rosterItem = e.target.closest(".ls-roster-item");
    if(rosterItem){
      const nick = rosterItem.dataset.nick;
      if(window.top && window.top.L2Nav) window.top.L2Nav.openMyCabinet(nick, "loot_split_party");
    }
  });
  // клик где угодно вне раскрытого списка и вне названия пати — свернуть его
  document.addEventListener("click", (e) => {
    if(!expandedPartyId) return;
    if(e.target.closest(".ls-party") || e.target.closest(".ls-roster-wrap")) return;
    expandedPartyId = null;
    updateRosterOpenState();
  });

  document.getElementById("splitBtn").addEventListener("click", doSplit);
  // сумму голды можно поменять без повторного пересчёта явки/буста — просто
  // перераспределяем уже посчитанные финальные баллы по новой сумме
  document.getElementById("goldInput").addEventListener("input", () => {
    saveDkpFilters();
    if(!lastRows.length) return;
    applyMemberGold(applyGold(lastRows));
    renderBody(sortRows(lastRows));
  });
  // поле голды обычно стоит на «0» — начать печатать сумму поверх него неудобно
  // (получится «05» и т.п.), поэтому при заходе в поле нулевое значение само
  // убирается; уже вписанную ранее (в т.ч. восстановленную) сумму не трогаем
  document.getElementById("goldInput").addEventListener("focus", (e) => {
    if(e.target.value === "0") e.target.value = "";
  });
  // Enter в поле голды сразу запускает «Разделить дроп» — не обязательно тянуться к кнопке
  document.getElementById("goldInput").addEventListener("keydown", (e) => {
    if(e.key === "Enter"){ e.preventDefault(); doSplit(); }
  });

  // ---- иконка над столбцом мероприятия (только админ) — та же attendance_events,
  // что и в «ДКП Соло»/явке, поэтому иконка, поставленная тут, видна и там тоже ----
  let pickerTargetEventId = null;
  function openDayIconPicker(eventId){
    pickerTargetEventId = eventId;
    document.getElementById("dayIconPicker").click();
  }
  function resizeImageFile(file, maxSize){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
          const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/png"));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  document.getElementById("dayIconPicker").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if(!file || !pickerTargetEventId) return;
    const dataUrl = await resizeImageFile(file, 64);
    const { error } = await db.from("attendance_events").update({ icon: dataUrl }).eq("id", pickerTargetEventId);
    if(error){ document.getElementById("lsError").textContent = L2I18n.t("dkp.saveIconFailed", "Не удалось сохранить иконку: ") + error.message; return; }
    const ev = events.find(x => x.id === pickerTargetEventId);
    if(ev) ev.icon = dataUrl;
    renderHead();
  });

  // запоминаем период + сумму голды в localStorage — переживает переход на
  // другие разделы сайта (раздел живёт в iframe и перезагружается с нуля при
  // каждом открытии, в т.ч. при возврате из личного кабинета участника) и
  // закрытие вкладки; у «ДКП Соло»/«ДКП Пати» своя память, суммы у них обычно разные
  const DKP_FILTERS_KEY = "l2DkpPartyFilters";
  function saveDkpFilters(){
    localStorage.setItem(DKP_FILTERS_KEY, JSON.stringify({
      from: document.getElementById("fromDate").value,
      to: document.getElementById("toDate").value,
      gold: document.getElementById("goldInput").value,
    }));
  }
  function restoreDkpFilters(){
    let st;
    try{ st = JSON.parse(localStorage.getItem(DKP_FILTERS_KEY) || "null"); }catch(e){ st = null; }
    if(!st) return false;
    if(st.from) document.getElementById("fromDate").value = st.from;
    if(st.to) document.getElementById("toDate").value = st.to;
    if(st.gold != null && st.gold !== "") document.getElementById("goldInput").value = st.gold;
    return !!(st.from && st.to);
  }
  document.getElementById("fromDate").addEventListener("change", saveDkpFilters);
  document.getElementById("toDate").addEventListener("change", saveDkpFilters);

  await Promise.all([loadParties(), loadBoostStructure(), loadBoostValues(), loadPartyCoefficients(), loadClassCoefficients(), loadLootSplitSettings(), loadLootLeaderCoefficients(), loadMemberClasses(), loadCensus()]);
  renderTable([]);
  if(restoreDkpFilters()) await doSplit();

  // заголовки/список участников/пустые состояния построены через JS (не data-i18n) —
  // перестраиваем при смене языка; expandedPartyId — обычная переменная замыкания,
  // renderTable сам восстановит раскрытое состояние по ней
  window.addEventListener("storage", (e) => {
    if(e.key === "l2Lang") renderTable(lastRows);
  });
})();
</script>
</body>
</html>
