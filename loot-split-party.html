<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ДКП Пати — Кабинет клана</title>
<link rel="stylesheet" href="js/theme.css?v=12" />
<style>
  .ls-wrap{ padding:0 0 24px; }
  .ls-wrap .page-head{ margin-bottom:0; }
  .ls-filters{ display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin:2px 0 10px; }
  .ls-filters .field{ margin:0; }
  .ls-filters input[type="date"]{ min-width:150px; }
  .ls-filters input[type="number"]{ width:140px; }
  .ls-wrap .card{ padding-top:12px; }

  /* тот же приём, что в «ДКП Соло»/matrix-scroll: без своего overflow — таблица
     продолжается вниз и вбок вместе со всей страницей, не в отдельном "окошке" */
  .ls-table-scroll{ display:inline-block; vertical-align:top; overflow:visible; }
  table.ls-table{ border-collapse:separate; border-spacing:0; width:auto; font-size:13px; }
  table.ls-table th, table.ls-table td{ padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
  table.ls-table thead th{
    position:sticky; top:0; z-index:2;
    background: var(--panel);
    color: var(--text-dim); font-size:12px; font-weight:500; letter-spacing:0;
    vertical-align:bottom; text-align:center;
  }
  table.ls-table thead th.ls-col-nick{ text-align:left; }
  table.ls-table thead th.ls-sortable{ cursor:pointer; user-select:none; }
  table.ls-table thead th.ls-sortable:hover{ color: var(--text); }
  table.ls-table .ls-col-nick{
    position:sticky; left:0; z-index:1;
    background: var(--panel-2);
    box-shadow: 2px 0 6px rgba(0,0,0,.35);
  }
  table.ls-table thead th.ls-col-nick{ z-index:3; background: var(--panel); box-shadow:none; }
  table.ls-table tbody tr:hover td{ background: rgba(255,255,255,.03); }
  table.ls-table tbody tr:hover td.ls-col-nick{ background: var(--panel-2); }

  .ls-party{ display:flex; align-items:center; gap:10px; cursor:pointer; }
  .ls-party .avatar{
    width:32px; height:32px; flex:none;
    border-radius:50%; object-fit:cover;
    border:1px solid var(--border); background: var(--panel-2);
  }
  .ls-party .who{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .ls-party .name{ color: var(--text); font-weight:600; }
  .ls-party .cnt{ font-size:11px; color: var(--text-dim); }

  /* список участников, выезжающий вниз под строкой пати при клике на её название */
  tr.ls-roster-row td{ padding:0; border-bottom:none; background:none !important; }
  tr.ls-roster-row:hover td{ background:none !important; }
  .ls-roster-wrap{
    max-height:0; opacity:0; overflow:hidden;
    transition: max-height .28s ease, opacity .2s ease;
  }
  .ls-roster-wrap.open{ max-height:900px; opacity:1; }
  .ls-roster-list{ display:flex; flex-direction:column; gap:6px; padding:4px 10px 14px; max-width:360px; }
  .ls-roster-item{
    display:flex; align-items:center; gap:10px;
    background: var(--panel-2); border:1px solid var(--border); border-radius:7px;
    padding:6px 10px; cursor:pointer; white-space:normal;
    transition: border-color .15s ease, background .15s ease;
  }
  .ls-roster-item:hover{ border-color: var(--border-lit); background: var(--panel); }
  .ls-roster-item .avatar{
    width:26px; height:26px; flex:none; border-radius:50%; object-fit:cover;
    border:1px solid var(--border); background: var(--panel);
  }
  .ls-roster-item .who{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .ls-roster-item .nm{ color: var(--text); font-weight:600; font-size:13px; }
  .ls-roster-item .cls{ font-size:11px; color: var(--text-dim); }

  .ls-num{ text-align:center; }
  .ls-final{ text-align:center; color: var(--gold); font-weight:700; }
  .ls-gold{ text-align:center; font-weight:700; }

  table.ls-table th.ls-col-day, table.ls-table td.ls-col-day{ width:56px; min-width:56px; max-width:56px; text-align:center; }
  .ls-day-head{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .ls-day-icon-btn{
    width:26px; height:26px; padding:0; border-radius:6px;
    border:1px solid var(--border); background: var(--panel-2);
    color: var(--text-dim); font-size:13px; line-height:1; cursor:pointer;
    background-size:cover; background-position:center;
  }
  .ls-day-icon-btn:hover{ border-color: var(--border-lit); }
  .ls-day-icon-btn:disabled{ cursor:default; }
  .ls-day-wd{ font-size:11px; color: var(--text-dim); }
  .ls-mark-yes{ color: var(--ok); font-weight:700; }
  .ls-mark-no{ color: var(--text-dim); opacity:.4; }
</style>
</head>
<body>

<div class="ls-wrap" id="wrap" style="display:none;">
  <div class="page-head">
    <h1 data-i18n="section.loot_split_party">ДКП Пати</h1>
  </div>

  <section class="card">
    <div class="ls-filters">
      <div class="field">
        <label for="fromDate" data-i18n="dkp.fromDateLabel">Начальная дата</label>
        <input type="date" id="fromDate" />
      </div>
      <div class="field">
        <label for="toDate" data-i18n="dkp.toDateLabel">Конечная дата</label>
        <input type="date" id="toDate" />
      </div>
      <div class="field">
        <label for="goldInput" data-i18n="dkp.goldLabel">Голда</label>
        <input type="number" id="goldInput" min="0" step="1" value="0" />
      </div>
      <button class="btn btn-primary" id="splitBtn" data-i18n="dkp.splitBtn">Разделить дроп</button>
    </div>
    <p class="hint" style="margin:0 0 10px;" data-i18n="dkp.partyPageHint">Тот же расчёт, что в «ДКП Соло», только по пати целиком: начальные баллы — суммарная явка всех участников пати, % буста и коэффициент — их среднее по пати, голда делится между пати пропорционально финальным баллам.</p>
    <p class="error-msg" id="lsError"></p>

    <div class="ls-table-scroll">
      <table class="ls-table">
        <thead id="lsHead"></thead>
        <tbody id="lsBody"></tbody>
      </table>
    </div>
    <p class="empty-hint" id="lsEmpty" style="display:none;"></p>
  </section>
</div>

<input type="file" id="dayIconPicker" accept="image/*" style="display:none;" />

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js?v=17"></script>
<script src="js/classes.js?v=1"></script>
<script src="js/i18n.js?v=1"></script>
<script>
(async function(){
  const session = await L2Cabinet.requireSession();
  if(!session) return;

  const profile = await L2Cabinet.getProfile();
  if(!profile){
    document.body.innerHTML = '<div class="login-wrap"><div class="card login-card">' +
      '<h1>' + L2I18n.t("shell.profileNotFoundTitle", "⚠ Профиль не найден") + '</h1>' +
      '<p class="hint">' + L2I18n.t("common.contactLeader", "Обратитесь к клан-лидеру.") + '</p></div></div>';
    return;
  }

  const isAdmin = ["glavadmin", "admin"].includes(profile.roles?.key);
  const db = L2Cabinet.client;
  document.getElementById("wrap").style.display = "";

  function escapeHtml(s){
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }

  // перепись/явка/классы иногда пишут один и тот же ник по-разному (кириллица/латиница
  // похожих букв, регистр) — та же схема нормализации, что в «ДКП Соло»/reports.html
  const CYR_LOOKALIKES = { "а":"a","в":"b","е":"e","к":"k","м":"m","н":"h","о":"o","р":"p","с":"c","т":"t","у":"y","х":"x","ё":"e","0":"o" };
  function normalizeNick(s){
    return String(s || "")
      .toLowerCase()
      .split("").map(ch => CYR_LOOKALIKES[ch] || ch).join("")
      .replace(/[^a-zа-яё0-9]/gi, "");
  }

  function dayShort(jsDay){ return L2I18n.t("common.day" + ((jsDay + 6) % 7)); } // jsDay: 0=вс..6=сб
  const BLANK_IMG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'></svg>";
  function classIcon(name){ return name && window.L2_CLASS_ICON ? window.L2_CLASS_ICON(name) : null; }

  let boostSections = [];
  let boostItems = [];
  let boostValueSet = new Set();   // `${nickname}|${item_id}`

  let partyCoefficients = new Map(); // group_id -> coefficient

  let events = [];                 // [{id, event_date, event_name, icon}] в диапазоне, по дате
  let attendedByEvent = new Map(); // event_id -> Set(normalizeNick)

  let parties = [];                // [{id, name, class_name, leader_nickname}] — видимые (не скрытые) пати
  let membersByGroup = new Map();  // group_id -> [nickname, ...]

  let lastRows = [];               // последний посчитанный «Разделить дроп»

  async function loadParties(){
    const [{ data: groups }, { data: members }] = await Promise.all([
      db.from("clan_groups").select("id, name, sort_order, class_name, leader_nickname").eq("hidden", false).order("sort_order").order("name"),
      db.from("clan_group_members").select("group_id, nickname"),
    ]);
    parties = groups || [];
    membersByGroup = new Map();
    (members || []).forEach(r => {
      if(!membersByGroup.has(r.group_id)) membersByGroup.set(r.group_id, []);
      membersByGroup.get(r.group_id).push(r.nickname);
    });
  }

  // ---- клик на название пати выкатывает вниз список её участников с профессиями
  // (клик на ник — переход в его личный кабинет; my-cabinet.html сам проверит права,
  // тут дублировать проверку лидера/зама не нужно) ----
  let memberClassByNorm = new Map(); // normalizeNick(nick) -> {class_name, class_name_2, icon}
  async function loadMemberClasses(){
    const { data } = await db.from("member_classes").select("nickname, class_name, class_name_2, icon");
    memberClassByNorm = new Map();
    (data || []).forEach(r => memberClassByNorm.set(normalizeNick(r.nickname), r));
  }
  function classLabelOf(nick){
    const info = memberClassByNorm.get(normalizeNick(nick));
    if(!info || !info.class_name) return L2I18n.t("cab.classNotSet", "Класс не указан");
    return info.class_name_2 ? `${info.class_name} / ${info.class_name_2}` : info.class_name;
  }
  function rosterAvatarOf(nick){
    const info = memberClassByNorm.get(normalizeNick(nick));
    return (info && info.icon) || classIcon(info && info.class_name) || BLANK_IMG;
  }
  function rosterItemHtml(nick){
    return `<div class="ls-roster-item" data-nick="${escapeHtml(nick)}">` +
      `<img class="avatar" src="${rosterAvatarOf(nick)}" alt="" />` +
      `<span class="who"><span class="nm">${escapeHtml(nick)}</span><span class="cls">${escapeHtml(classLabelOf(nick))}</span></span>` +
      `</div>`;
  }

  let expandedPartyId = null; // id пати, чей список участников сейчас раскрыт (одна за раз)
  function updateRosterOpenState(){
    document.querySelectorAll(".ls-roster-wrap").forEach(w => {
      w.classList.toggle("open", w.dataset.partyId === expandedPartyId);
    });
  }

  async function loadBoostStructure(){
    const [{ data: s }, { data: it }] = await Promise.all([
      db.from("boost_sections").select("id, sort_order").order("sort_order"),
      db.from("boost_items")
        .select("id, section_id, name, weight, sort_order, subgroup, hidden, merged_with_prev, merge_all_required")
        .order("sort_order"),
    ]);
    boostSections = s || [];
    boostItems = (it || []).map(x => ({ ...x, weight: Number(x.weight) }));
  }

  async function loadBoostValues(){
    const { data } = await db.from("boost_member_values").select("nickname, item_id, enabled");
    boostValueSet = new Set();
    (data || []).forEach(r => { if(r.enabled) boostValueSet.add(r.nickname + "|" + r.item_id); });
  }

  // ---- те же формулы, что в «Проверке буста»/«ДКП Соло», чтобы % совпадал 1-в-1 ----
  function itemsOfSection(secId){
    return boostItems.filter(i => i.section_id === secId).sort((a,b)=> a.sort_order - b.sort_order || a.name.localeCompare(b.name));
  }
  function orderedBoostItems(){
    return boostSections.flatMap(s => itemsOfSection(s.id)).filter(i => !i.hidden);
  }
  function mergeGroups(list){
    const out = [];
    list.forEach(item => {
      const prev = out[out.length - 1];
      const sameBlock = prev && prev[0].section_id === item.section_id && (prev[0].subgroup || "") === (item.subgroup || "");
      if(item.merged_with_prev && sameBlock) prev.push(item);
      else out.push([item]);
    });
    return out;
  }
  function isAllRequired(group){ return group.length > 1 && group.some(i => i.merge_all_required); }
  function groupScore(group, nick){
    const onItems = group.filter(i => boostValueSet.has(nick + "|" + i.id));
    if(isAllRequired(group)) return onItems.length === group.length ? group.reduce((s,i)=>s+i.weight,0) : 0;
    return onItems.reduce((s,i)=>s+i.weight,0);
  }
  function maxBoostScore(){ return orderedBoostItems().reduce((s,i)=> s + i.weight, 0); }
  function boostScoreOf(nick){ return mergeGroups(orderedBoostItems()).reduce((s,g)=> s + groupScore(g, nick), 0); }
  function percentOf(nick){
    const mx = maxBoostScore();
    return mx ? (boostScoreOf(nick) / mx) * 100 : 0;
  }
  function pctColor(p){
    if(p >= 90) return "var(--ok)";
    if(p >= 60) return "var(--gold)";
    return "var(--danger-lit)";
  }

  // коэффициент задаётся прямо на пати (Админ-панель → «Правила клана», список
  // рядом с коэффициентами профессий) — не считается средним по участникам
  async function loadPartyCoefficients(){
    const { data } = await db.from("loot_party_coefficients").select("group_id, coefficient");
    partyCoefficients = new Map((data || []).map(r => [r.group_id, Number(r.coefficient)]));
  }
  function coefficientOf(partyId){
    const c = partyCoefficients.get(partyId);
    return c === undefined ? 1 : c;
  }

  // «показывать только тех, кто хоть раз ходил» — общая с «ДКП Соло» настройка из
  // Админ-панели → «Правила клана»; здесь означает «пати, где вообще была явка»
  let hideZeroAttendance = false;
  async function loadLootSplitSettings(){
    const { data } = await db.from("loot_split_settings").select("hide_zero_attendance").eq("clan_id", profile.clan_id).maybeSingle();
    hideZeroAttendance = !!data?.hide_zero_attendance;
  }

  async function loadEventsAndAttendance(fromStr, toStr){
    const { data: evs, error: evErr } = await db
      .from("attendance_events")
      .select("id, event_date, event_name, icon")
      .gte("event_date", fromStr)
      .lte("event_date", toStr)
      .order("event_date");
    if(evErr){ console.error(evErr); events = []; attendedByEvent = new Map(); return; }
    events = evs || [];

    attendedByEvent = new Map();
    const eventIds = events.map(e => e.id);
    if(!eventIds.length) return;

    const { data: entries, error: entErr } = await db
      .from("attendance_entries")
      .select("nickname, event_id")
      .in("event_id", eventIds);
    if(entErr){ console.error(entErr); return; }
    (entries || []).forEach(row => {
      const norm = normalizeNick(row.nickname);
      if(!attendedByEvent.has(row.event_id)) attendedByEvent.set(row.event_id, new Set());
      attendedByEvent.get(row.event_id).add(norm);
    });
  }

  function fmtInt(n){ return Math.round(n).toLocaleString(L2I18n.locale()); }

  // начальные баллы пати — суммарная явка всех её участников (сколько раз кто-то
  // из пати отметился на мероприятии, сложено по всем); % буста — среднее по
  // участникам пати; коэффициент — не среднее, а прямая настройка на саму пати
  // (Админ-панель → «Правила клана»)
  function computeRows(){
    return parties.map(party => {
      const roster = membersByGroup.get(party.id) || [];
      const initial = roster.reduce((sum, nick) => {
        const norm = normalizeNick(nick);
        return sum + events.reduce((s, e) => s + ((attendedByEvent.get(e.id) || new Set()).has(norm) ? 1 : 0), 0);
      }, 0);
      const pct = roster.length ? roster.reduce((s, nick) => s + percentOf(nick), 0) / roster.length : 0;
      const coef = coefficientOf(party.id);
      const final = initial * (pct / 100) * coef;
      return { party, roster, initial, pct, coef, final };
    });
  }

  function applyGold(rows){
    const gold = Number(document.getElementById("goldInput").value) || 0;
    const sumFinal = rows.reduce((s,r)=> s + r.final, 0);
    rows.forEach(r => { r.gold = sumFinal ? (r.final / sumFinal) * gold : 0; });
    return rows;
  }

  // сортировка по клику на заголовок — та же схема, что в «ДКП Соло»/«Отчёте по
  // мероприятиям»: повторный клик по той же колонке переключает направление
  let sortKey = "name";
  let sortDir = "asc";
  function sortRows(rows){
    return rows.slice().sort((a, b) => {
      const mul = sortDir === "asc" ? 1 : -1;
      if(sortKey === "name") return a.party.name.localeCompare(b.party.name) * mul;
      return (a[sortKey] - b[sortKey]) * mul || a.party.name.localeCompare(b.party.name);
    });
  }
  function sortArrow(key){ return sortKey === key ? (sortDir === "asc" ? " ▲" : " ▼") : ""; }
  function sortableTh(key, label, extraClass){
    const cls = "ls-sortable" + (extraClass ? " " + extraClass : "");
    return `<th class="${cls}" data-sort-key="${key}">${escapeHtml(label)}${sortArrow(key)}</th>`;
  }

  function renderHead(){
    const head = document.getElementById("lsHead");
    let h = '<tr>' +
      sortableTh("name", L2I18n.t("dkp.colParty", "Пати"), "ls-col-nick") +
      sortableTh("initial", L2I18n.t("dkp.colInitial", "Начальные баллы")) +
      sortableTh("pct", L2I18n.t("dkp.colPct", "% буста")) +
      sortableTh("coef", L2I18n.t("dkp.colCoef", "Коэффициент")) +
      sortableTh("final", L2I18n.t("dkp.colFinal", "Финальные баллы")) +
      sortableTh("gold", L2I18n.t("dkp.goldLabel", "Голда"));
    events.forEach(e => {
      const dt = new Date(e.event_date + "T00:00:00");
      const wd = dayShort(dt.getDay());
      const title = escapeHtml((e.event_name || "") + " — " + e.event_date);
      const bg = e.icon ? ` style="background-image:url('${e.icon}')"` : "";
      h += `<th class="ls-col-day" title="${title}"><div class="ls-day-head">` +
        `<button type="button" class="ls-day-icon-btn" data-event="${e.id}"${bg} ${isAdmin ? "" : "disabled"}>${e.icon ? "" : "+"}</button>` +
        `<span class="ls-day-wd">${wd}</span></div></th>`;
    });
    h += "</tr>";
    head.innerHTML = h;

    head.querySelectorAll(".ls-sortable").forEach(th => {
      th.addEventListener("click", () => {
        const key = th.dataset.sortKey;
        if(sortKey === key) sortDir = sortDir === "asc" ? "desc" : "asc";
        else { sortKey = key; sortDir = key === "name" ? "asc" : "desc"; }
        renderTable(lastRows);
      });
    });

    if(isAdmin){
      head.querySelectorAll(".ls-day-icon-btn").forEach(btn => {
        btn.addEventListener("click", () => openDayIconPicker(btn.dataset.event));
      });
    }
  }

  function renderBody(rows){
    const body = document.getElementById("lsBody");
    body.innerHTML = "";
    const colspan = 6 + events.length;
    rows.forEach(r => {
      const tr = document.createElement("tr");
      const avatarSrc = classIcon(r.party.class_name) || BLANK_IMG;
      const leaderText = r.party.leader_nickname ? L2I18n.t("dkp.leaderPrefix", " · лидер ") + escapeHtml(r.party.leader_nickname) : "";
      let html = `<td class="ls-col-nick"><div class="ls-party" data-party-id="${r.party.id}"><img class="avatar" src="${avatarSrc}" alt="" />` +
        `<span class="who"><span class="name">${escapeHtml(r.party.name)}</span>` +
        `<span class="cnt">${r.roster.length}${L2I18n.t("dkp.membersCountSuffix", " участников")}${leaderText}</span></span></div></td>`;
      html += `<td class="ls-num">${r.initial}</td>`;
      html += `<td class="ls-num" style="color:${pctColor(r.pct)}">${r.pct.toFixed(2)}%</td>`;
      html += `<td class="ls-num">${r.coef.toFixed(2)}</td>`;
      html += `<td class="ls-final">${r.final.toFixed(2)}</td>`;
      html += `<td class="ls-gold">${fmtInt(r.gold)}</td>`;
      events.forEach(e => {
        const set = attendedByEvent.get(e.id) || new Set();
        const count = r.roster.filter(nick => set.has(normalizeNick(nick))).length;
        html += `<td class="ls-col-day ${count > 0 ? "ls-mark-yes" : "ls-mark-no"}">${count}</td>`;
      });
      tr.innerHTML = html;
      body.appendChild(tr);

      const rosterTr = document.createElement("tr");
      rosterTr.className = "ls-roster-row";
      const sortedRoster = r.roster.slice().sort((a, b) => a.localeCompare(b));
      const itemsHtml = sortedRoster.length
        ? sortedRoster.map(rosterItemHtml).join("")
        : `<p class="hint" style="margin:0;">${L2I18n.t("dkp.noMembersInRoster", "Участников нет.")}</p>`;
      const openCls = expandedPartyId === r.party.id ? " open" : "";
      rosterTr.innerHTML = `<td colspan="${colspan}"><div class="ls-roster-wrap${openCls}" data-party-id="${r.party.id}">` +
        `<div class="ls-roster-list">${itemsHtml}</div></div></td>`;
      body.appendChild(rosterTr);
    });
  }

  let hasSplit = false; // «Разделить дроп» ещё не нажимали — пока рано говорить, что мероприятий нет

  function renderTable(rows){
    renderHead();
    renderBody(sortRows(rows));
    const emptyEl = document.getElementById("lsEmpty");
    if(!parties.length){
      emptyEl.textContent = L2I18n.t("dkp.emptyNoPartiesYet", "Пати ещё не заведены — сначала создайте их в разделе «Группы».");
      emptyEl.style.display = "";
    } else if(!hasSplit){
      emptyEl.textContent = L2I18n.t("dkp.emptySetPeriod", "Укажите период и нажмите «Разделить дроп».");
      emptyEl.style.display = "";
    } else if(!events.length){
      emptyEl.textContent = L2I18n.t("dkp.emptyNoEvents", "За выбранный период нет мероприятий в «Журнале посещаемости».");
      emptyEl.style.display = "";
    } else if(!rows.length && hideZeroAttendance){
      emptyEl.textContent = L2I18n.t("dkp.emptyHiddenZeroParty", "Ни в одной пати за этот период не было явки — настройка «Показывать только тех, кто хоть раз ходил» (Админ-панель → «Правила клана») скрыла всех.");
      emptyEl.style.display = "";
    } else {
      emptyEl.style.display = "none";
    }
  }

  async function doSplit(){
    const errEl = document.getElementById("lsError");
    errEl.textContent = "";
    const fromStr = document.getElementById("fromDate").value;
    const toStr = document.getElementById("toDate").value;
    if(!fromStr || !toStr){ errEl.textContent = L2I18n.t("dkp.validateBothDates", "Укажите начальную и конечную дату."); return; }
    if(fromStr > toStr){ errEl.textContent = L2I18n.t("dkp.validateDateOrder", "Начальная дата позже конечной."); return; }

    document.getElementById("splitBtn").disabled = true;
    await loadEventsAndAttendance(fromStr, toStr);
    hasSplit = true;
    const rows = computeRows().filter(r => !hideZeroAttendance || r.initial > 0);
    lastRows = applyGold(rows);
    renderTable(lastRows);
    document.getElementById("splitBtn").disabled = false;
  }

  // клик на название пати — раскрыть/свернуть список участников (одна пати за раз);
  // клик на участника внутри списка — перейти в его личный кабинет
  document.getElementById("lsBody").addEventListener("click", (e) => {
    const partyEl = e.target.closest(".ls-party");
    if(partyEl){
      const id = partyEl.dataset.partyId;
      expandedPartyId = (expandedPartyId === id) ? null : id;
      updateRosterOpenState();
      return;
    }
    const rosterItem = e.target.closest(".ls-roster-item");
    if(rosterItem){
      const nick = rosterItem.dataset.nick;
      // раздел перезагрузится с нуля при возврате — запоминаем выбранный период,
      // чтобы кнопка «назад» из личного кабинета вернула ту же дату и расчёт
      saveDkpPartyState();
      if(window.top && window.top.L2Nav) window.top.L2Nav.openMyCabinet(nick, "loot_split_party");
    }
  });
  // клик где угодно вне раскрытого списка и вне названия пати — свернуть его
  document.addEventListener("click", (e) => {
    if(!expandedPartyId) return;
    if(e.target.closest(".ls-party") || e.target.closest(".ls-roster-wrap")) return;
    expandedPartyId = null;
    updateRosterOpenState();
  });

  document.getElementById("splitBtn").addEventListener("click", doSplit);
  // сумму голды можно поменять без повторного пересчёта явки/буста — просто
  // перераспределяем уже посчитанные финальные баллы по новой сумме
  document.getElementById("goldInput").addEventListener("input", () => {
    if(!lastRows.length) return;
    applyGold(lastRows);
    renderBody(sortRows(lastRows));
  });

  // ---- иконка над столбцом мероприятия (только админ) — та же attendance_events,
  // что и в «ДКП Соло»/явке, поэтому иконка, поставленная тут, видна и там тоже ----
  let pickerTargetEventId = null;
  function openDayIconPicker(eventId){
    pickerTargetEventId = eventId;
    document.getElementById("dayIconPicker").click();
  }
  function resizeImageFile(file, maxSize){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
          const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/png"));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  document.getElementById("dayIconPicker").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if(!file || !pickerTargetEventId) return;
    const dataUrl = await resizeImageFile(file, 64);
    const { error } = await db.from("attendance_events").update({ icon: dataUrl }).eq("id", pickerTargetEventId);
    if(error){ document.getElementById("lsError").textContent = L2I18n.t("dkp.saveIconFailed", "Не удалось сохранить иконку: ") + error.message; return; }
    const ev = events.find(x => x.id === pickerTargetEventId);
    if(ev) ev.icon = dataUrl;
    renderHead();
  });

  // ---- сохранение/восстановление выбранного периода ----
  // Раздел живёт в iframe и при возврате из личного кабинета участника перезагружается
  // с нуля, поэтому перед переходом складываем даты в sessionStorage — та же схема,
  // что и в attendance.html (saveReportState/restoreReportState)
  const DKP_PARTY_STATE_KEY = "l2DkpPartyState";
  function saveDkpPartyState(){
    const fromStr = document.getElementById("fromDate").value;
    const toStr = document.getElementById("toDate").value;
    if(!fromStr && !toStr) return;
    sessionStorage.setItem(DKP_PARTY_STATE_KEY, JSON.stringify({ from: fromStr, to: toStr }));
  }
  async function restoreDkpPartyState(){
    const raw = sessionStorage.getItem(DKP_PARTY_STATE_KEY);
    if(!raw) return;
    sessionStorage.removeItem(DKP_PARTY_STATE_KEY); // одноразово: обычное открытие раздела не трогаем
    let st;
    try{ st = JSON.parse(raw); }catch(e){ return; }
    if(!st.from && !st.to) return;
    document.getElementById("fromDate").value = st.from || "";
    document.getElementById("toDate").value = st.to || "";
    await doSplit();
  }

  await Promise.all([loadParties(), loadBoostStructure(), loadBoostValues(), loadPartyCoefficients(), loadLootSplitSettings(), loadMemberClasses()]);
  renderTable([]);
  await restoreDkpPartyState();

  // заголовки/список участников/пустые состояния построены через JS (не data-i18n) —
  // перестраиваем при смене языка; expandedPartyId — обычная переменная замыкания,
  // renderTable сам восстановит раскрытое состояние по ней
  window.addEventListener("storage", (e) => {
    if(e.key === "l2Lang") renderTable(lastRows);
  });
})();
</script>
</body>
</html>
