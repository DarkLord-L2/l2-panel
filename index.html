<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Кабинет клана</title>
<link rel="stylesheet" href="js/theme.css?v=18" />
</head>
<body>

<div class="app-shell" id="appShell" style="display:none;">
  <div class="who-widget" id="whoWidget">
    <img class="who-avatar" id="whoAvatar" alt="" />
    <div class="who-text">
      <span class="who-name" id="whoName"></span>
      <span class="who-status" id="whoRole"></span>
    </div>
    <span class="who-chevron">▾</span>
    <div class="who-menu" id="whoMenu">
      <div class="lang-switch" id="langSwitch"></div>
      <div class="who-menu-sep"></div>
      <button type="button" class="who-menu-item" id="whoMenuCabinet" data-i18n="section.my_cabinet">Мой кабинет</button>
      <button type="button" class="who-menu-item who-menu-danger" id="signOutBtn" data-i18n="shell.signOut">Выйти</button>
    </div>
  </div>
  <div class="app-body">
    <nav class="sidebar-nav" id="sidebarNav">
      <div class="sidebar-brand" id="brand">
        <img id="brandLogo" alt="" style="display:none;" />
        <span id="brandName" data-i18n="shell.defaultBrandName">Кабинет клана</span>
      </div>
    </nav>
    <div class="content" id="content"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js?v=19"></script>
<script src="js/classes.js?v=1"></script>
<script src="js/i18n.js?v=19"></script>
<script>
(async function(){
  const session = await L2Cabinet.requireSession();
  if(!session) return; // уже редиректнуло на login.html

  // Раздел → как его показывать. Разделы без реализации ниже — заглушки «скоро»,
  // они уже фигурируют в правах ролей (role_sections), но получат контент в следующих фазах.
  const SECTION_VIEWS = {
    my_cabinet:  { type: "iframe", src: "my-cabinet.html" },
    groups:      { type: "iframe", src: "groups.html" },
    skill_panel: { type: "iframe", src: "panel.html" },
    admin:       { type: "iframe", src: "admin.html" },
    census:      { type: "iframe", src: "census.html" },
    roster:      { type: "iframe", src: "roster.html" },
    attendance:  { type: "iframe", src: "attendance.html" },
    taxes:       { type: "iframe", src: "taxes.html" },
    reports:     { type: "iframe", src: "reports.html" },
    gear_check:  { type: "iframe", src: "gear-check.html" },
    loot_split:  { type: "iframe", src: "loot-split.html" },
    loot_split_party: { type: "iframe", src: "loot-split-party.html" },
    loot_payout: { type: "iframe", src: "loot-payout.html" },
  };

  // Чисто визуальная группировка пунктов меню — на права доступа не влияет,
  // каждый раздел внутри группы по-прежнему включается/выключается по роли отдельно.
  const NAV_GROUPS = [
    { label: "Учёт клана", i18nKey: "navgroup.uchet", keys: ["census", "taxes", "attendance"] },
    { label: "ДКП", i18nKey: "navgroup.dkp", keys: ["loot_split", "loot_split_party", "loot_payout"] },
  ];

  // Иконки меню — инлайн SVG (не картинки-файлы, чтобы не плодить запросы и чтобы
  // цвет (currentColor) сам подхватывал акцент текущего оформления клана: amber/azure/emerald.
  const ICONS = {
    my_cabinet:  '<circle cx="12" cy="8.2" r="3.4"/><path d="M5.3 20c0-3.6 3-6.3 6.7-6.3s6.7 2.7 6.7 6.3"/>',
    groups:      '<circle cx="8.8" cy="8.3" r="3"/><path d="M3.2 19.2c0-3 2.5-5.3 5.6-5.3s5.6 2.3 5.6 5.3"/><circle cx="16.8" cy="9.1" r="2.3"/><path d="M14.9 13.7c2.5.3 4.2 2.3 4.2 5"/>',
    skill_panel: '<path d="M12 3c.7 3.6 2.2 5.1 5.8 5.8-3.6.7-5.1 2.2-5.8 5.8-.7-3.6-2.2-5.1-5.8-5.8C9.8 8.1 11.3 6.6 12 3z"/><circle cx="18.4" cy="17.4" r="1.3"/>',
    admin:       '<circle cx="12" cy="12" r="2.8"/><path d="M19.4 13.4a7.6 7.6 0 000-2.8l1.9-1.7-2-3.3-2.4.8a7.6 7.6 0 00-2.4-1.4L14 2.5h-4l-.5 2.5a7.6 7.6 0 00-2.4 1.4l-2.4-.8-2 3.3 1.9 1.7a7.6 7.6 0 000 2.8l-1.9 1.7 2 3.3 2.4-.8a7.6 7.6 0 002.4 1.4l.5 2.5h4l.5-2.5a7.6 7.6 0 002.4-1.4l2.4.8 2-3.3-1.9-1.7z"/>',
    census:      '<rect x="5.2" y="3.8" width="13.6" height="16.8" rx="2"/><path d="M9 3.8V3a1 1 0 011-1h4a1 1 0 011 1v.8"/><path d="M8.5 10.8h7M8.5 14.4h7M8.5 18h4"/>',
    roster:      '<path d="M6.2 3h8l3.6 3.6V20a1 1 0 01-1 1H6.2a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M14.2 3v3.6h3.6"/><path d="M8 12.4h8M8 16h5"/>',
    attendance:  '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/><path d="m9 15 2 2 4-4"/>',
    taxes:       '<circle cx="12" cy="12" r="8.3"/><path d="M12 7.3v9.4"/><path d="M9.3 14.8c.3 1 1.4 1.7 2.8 1.7 1.7 0 2.9-.9 2.9-2.1s-1.1-1.8-2.9-2.1c-1.8-.3-2.8-.9-2.8-2.1s1.2-2.1 2.8-2.1c1.4 0 2.5.6 2.8 1.7"/>',
    reports:     '<rect x="4" y="12.5" width="3.4" height="7.5" rx=".8"/><rect x="10.3" y="6.5" width="3.4" height="13.5" rx=".8"/><rect x="16.6" y="9.5" width="3.4" height="10.5" rx=".8"/>',
    gear_check:  '<path d="M12 3.2l6.8 2.7v4.7c0 4.7-2.8 7.9-6.8 9.2-4-1.3-6.8-4.5-6.8-9.2V5.9L12 3.2z"/><path d="m9 12.2 2 2 4-4.2"/>',
    loot_split:  '<path d="M6 3.2h12l3.6 5.3L12 21 2.4 8.5 6 3.2z"/><path d="M2.4 8.5h19.2M9 3.2l3 5.3 3-5.3"/>',
    loot_split_party: '<rect x="3.4" y="10.4" width="17.2" height="9.8" rx="1.6"/><path d="M3.4 10.4a8.6 5 0 0117.2 0"/><path d="M3.4 14.3h17.2"/><path d="M10.4 14.3v2.3a1.6 1.6 0 003.2 0v-2.3"/>',
    loot_payout: '<circle cx="8" cy="15.3" r="4.2"/><circle cx="16" cy="8.7" r="4.2"/><path d="m10.8 12.5 2.4-2.4"/>',
    group_uchet: '<path d="M4 7.2a2 2 0 012-2h3.4l1.6 1.8H18a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2V7.2z"/>',
    group_dkp:   '<path d="M6 3.2h12l3.6 5.3L12 21 2.4 8.5 6 3.2z"/><path d="M2.4 8.5h19.2M9 3.2l3 5.3 3-5.3"/>',
    default:     '<circle cx="12" cy="12" r="2.2"/>',
  };
  const GROUP_ICON = { "Учёт клана": "group_uchet", "ДКП": "group_dkp" };
  function navIcon(key){
    return '<svg class="nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[key] || ICONS.default) + "</svg>";
  }
  let navStagger = 0; // счётчик для чуть заметной анимации появления пунктов по очереди

  const profile = await L2Cabinet.getProfile();
  if(!profile){
    // сессия есть, а профиля нет — учётку создали не полностью, работать нельзя
    document.body.innerHTML = '<div class="login-wrap"><div class="card login-card">' +
      '<h1>' + L2I18n.t("shell.profileNotFoundTitle", "⚠ Профиль не найден") + '</h1>' +
      '<p class="hint">' + L2I18n.t("shell.profileNotFoundHint", "Ваш логин существует, но для него не создана запись профиля. Обратитесь к клан-лидеру.") + '</p>' +
      '<button class="btn" onclick="L2Cabinet.signOut()">' + L2I18n.t("shell.signOut", "Выйти") + '</button>' +
      "</div></div>";
    return;
  }

  if(profile.clans?.access_enabled === false){
    // клан отключён супер-админом (например, не оплачен) — данные всё равно
    // не отдадутся ни по одному запросу (RLS), но так у человека есть понятное
    // сообщение вместо пустого зависшего интерфейса
    document.body.innerHTML = '<div class="login-wrap"><div class="card login-card">' +
      '<h1>' + L2I18n.t("shell.accessSuspendedTitle", "⛔ Доступ приостановлен") + '</h1>' +
      '<p class="hint">' + L2I18n.t("shell.accessSuspendedHint", "Доступ к кабинету клана временно отключён. Обратитесь к клан-лидеру.") + '</p>' +
      '<button class="btn" onclick="L2Cabinet.signOut()">' + L2I18n.t("shell.signOut", "Выйти") + '</button>' +
      "</div></div>";
    return;
  }
  if(profile.must_change_password){
    location.href = "change-password.html";
    return;
  }

  L2I18n.renderSwitcher(document.getElementById("langSwitch"));

  if(profile.clans?.display_name){
    const brandNameEl = document.getElementById("brandName");
    brandNameEl.textContent = profile.clans.display_name;
    brandNameEl.removeAttribute("data-i18n"); // реальное имя клана — не переводим при смене языка
  }
  if(profile.clans?.logo_url){
    const logo = document.getElementById("brandLogo");
    logo.src = profile.clans.logo_url;
    logo.style.display = "";
  }

  const db = L2Cabinet.client;

  // тот же запасной поиск по нику, что и в «Моём кабинете»/«Отчётах» — ник в
  // member_classes мог быть внесён чуть иначе (перепись/OCR), чем в профиле
  const CYR_LOOKALIKES = { "а":"a","в":"b","е":"e","к":"k","м":"m","н":"h","о":"o","р":"p","с":"c","т":"t","у":"y","х":"x","ё":"e","0":"o","l":"i" };
  function normalizeNick(s){
    return String(s || "")
      .toLowerCase()
      .split("").map(ch => CYR_LOOKALIKES[ch] || ch).join("")
      .replace(/[^a-zа-яё0-9]/gi, "");
  }
  const BLANK_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='30' height='30'></svg>";

  const roleKey = profile.roles?.key || "obychniy";
  document.getElementById("whoName").textContent = profile.nickname || profile.username;

  // своё название роли для этого клана (Админ-панель → Разное → «Названия ролей»),
  // иначе — обычный перевод роли; та же логика, что roleDisplayLabel в admin.html
  async function loadMyRoleLabel(){
    if(!profile.role_id) return L2I18n.t("role." + roleKey, profile.roles?.label || roleKey);
    const { data } = await db.from("clan_role_labels").select("label").eq("clan_id", profile.clan_id).eq("role_id", profile.role_id).maybeSingle();
    return data?.label || L2I18n.t("role." + roleKey, profile.roles?.label || roleKey);
  }
  document.getElementById("whoRole").textContent = await loadMyRoleLabel();

  // аватарка — иконка своего класса (своя загруженная, иначе стандартная по имени класса)
  async function loadMyAvatar(){
    if(!profile.nickname) return null;
    const { data } = await db.from("member_classes").select("nickname, class_name, icon");
    const norm = normalizeNick(profile.nickname);
    const mine = (data || []).find(r => normalizeNick(r.nickname) === norm);
    if(!mine) return null;
    return mine.icon || (window.L2_CLASS_ICON && mine.class_name ? window.L2_CLASS_ICON(mine.class_name) : null);
  }
  document.getElementById("whoAvatar").src = (await loadMyAvatar()) || BLANK_AVATAR;

  document.getElementById("signOutBtn").addEventListener("click", () => L2Cabinet.signOut());

  const sections = await L2Cabinet.getVisibleSections(roleKey);
  const nav = document.getElementById("sidebarNav");
  const content = document.getElementById("content");

  function renderSection(key, extra){
    const view = SECTION_VIEWS[key];
    content.innerHTML = "";
    if(!view){ content.innerHTML = '<p class="hint">' + L2I18n.t("shell.sectionNotFound", "Раздел не найден.") + '</p>'; return; }

    if(view.type === "iframe"){
      const frame = document.createElement("iframe");
      frame.className = "content-frame";
      // ?v= — не даёт браузеру подсунуть закэшированную старую версию раздела
      let src = view.src + "?v=" + Date.now();
      if(extra) Object.keys(extra).forEach(k => { src += "&" + k + "=" + encodeURIComponent(extra[k]); });
      frame.src = src;
      content.appendChild(frame);
    } else {
      const label = L2I18n.t("section." + key, sections.find(s => s.key === key)?.label || key);
      const stub = document.createElement("div");
      stub.className = "card";
      stub.innerHTML = "<h2></h2><p class=\"hint\">" + L2I18n.t("shell.sectionComingSoon", "Этот раздел скоро появится.") + "</p>";
      stub.querySelector("h2").textContent = label;
      content.appendChild(stub);
    }

    Array.from(nav.querySelectorAll("a")).forEach(a => {
      a.classList.toggle("active", a.dataset.key === key);
    });
    location.hash = "#" + key;
  }

  function makeNavLink(s, sub){
    const a = document.createElement("a");
    a.href = "#" + s.key;
    a.dataset.key = s.key;
    if(sub) a.classList.add("nav-sub");
    a.innerHTML = navIcon(s.key);
    const label = document.createElement("span");
    label.className = "nav-label";
    label.dataset.i18n = "section." + s.key;
    label.dataset.i18nFallback = s.label;
    label.textContent = L2I18n.t("section." + s.key, s.label);
    a.appendChild(label);
    a.style.setProperty("--i", navStagger++);
    a.addEventListener("click", (e) => { e.preventDefault(); renderSection(s.key); });
    return a;
  }

  // вызывается из вложенных iframe-разделов для перехода в другой раздел с параметрами
  // (например, клик на «Группа» в отчёте посещаемости открывает конкретную группу)
  window.L2Nav = {
    // from=attendance — чтобы в группе показалась кнопка «Вернуться в журнал»
    openGroup(groupId){ renderSection("groups", { group: groupId, from: "attendance" }); },
    // из карточки участника в группе — сразу открыть таблицу буста для этой группы
    openGearCheck(groupId){ renderSection("gear_check", { group: groupId }); },
    // из меню «⋮» в «Группах» — клан-лидер/зам/лидер пати открывают личный кабинет участника
    openMyCabinet(nick, from){ renderSection("my_cabinet", { nick, from: from || "groups" }); },
    openSection(key){ renderSection(key); },
  };

  const wanted = location.hash.replace("#", "");
  const startKey = sections.find(s => s.key === wanted)?.key || sections[0]?.key;

  const groupedKeys = new Set(NAV_GROUPS.flatMap(g => g.keys));
  const renderedGroups = new Set();

  sections.forEach(s => {
    if(!groupedKeys.has(s.key)){
      nav.appendChild(makeNavLink(s, false));
      return;
    }
    const group = NAV_GROUPS.find(g => g.keys.includes(s.key));
    if(renderedGroups.has(group.label)) return; // дочерние пункты уже выведены вместе с первым
    renderedGroups.add(group.label);

    const children = sections.filter(x => group.keys.includes(x.key));
    const startsOpen = children.some(x => x.key === startKey);

    const toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "nav-group-toggle" + (startsOpen ? " open" : "");
    toggle.innerHTML = navIcon(GROUP_ICON[group.label]) +
      '<span class="nav-label" data-i18n="' + group.i18nKey + '" data-i18n-fallback="' + group.label + '">' +
      L2I18n.t(group.i18nKey, group.label) + '</span><span class="nav-group-arrow">▸</span>';
    toggle.style.setProperty("--i", navStagger++);

    const childWrap = document.createElement("div");
    childWrap.className = "nav-group-children" + (startsOpen ? " open" : "");
    children.forEach(x => childWrap.appendChild(makeNavLink(x, true)));

    toggle.addEventListener("click", () => {
      const open = childWrap.classList.toggle("open");
      toggle.classList.toggle("open", open);
    });

    nav.appendChild(toggle);
    nav.appendChild(childWrap);
  });

  if(startKey) renderSection(startKey);
  else content.innerHTML = '<p class="hint">' + L2I18n.t("shell.noSectionsForRole", "Для вашей роли пока не открыто ни одного раздела.") + '</p>';

  // виджет «аватарка + имя + статус» справа сверху — клик раскрывает меню
  const whoWidget = document.getElementById("whoWidget");
  const whoMenuCabinet = document.getElementById("whoMenuCabinet");
  if(!sections.some(s => s.key === "my_cabinet")) whoMenuCabinet.style.display = "none";
  whoMenuCabinet.addEventListener("click", (e) => {
    e.stopPropagation();
    whoWidget.classList.remove("open");
    renderSection("my_cabinet");
  });
  whoWidget.addEventListener("click", (e) => {
    if(e.target.closest(".who-menu-item")) return; // клик по пункту меню закрывает сам пункт
    whoWidget.classList.toggle("open");
  });
  document.addEventListener("click", (e) => {
    if(!whoWidget.contains(e.target)) whoWidget.classList.remove("open");
  });

  // статус — не через data-i18n (значение либо перевод, либо кастомное название
  // роли из БД), поэтому переводим вручную по смене языка в шапке
  window.addEventListener("storage", async (e) => {
    if(e.key !== "l2Lang") return;
    document.getElementById("whoRole").textContent = await loadMyRoleLabel();
  });

  document.getElementById("appShell").style.display = "";
})();
</script>
</body>
</html>
