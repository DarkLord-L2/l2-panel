<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ДКП Соло — Кабинет клана</title>
<link rel="stylesheet" href="js/theme.css?v=19" />
<style>
  .ls-wrap{ padding:0 0 24px; }
  .ls-wrap .page-head{ margin-bottom:0; }
  .ls-filters{ display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin:2px 0 10px; }
  .ls-filters .field{ margin:0; }
  .ls-filters input[type="date"]{ min-width:150px; }
  .ls-filters input[type="number"]{ width:140px; }
  .ls-wrap .card{ padding-top:12px; }

  /* никакого overflow/скролл-бокса у обёртки — таблица продолжается вниз и вбок
     вместе со всей страницей, а не в своём отдельном "окошке" (та же история и то
     же решение, что для матрицы в attendance.html: сколько-то раз пробовали
     overflow:auto — пользователь видит это как "таблица отдельно от сайта",
     потому что position:sticky липнет к ближайшему скролл-предку, а не к окну).
     display:inline-block — чтобы обёртка была ровно по размеру таблицы. */
  .ls-table-scroll{ display:inline-block; vertical-align:top; overflow:visible; }
  /* строки-«карточки»: border-spacing по вертикали разводит соседние строки, а
     скруглённые левый/правый край первой/последней ячейки делает каждую строку
     отдельным закруглённым блоком — без единого цвета по значению, разница
     между колонками только в насыщенности/жирности шрифта */
  table.ls-table{ border-collapse:separate; border-spacing:0 8px; width:auto; font-size:13px; }
  table.ls-table th{
    padding:0 14px 10px;
    position:sticky; top:0; z-index:2;
    background: var(--panel);
    color: var(--text-dim); font-size:11px; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
    vertical-align:bottom; text-align:center;
  }
  /* угловая ячейка шапки «прилипает» сразу и сверху (top, как вся шапка), и слева
     (left, как колонка ников) — ей нужен z-index выше всех остальных sticky-ячеек,
     иначе при вертикальном скролле её перекрывает уезжающая шапка данных */
  table.ls-table th.ls-col-nick{ text-align:left; left:0; z-index:3; }
  table.ls-table th.ls-sortable{ cursor:pointer; user-select:none; }
  table.ls-table th.ls-sortable:hover{ color: var(--text); }
  table.ls-table tbody td{
    padding:14px;
    background: var(--panel-2);
    border-top:1px solid var(--border-lit);
    border-bottom:1px solid var(--border-lit);
    white-space:nowrap;
  }
  table.ls-table tbody tr td:first-child{ border-left:1px solid var(--border-lit); border-top-left-radius:10px; border-bottom-left-radius:10px; }
  table.ls-table tbody tr td:last-child{ border-right:1px solid var(--border-lit); border-top-right-radius:10px; border-bottom-right-radius:10px; }
  table.ls-table tbody td.ls-col-nick{
    position:sticky; left:0; z-index:1;
  }
  table.ls-table tbody tr:hover td{ background: var(--panel); border-color: var(--gold-dim); }

  .ls-nick{ display:flex; align-items:center; gap:10px; }
  .ls-nick .avatar{
    width:32px; height:32px; flex:none;
    border-radius:50%; object-fit:cover;
    border:1px solid var(--border); background: var(--panel);
  }
  .ls-nick .who{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .ls-nick .name{ color: var(--text); font-weight:600; }
  .ls-nick .cls{ font-size:11px; color: var(--text-dim); }

  .ls-num{ text-align:center; color: var(--text); font-variant-numeric: tabular-nums; }
  .ls-final{ text-align:center; color: var(--text); font-weight:700; font-size:14px; font-variant-numeric: tabular-nums; }
  .ls-gold{ text-align:center; color: var(--text); font-weight:700; font-size:14px; font-variant-numeric: tabular-nums; }

  table.ls-table th.ls-col-day, table.ls-table td.ls-col-day{ width:52px; min-width:52px; max-width:52px; text-align:center; }
  .ls-day-head{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .ls-day-icon-btn{
    width:28px; height:28px; padding:0; border-radius:8px;
    border:1px solid var(--border); background: var(--panel-2);
    color: var(--text-dim); font-size:13px; line-height:1; cursor:pointer;
    background-size:cover; background-position:center;
  }
  .ls-day-icon-btn:hover{ border-color: var(--border-lit); }
  .ls-day-icon-btn:disabled{ cursor:default; }
  .ls-day-wd{ font-size:10.5px; color: var(--text-dim); font-weight:600; }
  /* явка/неявка — тоже без цвета, только насыщенность: у нуля цифра тусклее и тоньше */
  .ls-mark{ color: var(--text); font-weight:600; }
  .ls-mark.zero{ color: var(--text-dim); opacity:.5; font-weight:400; }

  /* те, кто был в предыдущей переписи, но пропал из последней — досчитываются той
     же формулой (явка/буст/финал), что и активные, и подставляются доп. строками
     в самый низ той же таблицы (после отсортированных активных, вне сортировки —
     чтобы всегда оставались внизу); лёгкая тусклость строки + крестик у ника вместо
     отдельного блока, раз колонки те же самые */
  tr.ls-left-divider-row td{ padding:6px 14px 2px; background:none !important; border:none !important; }
  .ls-left-divider{ font-size:11px; color: var(--text-dim); font-weight:600; letter-spacing:.03em; text-transform:uppercase; text-align:left; }
  tr.ls-row-left td{ opacity:.72; }
  .ls-left-cross{ color: var(--danger-lit); font-weight:700; margin-left:6px; }
</style>
</head>
<body>

<div class="ls-wrap" id="wrap" style="display:none;">
  <div class="page-head">
    <h1 data-i18n="section.loot_split">ДКП Соло</h1>
  </div>

  <section class="card">
    <div class="ls-filters">
      <div class="field">
        <label for="fromDate" data-i18n="dkp.fromDateLabel">Начальная дата</label>
        <input type="date" id="fromDate" />
      </div>
      <div class="field">
        <label for="toDate" data-i18n="dkp.toDateLabel">Конечная дата</label>
        <input type="date" id="toDate" />
      </div>
      <div class="field">
        <label for="goldInput" data-i18n="dkp.goldLabel">Голда</label>
        <input type="number" id="goldInput" min="0" step="1" value="0" />
      </div>
      <button class="btn btn-primary" id="splitBtn" data-i18n="dkp.splitBtn">Разделить дроп</button>
      <button class="btn btn-danger" id="toPayoutBtn" data-i18n="dkp.toPayoutBtn" disabled style="display:none;">Раздать</button>
    </div>
    <p class="hint" id="toPayoutHint" style="margin:-4px 0 10px; display:none;"></p>
    <p class="error-msg" id="lsError"></p>

    <div class="ls-table-scroll">
      <table class="ls-table">
        <thead id="lsHead"></thead>
        <tbody id="lsBody"></tbody>
      </table>
    </div>
    <p class="empty-hint" id="lsEmpty" style="display:none;"></p>
  </section>
</div>

<input type="file" id="dayIconPicker" accept="image/*" style="display:none;" />

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js?v=19"></script>
<script src="js/classes.js?v=1"></script>
<script src="js/i18n.js?v=22"></script>
<script>
(async function(){
  const session = await L2Cabinet.requireSession();
  if(!session) return;

  const profile = await L2Cabinet.getProfile();
  if(!profile){
    document.body.innerHTML = '<div class="login-wrap"><div class="card login-card">' +
      '<h1>' + L2I18n.t("shell.profileNotFoundTitle", "⚠ Профиль не найден") + '</h1>' +
      '<p class="hint">' + L2I18n.t("common.contactLeader", "Обратитесь к клан-лидеру.") + '</p></div></div>';
    return;
  }

  const isAdmin = ["glavadmin", "admin"].includes(profile.roles?.key);
  const db = L2Cabinet.client;
  document.getElementById("wrap").style.display = "";
  // «Раздать» пишет общую на весь клан таблицу — доступно только админам,
  // как и остальные пишущие действия в ДКП (иконка мероприятия и т.п.)
  if(isAdmin) document.getElementById("toPayoutBtn").style.display = "";

  function escapeHtml(s){
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }

  // перепись/явка/классы иногда пишут один и тот же ник по-разному (кириллица/латиница
  // похожих букв, регистр) — та же схема нормализации, что в attendance.html/reports.html
  const CYR_LOOKALIKES = { "а":"a","в":"b","е":"e","к":"k","м":"m","н":"h","о":"o","р":"p","с":"c","т":"t","у":"y","х":"x","ё":"e","0":"o","l":"i" };
  function normalizeNick(s){
    return String(s || "")
      .toLowerCase()
      .split("").map(ch => CYR_LOOKALIKES[ch] || ch).join("")
      .replace(/[^a-zа-яё0-9]/gi, "");
  }
  function findByNormalized(map, nickname){
    const norm = normalizeNick(nickname);
    if(map.has(norm)) return map.get(norm);
    // без точного совпадения — берём совпадение по префиксу, только если оно ЕДИНСТВЕННОЕ;
    // тут результат идёт прямиком в коэффициент профессии для раздела голды, а не просто
    // в подпись — при неоднозначности лучше явно не найти класс (коэффициент 1), чем
    // молча приписать человеку чужую профессию
    let found, matches = 0;
    for(const [key, value] of map){
      if(key && (key.startsWith(norm) || norm.startsWith(key))){
        found = value;
        matches++;
        if(matches > 1) return undefined;
      }
    }
    return matches === 1 ? found : undefined;
  }

  const BLANK_IMG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'></svg>";

  function classIcon(name){ return name && window.L2_CLASS_ICON ? window.L2_CLASS_ICON(name) : null; }

  let nicks = [];                  // ники последней переписи, по алфавиту
  let leftMembers = [];            // были в предыдущей переписи, но пропали из последней
  let memberClasses = new Map();   // nickname -> class_name
  let memberClassesNorm = new Map();
  let memberIcons = new Map();     // nickname -> data-URL своей аватарки

  let boostSections = [];
  let boostItems = [];
  let boostValueSet = new Set();   // `${nickname}|${item_id}`

  let coefficients = new Map();    // class_name -> coefficient

  let events = [];                 // [{id, event_date, event_name, icon}] в диапазоне, по дате
  let attendedByEvent = new Map(); // event_id -> Set(normalizeNick)

  let lastRows = [];               // последний посчитанный «Разделить дроп»
  let leftMembersWeek = null;       // неделя переписи, в которой ушедшие встречались последний раз

  function fmtDate(iso){
    if(!iso) return "";
    const [y, m, d] = iso.split("-");
    return `${d}.${m}.${y}`;
  }

  async function loadCensus(){
    const { data } = await db.from("census_entries").select("nickname, week_start");
    const weeks = [...new Set((data || []).map(r => r.week_start))].sort();
    const latest = weeks.length ? weeks[weeks.length - 1] : null;
    const prev = weeks.length > 1 ? weeks[weeks.length - 2] : null;
    nicks = [...new Set((data || []).filter(r => r.week_start === latest).map(r => r.nickname))]
      .sort((a,b)=>a.localeCompare(b));
    // «вышел за последнюю неделю» — был в предпоследней переписи, но пропал из последней;
    // значит их последняя встреченная неделя — именно prev, одна и та же для всех
    leftMembersWeek = prev;
    if(prev){
      const latestNorm = new Set(nicks.map(normalizeNick));
      leftMembers = [...new Set((data || []).filter(r => r.week_start === prev).map(r => r.nickname))]
        .filter(n => !latestNorm.has(normalizeNick(n)))
        .sort((a,b)=>a.localeCompare(b));
    } else leftMembers = [];
  }

  async function loadMemberClasses(){
    const { data } = await db.from("member_classes").select("nickname, class_name, icon");
    memberClasses = new Map();
    memberClassesNorm = new Map();
    memberIcons = new Map();
    (data || []).forEach(r => {
      memberClasses.set(r.nickname, r.class_name || null);
      memberClassesNorm.set(normalizeNick(r.nickname), r.class_name || null);
      if(r.icon) memberIcons.set(r.nickname, r.icon);
    });
  }

  function classOf(nick){
    if(memberClasses.has(nick)) return memberClasses.get(nick);
    return findByNormalized(memberClassesNorm, nick) || null;
  }

  async function loadBoostStructure(){
    const [{ data: s }, { data: it }] = await Promise.all([
      db.from("boost_sections").select("id, sort_order").order("sort_order"),
      db.from("boost_items")
        .select("id, section_id, name, weight, sort_order, subgroup, hidden, merged_with_prev, merge_all_required")
        .order("sort_order"),
    ]);
    boostSections = s || [];
    boostItems = (it || []).map(x => ({ ...x, weight: Number(x.weight) }));
  }

  async function loadBoostValues(){
    const { data } = await db.from("boost_member_values").select("nickname, item_id, enabled");
    boostValueSet = new Set();
    (data || []).forEach(r => { if(r.enabled) boostValueSet.add(r.nickname + "|" + r.item_id); });
  }

  // ---- те же формулы, что в «Проверке буста» (gear-check.html), чтобы % совпадал 1-в-1 ----
  function itemsOfSection(secId){
    return boostItems.filter(i => i.section_id === secId).sort((a,b)=> a.sort_order - b.sort_order || a.name.localeCompare(b.name));
  }
  function orderedBoostItems(){
    return boostSections.flatMap(s => itemsOfSection(s.id)).filter(i => !i.hidden);
  }
  function mergeGroups(list){
    const out = [];
    list.forEach(item => {
      const prev = out[out.length - 1];
      const sameBlock = prev && prev[0].section_id === item.section_id && (prev[0].subgroup || "") === (item.subgroup || "");
      if(item.merged_with_prev && sameBlock) prev.push(item);
      else out.push([item]);
    });
    return out;
  }
  function isAllRequired(group){ return group.length > 1 && group.some(i => i.merge_all_required); }
  function groupScore(group, nick){
    const onItems = group.filter(i => boostValueSet.has(nick + "|" + i.id));
    if(isAllRequired(group)) return onItems.length === group.length ? group.reduce((s,i)=>s+i.weight,0) : 0;
    return onItems.reduce((s,i)=>s+i.weight,0);
  }
  function maxBoostScore(){ return orderedBoostItems().reduce((s,i)=> s + i.weight, 0); }
  function boostScoreOf(nick){ return mergeGroups(orderedBoostItems()).reduce((s,g)=> s + groupScore(g, nick), 0); }
  // «Минимальный % буста» (Админ-панель → «ДКП») — только пока реальный балл
  // человека ровно 0 (в «Проверке буста» ничего не отмечено); хоть один
  // отмеченный пункт сразу возвращает приоритет реальному проценту
  function percentOf(nick){
    if(minBoostPercent > 0 && boostScoreOf(nick) === 0) return minBoostPercent;
    const mx = maxBoostScore();
    return mx ? (boostScoreOf(nick) / mx) * 100 : 0;
  }
  async function loadCoefficients(){
    const { data } = await db.from("loot_class_coefficients").select("class_name, coefficient");
    coefficients = new Map((data || []).map(r => [r.class_name, Number(r.coefficient)]));
  }
  function coefficientOf(nick){
    const cls = classOf(nick);
    if(!cls) return 1;
    const c = coefficients.get(cls);
    return c === undefined ? 1 : c;
  }

  // «показывать только тех, кто хоть раз ходил» — настройка из Админ-панели →
  // «ДКП» (по умолчанию выключена, показывает всех, как раньше)
  let hideZeroAttendance = false;
  // «Минимальный % буста» — тоже из Админ-панели → «ДКП»; см. percentOf() выше
  let minBoostPercent = 0;
  async function loadLootSplitSettings(){
    const { data } = await db.from("loot_split_settings").select("hide_zero_attendance, min_boost_percent").eq("clan_id", profile.clan_id).maybeSingle();
    hideZeroAttendance = !!data?.hide_zero_attendance;
    minBoostPercent = Number(data?.min_boost_percent) || 0;
  }

  async function loadEventsAndAttendance(fromStr, toStr){
    const { data: evs, error: evErr } = await db
      .from("attendance_events")
      .select("id, event_date, event_name, icon")
      .gte("event_date", fromStr)
      .lte("event_date", toStr)
      .order("event_date");
    if(evErr){ console.error(evErr); events = []; attendedByEvent = new Map(); return; }
    events = evs || [];

    attendedByEvent = new Map();
    const eventIds = events.map(e => e.id);
    if(!eventIds.length) return;

    const { data: entries, error: entErr } = await db
      .from("attendance_entries")
      .select("nickname, event_id")
      .in("event_id", eventIds);
    if(entErr){ console.error(entErr); return; }
    (entries || []).forEach(row => {
      const norm = normalizeNick(row.nickname);
      if(!attendedByEvent.has(row.event_id)) attendedByEvent.set(row.event_id, new Set());
      attendedByEvent.get(row.event_id).add(norm);
    });
  }

  function fmtInt(n){ return Math.round(n).toLocaleString(L2I18n.locale()); }

  function computeRowsFor(nickList){
    return nickList.map(nick => {
      const norm = normalizeNick(nick);
      const initial = events.reduce((s, e) => s + ((attendedByEvent.get(e.id) || new Set()).has(norm) ? 1 : 0), 0);
      const pct = percentOf(nick);
      const cls = classOf(nick);
      const coef = coefficientOf(nick);
      // доли округляются до четверти (0 / 0.25 / 0.5 / 0.75 / 1 / …) — голда потом
      // считается как доли × цена доли, дробные доли меньше четверти не нужны
      const final = Math.round(initial * (pct / 100) * coef * 4) / 4;
      return { nick, norm, cls, initial, pct, coef, final };
    });
  }

  // голда делится только между активными (rows) — сумма их финальных баллов
  // определяет ставку голды за балл (введённая сумма / сумма всех финальных
  // баллов); у ушедших (leftRows) та же ставка применяется к их баллам просто
  // для справки, в сумму активных их финал не входит и долю остальных не уменьшает
  function applyGold(rows, leftRows){
    const gold = Number(document.getElementById("goldInput").value) || 0;
    const sumFinal = rows.reduce((s,r)=> s + r.final, 0);
    const rate = sumFinal ? gold / sumFinal : 0;
    rows.forEach(r => { r.gold = r.final * rate; });
    (leftRows || []).forEach(r => { r.gold = r.final * rate; });
    return rows;
  }

  // сортировка по клику на заголовок — та же схема, что в «Отчёте по мероприятиям»
  // (reports.html): повторный клик по той же колонке переключает направление.
  // По умолчанию — голда по убыванию (сначала самые большие суммы)
  let sortKey = "gold";
  let sortDir = "desc";
  function sortRows(rows){
    return rows.slice().sort((a, b) => {
      const mul = sortDir === "asc" ? 1 : -1;
      if(sortKey === "nick") return a.nick.localeCompare(b.nick) * mul;
      return (a[sortKey] - b[sortKey]) * mul || a.nick.localeCompare(b.nick);
    });
  }
  function sortArrow(key){ return sortKey === key ? (sortDir === "asc" ? " ▲" : " ▼") : ""; }
  function sortableTh(key, label, extraClass){
    const cls = "ls-sortable" + (extraClass ? " " + extraClass : "");
    return `<th class="${cls}" data-sort-key="${key}">${escapeHtml(label)}${sortArrow(key)}</th>`;
  }

  function renderHead(){
    const head = document.getElementById("lsHead");
    let h = '<tr>' +
      sortableTh("nick", L2I18n.t("dkp.colNick", "Участники"), "ls-col-nick") +
      sortableTh("initial", L2I18n.t("dkp.colInitial", "Начальные баллы")) +
      sortableTh("pct", L2I18n.t("dkp.colPct", "% буста")) +
      sortableTh("coef", L2I18n.t("dkp.colCoef", "Коэффициент")) +
      sortableTh("final", L2I18n.t("dkp.colFinal", "Финальные баллы")) +
      sortableTh("gold", L2I18n.t("dkp.goldLabel", "Голда"));
    events.forEach(e => {
      const dt = new Date(e.event_date + "T00:00:00");
      const dateLabel = String(dt.getDate()).padStart(2, "0") + "." + String(dt.getMonth() + 1).padStart(2, "0");
      const title = escapeHtml((e.event_name || "") + " — " + e.event_date);
      const bg = e.icon ? ` style="background-image:url('${e.icon}')"` : "";
      h += `<th class="ls-col-day" title="${title}"><div class="ls-day-head">` +
        `<button type="button" class="ls-day-icon-btn" data-event="${e.id}"${bg} ${isAdmin ? "" : "disabled"}>${e.icon ? "" : "+"}</button>` +
        `<span class="ls-day-wd">${dateLabel}</span></div></th>`;
    });
    h += "</tr>";
    head.innerHTML = h;

    head.querySelectorAll(".ls-sortable").forEach(th => {
      th.addEventListener("click", () => {
        const key = th.dataset.sortKey;
        if(sortKey === key) sortDir = sortDir === "asc" ? "desc" : "asc";
        else { sortKey = key; sortDir = key === "nick" ? "asc" : "desc"; }
        renderTable(lastRows);
      });
    });

    if(isAdmin){
      head.querySelectorAll(".ls-day-icon-btn").forEach(btn => {
        btn.addEventListener("click", () => openDayIconPicker(btn.dataset.event));
      });
    }
  }

  // общий рендер строки — используется и для активных, и (isLeft=true) для тех,
  // кто вышел из клана; колонки те же самые, разница только в крестике у ника
  // и лёгкой тусклости строки (см. .ls-row-left)
  function rowHtml(r, isLeft){
    const avatarSrc = memberIcons.get(r.nick) || classIcon(r.cls) || BLANK_IMG;
    const leftTitle = leftMembersWeek
      ? L2I18n.t("dkp.leftClanTitleWithDate", "Уже не в клане — был в переписи от {date}").replace("{date}", fmtDate(leftMembersWeek))
      : L2I18n.t("dkp.leftClanTitle", "Уже не в клане");
    const cross = isLeft ? `<span class="ls-left-cross" title="${escapeHtml(leftTitle)}">✗</span>` : "";
    let html = `<td class="ls-col-nick"><div class="ls-nick"><img class="avatar" src="${avatarSrc}" alt="" />` +
      `<span class="who"><span class="name">${escapeHtml(r.nick)}${cross}</span><span class="cls">${escapeHtml(r.cls || "")}</span></span></div></td>`;
    html += `<td class="ls-num">${r.initial}</td>`;
    html += `<td class="ls-num">${r.pct.toFixed(2)}%</td>`;
    html += `<td class="ls-num">${r.coef}</td>`;
    html += `<td class="ls-final">${r.final.toFixed(2)}</td>`;
    html += `<td class="ls-gold">${fmtInt(r.gold)}</td>`;
    events.forEach(e => {
      const was = (attendedByEvent.get(e.id) || new Set()).has(r.norm);
      html += `<td class="ls-col-day"><span class="ls-mark${was ? "" : " zero"}">${was ? 1 : 0}</span></td>`;
    });
    return html;
  }

  function renderBody(rows, leftRows){
    const body = document.getElementById("lsBody");
    body.innerHTML = "";
    rows.forEach(r => {
      const tr = document.createElement("tr");
      tr.innerHTML = rowHtml(r, false);
      body.appendChild(tr);
    });
    if(leftRows && leftRows.length){
      const colspan = 6 + events.length;
      const divTr = document.createElement("tr");
      divTr.className = "ls-left-divider-row";
      divTr.innerHTML = `<td colspan="${colspan}" class="ls-left-divider">${escapeHtml(L2I18n.t("dkp.leftMembersTitle", "Вышли из клана за последнюю неделю"))}</td>`;
      body.appendChild(divTr);
      leftRows.forEach(r => {
        const tr = document.createElement("tr");
        tr.className = "ls-row-left";
        tr.innerHTML = rowHtml(r, true);
        body.appendChild(tr);
      });
    }
  }

  let hasSplit = false; // «Разделить дроп» ещё не нажимали — пока рано говорить, что мероприятий нет
  let lastLeftRows = []; // строки вышедших из клана — появляются только после «Разделить дроп»

  function renderTable(rows){
    renderHead();
    renderBody(sortRows(rows), lastLeftRows);
    const emptyEl = document.getElementById("lsEmpty");
    if(!nicks.length){
      emptyEl.textContent = L2I18n.t("dkp.emptyNoCensusMembers", "В последней переписи нет участников — сначала заполните «Перепись клана».");
      emptyEl.style.display = "";
    } else if(!hasSplit){
      emptyEl.textContent = L2I18n.t("dkp.emptySetPeriod", "Укажите период и нажмите «Разделить дроп».");
      emptyEl.style.display = "";
    } else if(!events.length){
      emptyEl.textContent = L2I18n.t("dkp.emptyNoEvents", "За выбранный период нет мероприятий в «Журнале посещаемости».");
      emptyEl.style.display = "";
    } else if(!rows.length && hideZeroAttendance){
      emptyEl.textContent = L2I18n.t("dkp.emptyHiddenZeroSolo", "Никто из последней переписи не ходил за этот период — настройка «Показывать только тех, кто хоть раз ходил» (Админ-панель → «Правила клана») скрыла всех.");
      emptyEl.style.display = "";
    } else {
      emptyEl.style.display = "none";
    }
  }

  async function doSplit(){
    const errEl = document.getElementById("lsError");
    errEl.textContent = "";
    const fromStr = document.getElementById("fromDate").value;
    const toStr = document.getElementById("toDate").value;
    if(!fromStr || !toStr){ errEl.textContent = L2I18n.t("dkp.validateBothDates", "Укажите начальную и конечную дату."); return; }
    if(fromStr > toStr){ errEl.textContent = L2I18n.t("dkp.validateDateOrder", "Начальная дата позже конечной."); return; }

    document.getElementById("splitBtn").disabled = true;
    await loadEventsAndAttendance(fromStr, toStr);
    hasSplit = true;
    const rows = computeRowsFor(nicks).filter(r => !hideZeroAttendance || r.initial > 0);
    // вышедшие из клана считаются той же формулой и показываются всегда (даже с
    // нулевой явкой) — это информационный список «кто уже не в клане», а не часть
    // обычной фильтрации «показывать только тех, кто ходил»
    const leftRows = computeRowsFor(leftMembers);
    lastRows = applyGold(rows, leftRows);
    lastLeftRows = leftRows;
    renderTable(lastRows);
    document.getElementById("splitBtn").disabled = false;
    document.getElementById("toPayoutBtn").disabled = !lastRows.length;
  }

  document.getElementById("splitBtn").addEventListener("click", doSplit);
  // сумму голды можно поменять без повторного пересчёта явки/буста — просто
  // перераспределяем уже посчитанные финальные баллы по новой сумме
  document.getElementById("goldInput").addEventListener("input", () => {
    saveDkpFilters();
    if(!lastRows.length && !lastLeftRows.length) return;
    applyGold(lastRows, lastLeftRows);
    renderBody(sortRows(lastRows), lastLeftRows);
  });
  // поле голды обычно стоит на «0» — начать печатать сумму поверх него неудобно
  // (получится «05» и т.п.), поэтому при заходе в поле нулевое значение само
  // убирается; уже вписанную ранее (в т.ч. восстановленную) сумму не трогаем
  document.getElementById("goldInput").addEventListener("focus", (e) => {
    if(e.target.value === "0") e.target.value = "";
  });
  // Enter в поле голды сразу запускает «Разделить дроп» — не обязательно тянуться к кнопке
  document.getElementById("goldInput").addEventListener("keydown", (e) => {
    if(e.key === "Enter"){ e.preventDefault(); doSplit(); }
  });

  // запоминаем период + сумму голды в localStorage — переживает переход на
  // другие разделы сайта (раздел живёт в iframe и перезагружается с нуля при
  // каждом открытии) и закрытие вкладки; у «ДКП Соло»/«ДКП Пати» своя память,
  // суммы у них обычно разные
  const DKP_FILTERS_KEY = "l2DkpSoloFilters";
  function saveDkpFilters(){
    localStorage.setItem(DKP_FILTERS_KEY, JSON.stringify({
      from: document.getElementById("fromDate").value,
      to: document.getElementById("toDate").value,
      gold: document.getElementById("goldInput").value,
    }));
  }
  function restoreDkpFilters(){
    let st;
    try{ st = JSON.parse(localStorage.getItem(DKP_FILTERS_KEY) || "null"); }catch(e){ st = null; }
    if(!st) return false;
    if(st.from) document.getElementById("fromDate").value = st.from;
    if(st.to) document.getElementById("toDate").value = st.to;
    if(st.gold != null && st.gold !== "") document.getElementById("goldInput").value = st.gold;
    return !!(st.from && st.to);
  }
  document.getElementById("fromDate").addEventListener("change", saveDkpFilters);
  document.getElementById("toDate").addEventListener("change", saveDkpFilters);

  // «Раздать» пишет посчитанную голду по никам и период в общую на весь клан
  // таблицу payout_batches (не в sessionStorage — тот виден только в браузере
  // того, кто нажал, соседний пати-лидер на своём устройстве его не видел).
  // «Раздача» больше не считает голду сама (лидер×кол-во раз × фикс. цена),
  // а показывает именно эти суммы, сгруппированные по пати-лидеру со скринов;
  // каждый пати-лидер при заходе видит только свою часть — см. loot-payout.html
  document.getElementById("toPayoutBtn").addEventListener("click", async () => {
    if(!lastRows.length) return;
    const btn = document.getElementById("toPayoutBtn");
    const hintEl = document.getElementById("toPayoutHint");
    btn.disabled = true;
    const goldByNick = {};
    lastRows.forEach(r => { goldByNick[r.nick] = r.gold; });
    const { error } = await db.from("payout_batches").upsert(
      {
        clan_id: profile.clan_id,
        from_date: document.getElementById("fromDate").value,
        to_date: document.getElementById("toDate").value,
        gold_by_nick: goldByNick,
        source: "solo",
        created_by: profile.id,
        created_at: new Date().toISOString(),
      },
      { onConflict: "clan_id" }
    );
    if(error){
      document.getElementById("lsError").textContent = L2I18n.t("dkp.payoutSaveFailed", "Не удалось отправить в раздачу: ") + error.message;
    } else {
      hintEl.textContent = L2I18n.t("dkp.payoutSentHint", "Отправлено — у каждого пати-лидера в «Раздаче» появится своя часть (на 24 часа).");
      hintEl.style.display = "";
      if(window.top && window.top.L2Nav) window.top.L2Nav.openSection("loot_payout");
    }
    btn.disabled = false;
  });

  // ---- иконка над столбцом мероприятия (только админ) ----
  let pickerTargetEventId = null;
  function openDayIconPicker(eventId){
    pickerTargetEventId = eventId;
    document.getElementById("dayIconPicker").click();
  }
  function resizeImageFile(file, maxSize){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
          const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/png"));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  document.getElementById("dayIconPicker").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if(!file || !pickerTargetEventId) return;
    const dataUrl = await resizeImageFile(file, 64);
    const { error } = await db.from("attendance_events").update({ icon: dataUrl }).eq("id", pickerTargetEventId);
    if(error){ document.getElementById("lsError").textContent = L2I18n.t("dkp.saveIconFailed", "Не удалось сохранить иконку: ") + error.message; return; }
    const ev = events.find(x => x.id === pickerTargetEventId);
    if(ev) ev.icon = dataUrl;
    renderHead();
  });

  await Promise.all([loadCensus(), loadMemberClasses(), loadBoostStructure(), loadBoostValues(), loadCoefficients(), loadLootSplitSettings()]);
  renderTable([]);
  if(restoreDkpFilters()) await doSplit();

  // заголовки/пустые состояния построены через JS (не data-i18n) — перестраиваем при смене языка
  window.addEventListener("storage", (e) => {
    if(e.key === "l2Lang") renderTable(lastRows);
  });
})();
</script>
</body>
</html>
