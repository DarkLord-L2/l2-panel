<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Отчёты по мероприятиям — Кабинет клана</title>
<link rel="stylesheet" href="js/theme.css?v=3" />
<style>
  .rep-wrap{ padding:0 0 32px; }

  .rep-layout{ display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; }
  .rep-main{ flex:1 1 480px; min-width:320px; }
  .rep-summary{ flex:0 0 300px; min-width:260px; }
  .rep-summary h2{ font-size:14px; margin:0 0 2px; }
  .rep-summary .sub{ font-size:11.5px; color: var(--text-dim); margin:0 0 12px; }

  /* та же логика, что в gc-table-scroll (gear-check.html): overflow:auto + max-height
     обязательны явно, иначе sticky-шапка "прилипает" к контейнеру, а не к экрану */
  .rep-table-scroll{ overflow:auto; max-height:70vh; }
  table.rep-table{ border-collapse:separate; border-spacing:0; width:auto; font-size:13px; }
  table.rep-table th, table.rep-table td{ padding:8px 12px; border-bottom:1px solid var(--border); white-space:nowrap; }
  table.rep-table thead th{
    position:sticky; top:0; z-index:2;
    background: var(--panel);
    color: var(--text-dim); font-size:12px; font-weight:500;
    text-align:center;
  }
  table.rep-table thead th.rep-col-nick{ text-align:left; }
  table.rep-table .rep-col-nick{
    position:sticky; left:0; z-index:1;
    background: var(--panel-2);
    box-shadow: 2px 0 6px rgba(0,0,0,.35);
    text-align:left;
  }
  table.rep-table thead th.rep-col-nick{ z-index:3; background: var(--panel); }
  table.rep-table tbody tr:hover td{ background: rgba(255,255,255,.03); }
  table.rep-table tbody tr:hover td.rep-col-nick{ background: var(--panel-2); }
  table.rep-table td:not(.rep-col-nick){ text-align:center; }

  .rep-nick{ display:flex; align-items:center; gap:10px; }
  .rep-nick .avatar{
    width:34px; height:34px; flex:none;
    border-radius:50%; object-fit:cover;
    border:1px solid var(--border); background: var(--panel-2);
  }
  .rep-nick .who{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .rep-nick .name{ color: var(--text); font-weight:600; }
  .rep-nick .cls{ font-size:11px; color: var(--text-dim); }

  tr.rep-row-removed td{ opacity:.45; }
  .rep-removed-badge{
    font-size:9.5px; color: var(--danger-lit); border:1px solid var(--danger);
    border-radius:4px; padding:0 5px; margin-left:6px; white-space:nowrap;
  }

  .rep-filters{ display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; }
  .rep-filters .field{ margin:0; min-width:200px; }

  /* ---- радар-график (текущий период vs среднее) ---- */
  .rep-radar-svg{ width:100%; max-width:240px; display:block; margin:0 auto; overflow:visible; }
  .rep-radar-grid{ fill:none; stroke: var(--border); stroke-width:1; }
  .rep-radar-cur{ fill: rgba(139,92,246,.28); stroke:#8b5cf6; stroke-width:2; }
  .rep-radar-avg{ fill:none; stroke:#8b5cf6; stroke-width:1.5; stroke-dasharray:4 3; opacity:.9; }
  .rep-radar-label{ font-size:9px; fill: var(--text-dim); }
  .rep-radar-legend{ display:flex; gap:14px; justify-content:center; font-size:11px; color: var(--text-dim); margin-top:4px; flex-wrap:wrap; }
  .rep-legend-item{ display:flex; align-items:center; gap:5px; }
  .rep-legend-item .dot{ width:10px; height:10px; border-radius:2px; display:inline-block; background:#8b5cf6; }
  .rep-legend-item .dot.avg{ background:none; border:1.5px dashed #8b5cf6; }

  .rep-tiles{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
  .rep-tile{ background: var(--panel-2); border:1px solid var(--border); border-radius:7px; padding:8px 10px; }
  .rep-tile .val{ font-size:16px; font-weight:700; color: var(--text); line-height:1.3; }
  .rep-tile .lbl{ font-size:10.5px; color: var(--text-dim); }
</style>
</head>
<body>

<div class="rep-wrap" id="wrap" style="display:none;">
  <div class="page-head"><h1>Отчёты по мероприятиям</h1></div>

  <div class="rep-layout">
    <section class="card rep-main">
      <div class="rep-filters">
        <div class="field">
          <label for="weekSelect">Неделя</label>
          <select id="weekSelect"></select>
        </div>
        <div class="field" id="eventFieldWrap" style="display:none;">
          <label for="eventSelect">Мероприятие</label>
          <select id="eventSelect"></select>
        </div>
        <div class="field">
          <label for="groupFilter">Пати</label>
          <select id="groupFilter"></select>
        </div>
      </div>

      <div class="rep-table-scroll" style="margin-top:14px;">
        <table class="rep-table">
          <thead id="repHead"></thead>
          <tbody id="repBody"></tbody>
        </table>
      </div>
      <p class="empty-hint" id="repEmpty" style="display:none;">За выбранный период данных нет.</p>
    </section>

    <section class="card rep-summary">
      <h2 id="summaryTitle">Общая статистика</h2>
      <p class="sub" id="summarySubtitle">За всё время</p>

      <div id="radarWrap"></div>

      <div class="rep-tiles">
        <div class="rep-tile"><div class="val" id="sumKills">0</div><div class="lbl">Всего убийств</div></div>
        <div class="rep-tile"><div class="val" id="sumDeaths">0</div><div class="lbl">Всего смертей</div></div>
        <div class="rep-tile"><div class="val" id="sumKd">0.00</div><div class="lbl">Ср. K:D</div></div>
        <div class="rep-tile"><div class="val" id="sumPvp">0</div><div class="lbl">Всего PvP урона</div></div>
        <div class="rep-tile" style="grid-column:1 / -1;"><div class="val" id="sumActive">0</div><div class="lbl">Всего активных</div></div>
      </div>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js?v=4"></script>
<script src="js/classes.js?v=1"></script>
<script>
(async function(){
  const session = await L2Cabinet.requireSession();
  if(!session) return;

  const profile = await L2Cabinet.getProfile();
  if(!profile){
    document.body.innerHTML = '<div class="login-wrap"><div class="card login-card">' +
      '<h1>⚠ Профиль не найден</h1><p class="hint">Обратитесь к клан-лидеру.</p></div></div>';
    return;
  }

  const db = L2Cabinet.client;
  document.getElementById("wrap").style.display = "";

  // не-админ с назначенной пати видит только свою группу во всех фильтрах по группе
  const isPartyRestricted = !["glavadmin", "admin"].includes(profile.roles?.key) && !!profile.party_id;

  // статистика (килы/смерти/PvP/PvE) заносится в event_stats автоматически при
  // загрузке скринов в «Посещаемости» (js/event-roster.js) — здесь только просмотр.

  function escapeHtml(s){
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }
  function pad2(n){ return String(n).padStart(2, "0"); }
  function weekRangeLabel(weekStartStr){
    const monday = new Date(weekStartStr + "T00:00:00");
    const sunday = new Date(monday); sunday.setDate(sunday.getDate() + 6);
    return `${pad2(monday.getDate())}.${pad2(monday.getMonth()+1)} – ${pad2(sunday.getDate())}.${pad2(sunday.getMonth()+1)}.${sunday.getFullYear()}`;
  }

  const BLANK_IMG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='34' height='34'></svg>";
  function classIcon(name){ return (window.L2_CLASS_ICON && name) ? window.L2_CLASS_ICON(name) : null; }

  let memberInfo = new Map();     // nickname -> {class_name, icon}
  let memberInfoNorm = new Map(); // normalizeNick(nickname) -> {class_name, icon} — запасной поиск
  let groups = [];                // [{id, name}]
  let nickGroupsMap = new Map();  // nickname -> [{id, name}]
  let nickGroupsNorm = new Map(); // normalizeNick(nickname) -> [{id, name}] — запасной поиск
  let events = [];                // [{id, week_start, event_date, event_name}]
  let allRawStats = [];           // [{nickname, kills, deaths, pvp, pve, event_id, week_start}]
  let activeGroupFilterId = "";
  let selectedWeek = "";          // "" — всё время
  let selectedEvent = "";         // "" — вся неделя целиком (актуально только если selectedWeek не пуст)
  let periodValue = "";           // "" | "week:YYYY-MM-DD" | "event:<id>" — вычисляется из selectedWeek/selectedEvent

  // ОCR скрина со статистикой и «Перепись клана»/«Проверка буста» иногда распознают
  // один и тот же ник по-разному (регистр, дефисы/пробелы, обрезанный числовой суффикс:
  // «Amon-Ra» vs «AmonRa», «RastaDwarf420» vs «RastaDwarf»). Точное совпадение по нику
  // не всегда возможно — сравниваем ещё и по «очищенной» форме как запасной вариант.
  function normalizeNick(s){
    return String(s || "").toLowerCase().replace(/[^a-zа-яё0-9]/gi, "");
  }
  function findByNormalized(map, nickname){
    const norm = normalizeNick(nickname);
    if(map.has(norm)) return map.get(norm);
    for(const [key, value] of map){
      if(key && (key.startsWith(norm) || norm.startsWith(key))) return value;
    }
    return undefined;
  }
  function lookupMemberInfo(nickname){
    return memberInfo.get(nickname) || findByNormalized(memberInfoNorm, nickname) || {};
  }
  function lookupGroups(nickname){
    return nickGroupsMap.get(nickname) || findByNormalized(nickGroupsNorm, nickname) || [];
  }

  async function loadMemberInfo(){
    const { data } = await db.from("member_classes").select("nickname, class_name, icon");
    memberInfo = new Map();
    memberInfoNorm = new Map();
    (data || []).forEach(r => {
      const info = { class_name: r.class_name, icon: r.icon };
      memberInfo.set(r.nickname, info);
      memberInfoNorm.set(normalizeNick(r.nickname), info);
    });
  }

  async function loadGroups(){
    const [{ data: g }, { data: m }] = await Promise.all([
      db.from("clan_groups").select("id, name").order("name"),
      db.from("clan_group_members").select("group_id, nickname, clan_groups(name)"),
    ]);
    groups = g || [];
    nickGroupsMap = new Map();
    nickGroupsNorm = new Map();
    (m || []).forEach(row => {
      if(!nickGroupsMap.has(row.nickname)) nickGroupsMap.set(row.nickname, []);
      nickGroupsMap.get(row.nickname).push({ id: row.group_id, name: row.clan_groups?.name || "?" });
      const norm = normalizeNick(row.nickname);
      if(!nickGroupsNorm.has(norm)) nickGroupsNorm.set(norm, []);
      nickGroupsNorm.get(norm).push({ id: row.group_id, name: row.clan_groups?.name || "?" });
    });
  }

  async function loadEvents(){
    const { data, error } = await db
      .from("attendance_events")
      .select("id, week_start, event_date, event_name")
      .order("event_date");
    if(error) console.error(error);
    events = data || [];
  }

  async function loadAllStats(){
    const { data, error } = await db
      .from("event_stats")
      .select("nickname, kills, deaths, pvp_damage, pve_damage, event_id, removed, attendance_events!inner(week_start)");
    if(error){ console.error(error); allRawStats = []; return; }
    allRawStats = (data || []).map(r => ({
      nickname: r.nickname,
      kills: r.kills, deaths: r.deaths,
      pvp: r.pvp_damage, pve: r.pve_damage,
      event_id: r.event_id, week_start: r.attendance_events?.week_start,
      removed: !!r.removed,
    }));
  }

  function passesGroupFilter(nickname){
    if(!activeGroupFilterId) return true;
    return lookupGroups(nickname).some(g => g.id === activeGroupFilterId);
  }

  function renderGroupFilterOptions(){
    const sel = document.getElementById("groupFilter");
    sel.innerHTML = "";
    // не-админу с назначенной пати менять фильтр некуда — видит только свою группу
    if(isPartyRestricted){
      const myGroup = groups.find(g => g.id === profile.party_id);
      const opt = document.createElement("option");
      opt.value = profile.party_id; opt.textContent = myGroup?.name || "Моя пати";
      sel.appendChild(opt);
      sel.value = profile.party_id;
      sel.disabled = true;
      activeGroupFilterId = profile.party_id;
      return;
    }
    const allOpt = document.createElement("option");
    allOpt.value = ""; allOpt.textContent = "Все";
    sel.appendChild(allOpt);
    groups.forEach(g => {
      const opt = document.createElement("option");
      opt.value = g.id; opt.textContent = g.name;
      sel.appendChild(opt);
    });
    sel.value = "";
  }

  function distinctWeeksDesc(){
    return [...new Set(events.map(e => e.week_start))].sort((a, b) => b.localeCompare(a));
  }

  function renderWeekOptions(){
    const sel = document.getElementById("weekSelect");
    sel.innerHTML = "";
    const allOpt = document.createElement("option");
    allOpt.value = ""; allOpt.textContent = "Всё время";
    sel.appendChild(allOpt);
    distinctWeeksDesc().forEach(w => {
      const opt = document.createElement("option");
      opt.value = w; opt.textContent = weekRangeLabel(w);
      sel.appendChild(opt);
    });
    sel.value = "";
  }

  function renderEventOptions(weekStart){
    const sel = document.getElementById("eventSelect");
    sel.innerHTML = "";
    const wholeWeekOpt = document.createElement("option");
    wholeWeekOpt.value = ""; wholeWeekOpt.textContent = "Вся неделя";
    sel.appendChild(wholeWeekOpt);
    events
      .filter(e => e.week_start === weekStart)
      .sort((a, b) => a.event_date.localeCompare(b.event_date))
      .forEach(e => {
        const opt = document.createElement("option");
        opt.value = e.id;
        const d = new Date(e.event_date + "T00:00:00");
        opt.textContent = `${pad2(d.getDate())}.${pad2(d.getMonth() + 1)} — ${e.event_name}`;
        sel.appendChild(opt);
      });
    sel.value = "";
  }

  function recomputePeriodValue(){
    if(!selectedWeek) periodValue = "";
    else if(!selectedEvent) periodValue = "week:" + selectedWeek;
    else periodValue = "event:" + selectedEvent;
  }

  document.getElementById("weekSelect").addEventListener("change", (e) => {
    selectedWeek = e.target.value;
    selectedEvent = "";
    const eventWrap = document.getElementById("eventFieldWrap");
    if(selectedWeek){
      renderEventOptions(selectedWeek);
      eventWrap.style.display = "";
    } else {
      eventWrap.style.display = "none";
    }
    recomputePeriodValue();
    refreshReport();
  });
  document.getElementById("eventSelect").addEventListener("change", (e) => {
    selectedEvent = e.target.value;
    recomputePeriodValue();
    refreshReport();
  });
  document.getElementById("groupFilter").addEventListener("change", (e) => {
    activeGroupFilterId = e.target.value;
    refreshReport();
  });

  function filteredStats(){
    return allRawStats.filter(r => passesGroupFilter(r.nickname));
  }

  function statsForPeriod(period, rows){
    if(period.startsWith("week:")) return rows.filter(r => r.week_start === period.slice(5));
    if(period.startsWith("event:")) return rows.filter(r => r.event_id === period.slice(6));
    return rows; // "" — всё время
  }

  function aggregateByNickname(rows){
    const agg = new Map();
    rows.forEach(r => {
      const cur = agg.get(r.nickname) || { nickname: r.nickname, kills: 0, deaths: 0, pvp: 0, pve: 0, rowCount: 0, removedCount: 0 };
      cur.kills += r.kills; cur.deaths += r.deaths; cur.pvp += r.pvp; cur.pve += r.pve;
      cur.rowCount += 1;
      if(r.removed) cur.removedCount += 1;
      agg.set(r.nickname, cur);
    });
    // ник считается «удалённым» в этой выборке, только если удалены ВСЕ его записи —
    // если он ещё активен хотя бы в одном мероприятии периода, вниз не отправляем
    return [...agg.values()].map(r => ({
      ...r,
      kd: r.deaths > 0 ? r.kills / r.deaths : r.kills,
      removed: r.removedCount === r.rowCount,
    }));
  }

  function totals(rows){
    const nicks = new Set();
    const t = rows.reduce((acc, r) => {
      acc.kills += r.kills; acc.deaths += r.deaths; acc.pvp += r.pvp; acc.pve += r.pve;
      nicks.add(r.nickname);
      return acc;
    }, { kills: 0, deaths: 0, pvp: 0, pve: 0 });
    t.active = nicks.size;
    t.kd = t.deaths > 0 ? t.kills / t.deaths : t.kills;
    return t;
  }

  function bucketsFor(rows, key){
    const map = new Map();
    rows.forEach(r => {
      if(!map.has(r[key])) map.set(r[key], []);
      map.get(r[key]).push(r);
    });
    return [...map.values()].map(totals);
  }

  function averageOfBuckets(buckets){
    if(!buckets.length) return null;
    const sum = buckets.reduce((acc, b) => ({
      kills: acc.kills + b.kills, deaths: acc.deaths + b.deaths,
      pvp: acc.pvp + b.pvp, pve: acc.pve + b.pve,
    }), { kills: 0, deaths: 0, pvp: 0, pve: 0 });
    const n = buckets.length;
    const avg = { kills: sum.kills / n, deaths: sum.deaths / n, pvp: sum.pvp / n, pve: sum.pve / n };
    avg.kd = avg.deaths > 0 ? avg.kills / avg.deaths : avg.kills;
    return avg;
  }

  // лучшие сверху, худшие снизу — по килам, при равенстве по K:D; удалённые из явки
  // всегда в самом низу, отдельным блоком, независимо от их статистики
  function sortRows(rows){
    return rows.slice().sort((a, b) => {
      if(a.removed !== b.removed) return a.removed ? 1 : -1;
      return b.kills - a.kills || b.kd - a.kd || a.nickname.localeCompare(b.nickname);
    });
  }

  function applyStickyHead(){
    const head = document.getElementById("repHead");
    head.style.position = "sticky";
    head.style.top = "0";
  }

  function renderReportTable(rows){
    const head = document.getElementById("repHead");
    head.innerHTML = '<tr>' +
      '<th class="rep-col-nick">Ник</th>' +
      '<th>Килы</th><th>Смерти</th><th>K:D</th><th>PvP урон</th><th>PvE урон</th>' +
      '</tr>';
    applyStickyHead();

    const sorted = sortRows(rows);
    const body = document.getElementById("repBody");
    body.innerHTML = "";
    document.getElementById("repEmpty").style.display = sorted.length ? "none" : "";

    sorted.forEach(r => {
      const info = lookupMemberInfo(r.nickname);
      const avatarSrc = info.icon || classIcon(info.class_name) || BLANK_IMG;
      const tr = document.createElement("tr");
      if(r.removed) tr.className = "rep-row-removed";

      const tdNick = document.createElement("td");
      tdNick.className = "rep-col-nick";
      tdNick.innerHTML = `<div class="rep-nick"><img class="avatar" src="${avatarSrc}" alt="" />` +
        `<span class="who"><span class="name">${escapeHtml(r.nickname)}${r.removed ? ' <span class="rep-removed-badge">удалён</span>' : ""}</span>` +
        `<span class="cls">${escapeHtml(info.class_name || "")}</span></span></div>`;

      const tdKills = document.createElement("td"); tdKills.textContent = r.kills.toLocaleString("ru-RU");
      const tdDeaths = document.createElement("td"); tdDeaths.textContent = r.deaths.toLocaleString("ru-RU");
      const tdKd = document.createElement("td"); tdKd.textContent = r.kd.toFixed(2);
      const tdPvp = document.createElement("td"); tdPvp.textContent = r.pvp.toLocaleString("ru-RU");
      const tdPve = document.createElement("td"); tdPve.textContent = r.pve.toLocaleString("ru-RU");
      tr.append(tdNick, tdKills, tdDeaths, tdKd, tdPvp, tdPve);
      body.appendChild(tr);
    });
  }

  function renderTiles(t){
    document.getElementById("sumKills").textContent = t.kills.toLocaleString("ru-RU");
    document.getElementById("sumDeaths").textContent = t.deaths.toLocaleString("ru-RU");
    document.getElementById("sumKd").textContent = t.kd.toFixed(2);
    document.getElementById("sumPvp").textContent = t.pvp.toLocaleString("ru-RU");
    document.getElementById("sumActive").textContent = String(t.active);
  }

  function renderRadar(current, avg){
    const wrap = document.getElementById("radarWrap");
    if(!avg){
      wrap.innerHTML = '<p class="hint" style="text-align:center;">Сравнение доступно, если выбрана неделя или конкретное мероприятие.</p>';
      return;
    }

    const R = 70, C = 120;
    const angles = [0, 90, 180, 270];
    const labels = ["PvP урон", "Убийства", "Смерти", "K:D"];
    const curVals = [current.pvp, current.kills, current.deaths, current.kd];
    const avgVals = [avg.pvp, avg.kills, avg.deaths, avg.kd];
    const fracCur = curVals.map((v, i) => v / (Math.max(v, avgVals[i]) || 1));
    const fracAvg = avgVals.map((v, i) => v / (Math.max(v, curVals[i]) || 1));

    function toPoint(angleDeg, frac){
      const rad = (angleDeg - 90) * Math.PI / 180;
      return { x: C + Math.cos(rad) * R * frac, y: C + Math.sin(rad) * R * frac };
    }
    function polyStr(fracs){
      return angles.map((a, i) => toPoint(a, fracs[i])).map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
    }

    const gridPolys = [0.25, 0.5, 0.75, 1].map(lvl =>
      `<polygon class="rep-radar-grid" points="${polyStr([lvl, lvl, lvl, lvl])}"/>`
    ).join("");
    const axisLines = angles.map(a => {
      const p = toPoint(a, 1);
      return `<line x1="${C}" y1="${C}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" stroke="var(--border-lit)" stroke-width="1"/>`;
    }).join("");
    const labelEls = angles.map((a, i) => {
      const p = toPoint(a, 1.24);
      let anchor = "middle";
      if(a === 90) anchor = "start";
      if(a === 270) anchor = "end";
      return `<text x="${p.x.toFixed(1)}" y="${p.y.toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle" class="rep-radar-label">${labels[i]}</text>`;
    }).join("");

    wrap.innerHTML =
      `<svg viewBox="0 0 240 240" class="rep-radar-svg">` +
        gridPolys + axisLines +
        `<polygon class="rep-radar-avg" points="${polyStr(fracAvg)}"/>` +
        `<polygon class="rep-radar-cur" points="${polyStr(fracCur)}"/>` +
        labelEls +
      `</svg>` +
      `<div class="rep-radar-legend">` +
        `<span class="rep-legend-item"><i class="dot"></i>Текущий период</span>` +
        `<span class="rep-legend-item"><i class="dot avg"></i>Среднее</span>` +
      `</div>`;
  }

  function renderSummaryHeader(){
    const title = document.getElementById("summaryTitle");
    const sub = document.getElementById("summarySubtitle");
    if(periodValue.startsWith("week:")){
      title.textContent = "Недельная эффективность";
      sub.textContent = "Выбранная неделя vs среднее за всё время";
    } else if(periodValue.startsWith("event:")){
      title.textContent = "Эффективность мероприятия";
      sub.textContent = "Мероприятие vs среднее по всем мероприятиям";
    } else {
      title.textContent = "Общая статистика";
      sub.textContent = "За всё время";
    }
  }

  function refreshReport(){
    const grouped = filteredStats();
    const periodRows = statsForPeriod(periodValue, grouped);

    renderReportTable(aggregateByNickname(periodRows));

    renderSummaryHeader();
    renderTiles(totals(periodRows));

    let avg = null;
    if(periodValue.startsWith("week:")) avg = averageOfBuckets(bucketsFor(grouped, "week_start"));
    else if(periodValue.startsWith("event:")) avg = averageOfBuckets(bucketsFor(grouped, "event_id"));
    renderRadar(totals(periodRows), avg);
  }

  await Promise.all([loadMemberInfo(), loadGroups(), loadEvents(), loadAllStats()]);
  renderGroupFilterOptions();
  renderWeekOptions();
  refreshReport();
})();
</script>
</body>
</html>
