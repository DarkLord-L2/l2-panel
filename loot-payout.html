<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Раздача — Кабинет клана</title>
<link rel="stylesheet" href="js/theme.css?v=26" />
<style>
  .lp-wrap{ padding:0 0 24px; }
  .lp-wrap .page-head{ margin-bottom:0; }
  .lp-wrap .card{ padding-top:14px; }

  .lp-filters{ display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin:2px 0 14px; }
  .lp-filters .field{ margin:0; }
  .lp-filters .field.lp-field-leader{ min-width:260px; }
  .lp-filters input[type="date"]{ min-width:150px; }

  .lp-summary{ display:flex; gap:18px; flex-wrap:wrap; margin:0 0 12px; }
  .lp-summary .stat{ font-size:12.5px; color: var(--text-dim); }
  .lp-summary .stat b{ color: var(--text); font-weight:600; }

  /* строки-«карточки» — тот же приём, что в «ДКП Соло»/«ДКП Пати»: border-spacing
     по вертикали разводит строки, скруглённые крайние ячейки делают их отдельными
     блоками; никакого цвета по значению, только жирность/размер для акцента */
  table.lp-table{ border-collapse:separate; border-spacing:0 8px; width:100%; max-width:520px; font-size:13.5px; }
  table.lp-table th{
    padding:0 14px 8px;
    text-align:left; color: var(--text-dim); font-size:11px; font-weight:600;
    letter-spacing:.03em; text-transform:uppercase;
  }
  table.lp-table tbody td{ padding:12px 14px; background: var(--panel-2); border-top:1px solid var(--border-lit); border-bottom:1px solid var(--border-lit); }
  table.lp-table tbody tr td:first-child{ border-left:1px solid var(--border-lit); border-top-left-radius:10px; border-bottom-left-radius:10px; }
  table.lp-table tbody tr td:last-child{ border-right:1px solid var(--border-lit); border-top-right-radius:10px; border-bottom-right-radius:10px; }
  table.lp-table th.lp-num, table.lp-table td.lp-num{ text-align:right; white-space:nowrap; font-variant-numeric: tabular-nums; }
  table.lp-table tbody tr:hover td{ background: var(--panel); border-color: var(--gold-dim); }
  .lp-cnt{ color: var(--text); font-weight:700; font-size:14px; }
  .lp-gold{ color: var(--text); font-weight:700; font-size:14px; }

  .lp-copy-row{ margin:12px 0 0; }

  /* итоги по всем лидерам (только клан-лидер): сколько кому отправить */
  .lp-ov{ margin:0 0 16px; }
  .lp-ov h3{ margin:0 0 6px; font-size:13px; color: var(--gold); }
  table.lp-ov-table{ border-collapse:collapse; width:100%; max-width:560px; font-size:13px; }
  table.lp-ov-table th{ padding:4px 10px; text-align:left; color: var(--text-dim); font-size:11px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; }
  table.lp-ov-table td{ padding:6px 10px; border-top:1px solid var(--border); }
  table.lp-ov-table tbody tr.lp-ov-row{ cursor:pointer; }
  table.lp-ov-table tbody tr.lp-ov-row:hover td{ background: var(--panel-2); }
  table.lp-ov-table td.lp-num, table.lp-ov-table th.lp-num{ text-align:right; white-space:nowrap; font-variant-numeric: tabular-nums; }
  table.lp-ov-table tr.lp-ov-sum td{ font-weight:700; border-top:2px solid var(--border-lit); }
  table.lp-ov-table tr.lp-ov-un td{ color: var(--text-dim); font-size:12px; }
  tr.lp-total-row td{ font-weight:700; border-top:2px solid var(--border-lit) !important; }

  /* участник, которого нет в последней переписи — уже не в клане; красный крестик
     рядом с ником, никаких других изменений в таблице */
  .lp-left-cross{ color: var(--danger-lit); font-weight:700; margin-left:4px; }

  /* тот же «отдельный список» («Окна» и т.п.), что и в «Участники клана» — свой
     заголовок, ставится/снимается там же; тут просто бейдж рядом с ником для тех,
     кого туда реально добавили (тот же стиль пилюли, что .rw-tag-badge в roster.html) */
  .lp-tag-badge{ display:inline-block; font-size:10.5px; padding:2px 8px; border-radius:999px; border:1px dashed var(--border-lit); color: var(--text-dim); margin-left:6px; }

  /* строка пати-лидера — первая в таблице, среди остальных участников; тот же
     приём подсветки, что и hover — рамка акцентным цветом, свой цвет бейджа */
  .lp-leader-row td{ border-color: var(--gold-dim); }
  .lp-leader-badge{ border-style:solid; border-color: var(--gold-dim); color: var(--gold); }

  /* «Раздача» / «Архив» — та же схема переключателя, что filter-tab в «Налогах»/«Посещаемости» */
  .lp-tabs{ display:flex; gap:6px; margin:2px 0 14px; }
  .lp-tab{
    font-family:inherit; font-size:12.5px; padding:7px 14px; border-radius:6px;
    border:1px solid var(--border); background: var(--panel-2); color: var(--text-dim); cursor:pointer;
  }
  .lp-tab:hover{ border-color: var(--border-lit); color: var(--text); }
  .lp-tab.active{ border-color: var(--border-lit); background: var(--panel); color: var(--gold); }

  /* архив — карточка на каждую раздачу, свёрнута по умолчанию (только шапка) */
  .lp-archive-entry{
    background: var(--panel-2); border:1px solid var(--border-lit); border-radius:10px;
    margin:0 0 10px; overflow:hidden;
  }
  .lp-archive-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; flex-wrap:wrap; }
  .lp-archive-head-info{ display:flex; flex-direction:column; gap:2px; }
  .lp-archive-head-info b{ font-size:13.5px; color: var(--text); }
  .lp-archive-period{ font-size:11.5px; color: var(--text-dim); }
  .lp-archive-source{ font-size:10.5px; color: var(--text-dim); }
  .lp-archive-head-actions{ display:flex; gap:8px; flex:none; }
  .lp-archive-body{ padding:0 14px 14px; display:flex; flex-direction:column; gap:14px; }
  .lp-archive-leader h3{ margin:0 0 6px; font-size:13px; color: var(--gold); }
  table.lp-archive-table{ border-collapse:collapse; width:100%; max-width:420px; font-size:12.5px; }
  table.lp-archive-table td{ padding:5px 10px; border-bottom:1px solid var(--border); }
  table.lp-archive-table td.lp-num{ text-align:right; white-space:nowrap; font-variant-numeric: tabular-nums; }
  tr.lp-archive-leader-row td{ font-weight:600; }
</style>
</head>
<body>

<div class="lp-wrap" id="wrap" style="display:none;">
  <div class="page-head">
    <h1 data-i18n="payout.title">Раздача</h1>
  </div>

  <div class="lp-tabs" id="lpTabs" style="display:none;">
    <button type="button" class="lp-tab active" id="lpTabCurrent" data-i18n="payout.tabCurrent">Раздача</button>
    <button type="button" class="lp-tab" id="lpTabArchive" data-i18n="payout.tabArchive">Архив</button>
  </div>

  <section class="card" id="lpCurrentView">
    <p class="hint" id="lpMyLeaderInfo" style="margin:0 0 12px; display:none;"></p>
    <p class="hint" id="lpPeriodInfo" style="margin:0 0 12px; display:none;"></p>
    <div class="lp-copy-row" id="lpBatchActions" style="display:none; margin:0 0 12px;">
      <button class="btn" id="lpArchiveBtn" data-i18n="payout.archiveBtn">Занести в архив</button>
      <button class="btn btn-danger" id="lpDeleteBatchBtn" data-i18n="payout.deleteBatchBtn">Удалить раздачу</button>
    </div>
    <p class="ok-msg" id="lpArchiveOk" style="display:none;" data-i18n="payout.archivedOk">Занесено в архив.</p>
    <p class="error-msg" id="lpArchiveError"></p>

    <div class="lp-filters" id="lpAdminFilters">
      <div class="field">
        <label for="fromDate" data-i18n="payout.fromLabel">С</label>
        <input type="date" id="fromDate" />
      </div>
      <div class="field">
        <label for="toDate" data-i18n="payout.toLabel">По</label>
        <input type="date" id="toDate" />
      </div>
      <button class="btn" id="lpApplyBtn" data-i18n="payout.applyBtn">Показать</button>
      <div class="field lp-field-leader">
        <label for="leaderSelect" data-i18n="payout.leaderLabel">Пати-лидер</label>
        <select id="leaderSelect"></select>
      </div>
    </div>
    <p class="hint" id="lpNoDateHint" style="margin:-4px 0 12px;" data-i18n="payout.noDateHint">Даты не заданы — показывается статистика за всё время.</p>
    <p class="hint" id="lpNoGoldHint" style="margin:-4px 0 12px; display:none;"></p>
    <p class="error-msg" id="lpError"></p>
    <p class="hint" id="lpEventsHint" style="margin:-4px 0 12px; display:none;"></p>
    <div class="lp-ov" id="lpOverview" style="display:none;"></div>

    <div id="lpContent">
      <div class="lp-summary" id="lpSummary"></div>
      <table class="lp-table">
        <thead>
          <tr><th data-i18n="payout.colNick">Ник</th><th class="lp-num" data-i18n="payout.colTogether">Доли</th><th class="lp-num" data-i18n="payout.colGold">Голда</th></tr>
        </thead>
        <tbody id="lpBody"></tbody>
      </table>
      <div class="lp-copy-row">
        <button class="btn" id="lpCopyBtn" data-i18n="payout.copyBtn" data-i18n-attr="title:payout.copyBtnTitle" title="Скопировать список ников (в порядке таблицы)">📋 Скопировать ники</button>
      </div>
    </div>
    <p class="empty-hint" id="lpEmpty" style="display:none;"></p>
  </section>

  <section class="card" id="lpArchiveView" style="display:none;">
    <div id="lpArchiveList"></div>
    <p class="empty-hint" id="lpArchiveEmpty" style="display:none;" data-i18n="payout.archiveEmpty">Архив пуст — раздачи туда попадают только по кнопке «Занести в архив».</p>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js?v=21"></script>
<script src="js/i18n.js?v=48"></script>
<script>
(async function(){
  const session = await L2Cabinet.requireSession();
  if(!session) return;

  const profile = await L2Cabinet.getProfile();
  if(!profile){
    document.body.innerHTML = '<div class="login-wrap"><div class="card login-card">' +
      '<h1>' + L2I18n.t("shell.profileNotFoundTitle", "⚠ Профиль не найден") + '</h1>' +
      '<p class="hint">' + L2I18n.t("common.contactLeader", "Обратитесь к клан-лидеру.") + '</p></div></div>';
    return;
  }

  const isAdmin = ["glavadmin", "admin"].includes(profile.roles?.key);
  const db = L2Cabinet.client;
  document.getElementById("wrap").style.display = "";

  function escapeHtml(s){
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }

  // перепись иногда пишет ник чуть иначе (кириллица/латиница похожих букв, регистр) —
  // та же схема нормализации, что в «ДКП Соло»/«ДКП Пати»
  // Ключ для сопоставления ника между таблицами. Сливаем только то, что на скрине
  // действительно неотличимо: кириллицу/латиницу одного регистра (А↔A, о↔o…),
  // ноль и заглавную O, строчную L / заглавную I / «|». Регистр и «i» с точкой —
  // реальная разница («Олежа» и «ОлЕжА» — разные игроки). Ники целиком из
  // путаемых символов (0000000000, 1111111111, iIiIiIiIIiIi) и ники без букв/цифр
  // сравниваем только точной строкой — иначе все они схлопнулись бы в один ключ.
  const CYR_LOOKALIKES = { "а":"a","в":"b","е":"e","к":"k","м":"m","н":"h","о":"o","р":"p","с":"c","т":"t","у":"y","х":"x","ё":"e",
    "А":"A","В":"B","Е":"E","К":"K","М":"M","Н":"H","О":"O","Р":"P","С":"C","Т":"T","У":"Y","Х":"X","Ё":"E",
    "0":"O","l":"I","|":"I" };
  function normalizeNick(s){
    const raw = String(s || "");
    if(/^[0Oo1lIi|!]{3,}$/.test(raw)) return "=" + raw;
    const key = raw.split("").map(ch => CYR_LOOKALIKES[ch] || ch).join("").replace(/[^A-Za-zА-Яа-яЁё0-9]/g, "");
    return key || "=" + raw;
  }
  // «Кто я» (права лидера/зама пати, свой кабинет, своя аватарка): МЯГКОЕ сравнение —
  // точное совпадение или то же написание без учёта регистра/похожих букв. Строгий
  // normalizeNick тут не годится: ник в профиле мог быть набран другим регистром, чем
  // в «Группах»/переписи, и человек потерял бы доступ. Ники из одних путаемых символов
  // (0000000000, iIiIiI…) — только точно, чтобы они не совпали друг с другом.
  const LOOSE_LOOKALIKES = { "а":"a","в":"b","е":"e","к":"k","м":"m","н":"h","о":"o","р":"p","с":"c","т":"t","у":"y","х":"x","ё":"e","0":"o","l":"i" };
  function looseNick(s){
    return String(s || "").toLowerCase().split("").map(ch => LOOSE_LOOKALIKES[ch] || ch).join("").replace(/[^a-zа-яё0-9]/g, "");
  }
  function sameNick(a, b){
    a = String(a || "").trim(); b = String(b || "").trim();
    if(!a || !b) return false;
    if(a === b) return true;
    if(/^[0Oo1lIi|!]{3,}$/.test(a) || /^[0Oo1lIi|!]{3,}$/.test(b)) return false;
    const ka = looseNick(a);
    return !!ka && ka === looseNick(b);
  }

  // последняя перепись — чтобы пометить красным крестиком тех, кто уже пропал
  // из клана; пусто, если переписи вообще нет — тогда никого не помечаем
  let censusNormSet = new Set();
  // normalizeNick(nickname) -> самая свежая неделя переписи, в которой он вообще
  // встречался — для подсказки «был в переписи от {дата}» у тех, кто пропал
  // из клана давно, а не только на прошлой неделе
  let lastSeenWeekByNorm = new Map();
  async function loadCensus(){
    const { data } = await db.from("census_entries").select("nickname, week_start");
    const weeks = [...new Set((data || []).map(r => r.week_start))].sort();
    const latest = weeks.length ? weeks[weeks.length - 1] : null;
    censusNormSet = latest
      ? new Set((data || []).filter(r => r.week_start === latest).map(r => normalizeNick(r.nickname)))
      : new Set();
    lastSeenWeekByNorm = new Map();
    (data || []).forEach(r => {
      const norm = normalizeNick(r.nickname);
      const prev = lastSeenWeekByNorm.get(norm);
      if(!prev || r.week_start > prev) lastSeenWeekByNorm.set(norm, r.week_start);
    });
  }
  function isLeftClan(nick){ return censusNormSet.size > 0 && !censusNormSet.has(normalizeNick(nick)); }
  function fmtDate(iso){
    if(!iso) return "";
    const [y, m, d] = iso.split("-");
    return `${d}.${m}.${y}`;
  }
  function leftClanTitleOf(nick){
    const lastWeek = lastSeenWeekByNorm.get(normalizeNick(nick));
    if(lastWeek) return L2I18n.t("dkp.leftClanTitleWithDate", "Уже не в клане — был в переписи от {date}").replace("{date}", fmtDate(lastWeek));
    // не просто «пропал из последней переписи», а вообще ни разу не встречался
    // ни в одной неделе — отдельный явный текст, чтобы не выглядело как
    // «подсказка не работает» на фоне остальных строк с датой
    return L2I18n.t("dkp.leftClanTitleNoHistory", "Уже не в клане — в переписи вообще не встречался");
  }

  // «отдельный список» из «Участники клана» (например «Окна» — альт-персонажи) —
  // один список на клан, свой заголовок; тут просто показываем этот заголовок
  // рядом с ником, но только тем, кого туда реально добавили
  let tagLabel = "";
  let tagEnabled = false;
  let taggedNormSet = new Set();
  async function loadRosterTag(){
    const [{ data: settings }, { data: tagged }] = await Promise.all([
      db.from("roster_tag_settings").select("label, enabled").maybeSingle(),
      db.from("roster_tagged_members").select("nickname"),
    ]);
    tagLabel = settings?.label || "";
    tagEnabled = !!settings?.enabled;
    taggedNormSet = new Set((tagged || []).map(r => normalizeNick(r.nickname)));
  }
  function tagBadgeOf(nick){
    return (tagEnabled && taggedNormSet.has(normalizeNick(nick))) ? tagLabel : null;
  }

  // ---- копирование списка ников (та же схема, что в «Налогах»/«Посещаемости») ----
  function flashCopyBtn(btn, symbol){
    if(!btn) return;
    const original = btn.textContent;
    btn.textContent = symbol;
    btn.disabled = true;
    setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1000);
  }
  async function copyNumberedNicknames(names, btn){
    if(!names.length){ flashCopyBtn(btn, "∅"); return; }
    const text = names.map((n, i) => `${i + 1}. ${n}`).join("\n");
    try{
      await navigator.clipboard.writeText(text);
      flashCopyBtn(btn, "✓");
    }catch(e){
      flashCopyBtn(btn, "✗");
    }
  }

  let leaderStats = new Map(); // leaderNick -> { partyCount, members: Map(memberNick -> count) }
  let leaderOrder = [];        // ники лидеров, отсортированные по убыванию partyCount
  let currentRows = [];        // [{nickname, count}], в текущем отображаемом порядке (для копирования)

  // «Раздача»: показывать ли ушедших из клана в списке (Админ-панель → «ДКП») —
  // их голда всё равно всегда делится поровну между оставшимися в клане в том
  // же списке лидера, этот тумблер влияет только на видимость их строки
  let showLeftInPayout = true;
  async function loadPayoutShowLeft(){
    const { data } = await db.from("loot_split_settings").select("show_left_in_payout").eq("clan_id", profile.clan_id).maybeSingle();
    showLeftInPayout = data?.show_left_in_payout ?? true;
  }

  // голда больше не считается на этой странице — её присылает «ДКП Соло»/«ДКП Пати»
  // кнопкой «Раздать» в общую на весь клан таблицу payout_batches (не
  // sessionStorage — тот виден только в браузере того, кто нажал, а тут её должен
  // увидеть КАЖДЫЙ пати-лидер на своём устройстве). Список «кто с каким лидером
  // сколько раз был» — отдельная, независимая от ДКП штука (строится из
  // event_stats/is_party_leader по своему фильтру дат) и работает всегда, даже
  // без активной раздачи — тогда просто колонка «Голда» остаётся пустой
  const PAYOUT_BATCH_MAX_AGE_MS = 24 * 60 * 60 * 1000; // «висит» 24 часа
  let dkpPayload = null; // { from, to, goldByNick: {nickname: gold}, goldByNorm: Map(norm -> gold), source: "solo"|"party" }
  async function loadDkpPayload(){
    // event_ids — точный список мероприятий раздачи (schema_payout_event_ids.sql); если колонки ещё нет, читаем без неё
    let res = await db.from("payout_batches").select("from_date, to_date, gold_by_nick, source, created_at, event_ids").eq("clan_id", profile.clan_id).maybeSingle();
    if(res.error) res = await db.from("payout_batches").select("from_date, to_date, gold_by_nick, source, created_at").eq("clan_id", profile.clan_id).maybeSingle();
    const data = res.data;
    if(!data || !data.gold_by_nick) return null;
    const ageMs = Date.now() - new Date(data.created_at).getTime();
    if(ageMs > PAYOUT_BATCH_MAX_AGE_MS) return null; // протухла — как будто её и нет
    // ключи gold_by_nick — ники из переписи («ДКП Соло»/«ДКП Пати» считают по ним),
    // а тут ники берутся из сырого распознавания скрина (event_stats) — написание
    // может чуть отличаться (0/O, регистр и т.п.), поэтому сопоставляем по
    // normalizeNick, а не точным совпадением строки
    const goldByNorm = new Map();
    Object.entries(data.gold_by_nick).forEach(([nick, gold]) => goldByNorm.set(normalizeNick(nick), gold));
    return { from: data.from_date, to: data.to_date, goldByNick: data.gold_by_nick, goldByNorm, source: data.source, createdAt: data.created_at, eventIds: Array.isArray(data.event_ids) ? data.event_ids : null };
  }
  async function deleteDkpPayload(){
    await db.from("payout_batches").delete().eq("clan_id", profile.clan_id);
  }
  // лидер на скрине не распознаётся отдельным ОСР-полем — event-roster.js просто
  // помечает is_party_leader=true у первого валидного ника скрина (лидер пати в игре
  // всегда идёт первой строкой), группируем эти отметки по batch_id
  async function loadPayoutStats(fromStr, toStr, eventIds){
    const errEl = document.getElementById("lpError");
    errEl.textContent = "";

    // период не обязателен целиком с обеих сторон — открытая граница просто не
    // ограничивает соответствующую сторону (та же логика, что в датных фильтрах
    // «Донатов» в Налогах)
    let eventIdFilter = null;
    if(Array.isArray(eventIds)){
      eventIdFilter = new Set(eventIds); // точный список мероприятий раздачи — даты не нужны
    } else if(fromStr || toStr){
      let evQ = db.from("attendance_events").select("id");
      if(fromStr) evQ = evQ.gte("event_date", fromStr);
      if(toStr) evQ = evQ.lte("event_date", toStr);
      const { data: evs, error: evErr } = await evQ;
      if(evErr){ errEl.textContent = L2I18n.t("payout.loadEventsFailed", "Не удалось загрузить мероприятия: ") + evErr.message; return; }
      eventIdFilter = new Set((evs || []).map(e => e.id));
    }

    const { data, error } = await db
      .from("event_stats")
      .select("nickname, batch_id, is_party_leader, removed, event_id")
      .not("batch_id", "is", null);
    if(error){ errEl.textContent = L2I18n.t("payout.loadDataFailed", "Не удалось загрузить данные: ") + error.message; return; }

    const byBatch = new Map();
    (data || []).forEach(r => {
      if(r.removed) return;
      if(eventIdFilter && !eventIdFilter.has(r.event_id)) return;
      if(!byBatch.has(r.batch_id)) byBatch.set(r.batch_id, []);
      byBatch.get(r.batch_id).push(r);
    });

    leaderStats = new Map();
    byBatch.forEach(rows => {
      const leaderRow = rows.find(r => r.is_party_leader);
      if(!leaderRow) return; // скрин загружен до этой фичи — лидер не отмечен, пропускаем
      const leader = leaderRow.nickname;
      if(!leaderStats.has(leader)) leaderStats.set(leader, { partyCount: 0, members: new Map() });
      const entry = leaderStats.get(leader);
      entry.partyCount += 1;
      rows.forEach(r => {
        if(r.nickname === leader) return;
        entry.members.set(r.nickname, (entry.members.get(r.nickname) || 0) + 1);
      });
    });

    // сколько раз каждый ник (нормализованный) мелькал у какого лидера, включая самих лидеров в своих
    // скринах: по этим числам голда человека делится между лидерами, у которых он был
    visitsByNorm = new Map();
    byBatch.forEach(rows => {
      const lr = rows.find(r => r.is_party_leader);
      if(!lr) return;
      rows.forEach(r => {
        const n = normalizeNick(r.nickname);
        if(!visitsByNorm.has(n)) visitsByNorm.set(n, { total: 0, by: new Map() });
        const v = visitsByNorm.get(n);
        v.total += 1;
        v.by.set(lr.nickname, (v.by.get(lr.nickname) || 0) + 1);
      });
    });

    leaderOrder = Array.from(leaderStats.keys())
      .sort((a, b) => leaderStats.get(b).partyCount - leaderStats.get(a).partyCount || a.localeCompare(b));
  }

  function renderLeaderSelect(){
    const sel = document.getElementById("leaderSelect");
    sel.innerHTML = leaderOrder
      .map(nick => `<option value="${escapeHtml(nick)}">${escapeHtml(nick)} — ${leaderStats.get(nick).partyCount}${L2I18n.t("payout.payoutsCountSuffix", " раздач")}</option>`)
      .join("");
  }

  // не-админ (обычный пати-лидер) не выбирает лидера сам — ему сразу показывается
  // его собственная часть, если он вообще отмечен лидером хоть одного мероприятия
  // за этот период (сопоставление по нику, устойчивое к разнице в написании)
  function findMyLeaderKey(){
    return leaderOrder.find(nick => sameNick(nick, profile.nickname)) || null;
  }
  function renderMyLeaderInfo(leaderKey){
    const el = document.getElementById("lpMyLeaderInfo");
    el.textContent = leaderKey
      ? L2I18n.t("payout.youAreLeader", "Ты — пати-лидер «{nick}» за этот период.").replace("{nick}", leaderKey)
      : L2I18n.t("payout.youAreNotLeader", "За этот период ты не отмечен лидером ни в одном мероприятии.");
    el.style.display = "";
  }

  // не-админу период раздачи (даты активного payout_batches) показываем только
  // текстом — он не может его менять, поле «С/По» ему вообще не показывается
  function renderPeriodInfo(){
    const el = document.getElementById("lpPeriodInfo");
    const from = document.getElementById("fromDate").value;
    const to = document.getElementById("toDate").value;
    el.textContent = (from || to)
      ? L2I18n.t("payout.periodRange", "Период: {from} — {to}")
        .replace("{from}", from ? fmtDate(from) : "…")
        .replace("{to}", to ? fmtDate(to) : "…")
      : L2I18n.t("payout.periodAllTime", "Период: за всё время.");
    el.style.display = "";
  }

  // голда конкретного ника — только если пришли свежие данные из ДКП, иначе
  // null (не 0 — 0 читалось бы как «посчитано и вышло 0», а тут просто нечем
  // считать); рендерящий код сам решает, показать число или прочерк
  function goldOf(nick){
    if(!dkpPayload) return null;
    const gold = dkpPayload.goldByNorm.get(normalizeNick(nick));
    return gold || 0;
  }
  function fmtGold(gold){
    return gold === null ? "—" : Math.round(gold).toLocaleString(L2I18n.locale());
  }

  // Голда в раздаче посчитана на человека целиком, а не на каждого лидера. Если человек за период
  // был у нескольких лидеров, его голда делится между ними пропорционально тому, сколько раз он был
  // у каждого — иначе каждому лидеру показывалась бы его полная сумма (так сумма дублировалась
  // и «каждый должен был дать по 3, а не по 1»).
  let visitsByNorm = new Map(); // normalizeNick(nick) -> { total, by: Map(leaderNick -> раз) }
  function shareGold(nick, leader){
    const base = goldOf(nick);
    if(base === null) return null;
    const v = visitsByNorm.get(normalizeNick(nick));
    if(!v || !v.total) return base;
    return base * (v.by.get(leader) || 0) / v.total;
  }

  // коэффициент лидера (например ×2: на пати из 9 человек выходит 10 частей — 9 участникам и ещё одна
  // часть лидеру) уже заложен в голде самой раздачи; тут он только подписывается рядом с лидером.
  // В «ДКП Соло» он применяется лишь при включённой настройке «коэффициент лидера и в Соло»
  let leaderCoefByNorm = new Map();
  let leaderCoefInSolo = false;
  async function loadLeaderCoefs(){
    const { data } = await db.from("loot_leader_coefficients").select("nickname, coefficient");
    leaderCoefByNorm = new Map((data || []).map(r => [normalizeNick(r.nickname), Number(r.coefficient)]));
    const { data: ls, error } = await db.from("loot_split_settings").select("leader_coef_in_solo").eq("clan_id", profile.clan_id).maybeSingle();
    leaderCoefInSolo = !error && !!ls?.leader_coef_in_solo;
  }
  function leaderCoefLabel(nick){
    if(!dkpPayload) return null;
    if(dkpPayload.source !== "party" && !leaderCoefInSolo) return null;
    const c = leaderCoefByNorm.get(normalizeNick(nick));
    return (c === undefined || c === 1) ? null : c;
  }

  // общая для показа и для архивации математика: доли, голда, поровну поделённая
  // голда ушедших из клана, сортировка. Возвращает leaderRow отдельно (он не
  // участвует в сортировке участников, всегда идёт первой строкой) и ВСЕХ
  // участников отсортированными (включая ушедших — фильтр показа/скрытия
  // ушедших применяется только при показе, архив хранит всё как есть)
  function computeLeaderRows(leader){
    const entry = leaderStats.get(leader);
    const leaderGold = shareGold(leader, leader);
    const memberRows = Array.from(entry.members.entries())
      .map(([nickname, count]) => ({ nickname, count, left: isLeftClan(nickname) }));

    // ушедшие из клана не забирают голду сами — их сумма делится поровну между
    // оставшимися в клане в этом же списке; строка ушедшего (если её вообще
    // показываем) при этом отображает его исходную, ещё не поделённую сумму —
    // просто для справки, сколько ему причиталось бы
    const stayRows = memberRows.filter(r => !r.left);
    const redistributePool = memberRows.filter(r => r.left).reduce((s, r) => s + (shareGold(r.nickname, leader) || 0), 0);
    const perStayBonus = stayRows.length ? redistributePool / stayRows.length : 0;
    memberRows.forEach(r => {
      const base = shareGold(r.nickname, leader);
      r.gold = r.left || base === null ? base : base + perStayBonus;
    });

    const sortByGold = (a, b) => {
      if(a.gold === null || b.gold === null) return (a.gold === null) - (b.gold === null) || a.nickname.localeCompare(b.nickname);
      return b.gold - a.gold || a.nickname.localeCompare(b.nickname);
    };
    memberRows.sort(sortByGold);

    // «Доли» у лидера — не то же самое, что у участников (там это число раздач
    // именно под ЭТИМ лидером), но параллельный смысл есть: сколько раз он сам
    // водил раздачу за период — тот же entry.partyCount
    const leaderRow = { nickname: leader, count: entry.partyCount, left: isLeftClan(leader), gold: leaderGold, isLeader: true };
    // «К отправке» этому лидеру: его собственная часть + части оставшихся в клане участников
    // (с учётом перераспределённой доли ушедших); строки ушедших — только справка
    const sentMembers = stayRows.reduce((sum, r) => sum + (r.gold || 0), 0);
    const total = leaderGold === null ? null : (leaderGold || 0) + sentMembers;
    return { leaderRow, memberRows, stayRows: stayRows.slice().sort(sortByGold), total, sentMembers };
  }

  function renderForLeader(leader){
    const contentEl = document.getElementById("lpContent");
    const emptyEl = document.getElementById("lpEmpty");
    if(!leader){
      contentEl.style.display = "none";
      const hasDateFilter = !!(document.getElementById("fromDate").value || document.getElementById("toDate").value);
      emptyEl.textContent = hasDateFilter
        ? L2I18n.t("payout.emptyForPeriod", "За выбранный период нет скринов с отмеченным пати-лидером.")
        : L2I18n.t("payout.emptyNoScreens", "Пока нет ни одного скрина с отмеченным пати-лидером — загрузите скрины в «Журнале посещаемости».");
      emptyEl.style.display = "";
      return;
    }
    contentEl.style.display = "";
    emptyEl.style.display = "none";

    const entry = leaderStats.get(leader);
    const { leaderRow, memberRows, stayRows, total, sentMembers } = computeLeaderRows(leader);
    const coefLbl = leaderCoefLabel(leader);
    document.getElementById("lpSummary").innerHTML =
      `<span class="stat">${L2I18n.t("payout.ledCount", "Раздач под руководством: ")}<b>${entry.partyCount}</b></span>` +
      `<span class="stat">${L2I18n.t("payout.uniqueMembers", "Разных участников: ")}<b>${entry.members.size}</b></span>` +
      (total !== null
        ? `<span class="stat">${L2I18n.t("payout.totalToSend", "К отправке лидеру: ")}<b>${fmtGold(total)}</b> ` +
          `(${L2I18n.t("payout.totalMembers", "участникам")} ${fmtGold(sentMembers)} + ${L2I18n.t("payout.totalLeader", "лидеру")} ${fmtGold(leaderRow.gold)}${coefLbl ? " — ×" + coefLbl : ""})</span>`
        : "");
    const visibleMemberRows = showLeftInPayout ? memberRows : stayRows;
    currentRows = [leaderRow, ...visibleMemberRows];

    const body = document.getElementById("lpBody");
    body.innerHTML = currentRows.map(r => {
      const cross = r.left ? ` <span class="lp-left-cross" title="${escapeHtml(leftClanTitleOf(r.nickname))}">✗</span>` : "";
      const tag = tagBadgeOf(r.nickname);
      const badge = tag ? ` <span class="lp-tag-badge">${escapeHtml(tag)}</span>` : "";
      const leaderBadge = r.isLeader ? ` <span class="lp-tag-badge lp-leader-badge">${escapeHtml(L2I18n.t("payout.leaderBadge", "пати-лидер"))}${coefLbl ? " ×" + coefLbl : ""}</span>` : "";
      const countText = r.count === null ? "—" : r.count;
      return `<tr class="${r.isLeader ? "lp-leader-row" : ""}"><td>${escapeHtml(r.nickname)}${leaderBadge}${cross}${badge}</td>` +
        `<td class="lp-num lp-cnt">${countText}</td>` +
        `<td class="lp-num lp-gold">${fmtGold(r.gold)}</td></tr>`;
    }).join("") + (total !== null
      ? `<tr class="lp-total-row"><td>${L2I18n.t("payout.totalRow", "Итого к отправке")}</td><td></td><td class="lp-num lp-gold" title="${escapeHtml(L2I18n.t("payout.totalRowTitle", "Лидер + участники в клане; доля ушедших уже поделена между оставшимися"))}">${fmtGold(total)}</td></tr>`
      : "");
  }

  // итоги по ВСЕМ лидерам — чтобы клан-лидер сразу видел, сколько кому отправить, не листая каждого
  function renderOverview(batchMatchesView){
    const el = document.getElementById("lpOverview");
    if(!isAdmin || !dkpPayload || !leaderOrder.length){ el.style.display = "none"; el.innerHTML = ""; return; }
    let grand = 0;
    const rows = leaderOrder.map(leader => {
      const c = computeLeaderRows(leader);
      grand += c.total || 0;
      return { leader, parties: c.leaderRow.count, members: c.stayRows.length, total: c.total || 0, coef: leaderCoefLabel(leader) };
    });
    // сколько голды по списку раздачи вообще не попало ни к одному лидеру (человек был в журнале явки,
    // но не на скринах с отмеченным лидером) — видно только когда экран смотрит ровно на период раздачи
    const sumAll = Object.values(dkpPayload.goldByNick).reduce((sum, g) => sum + (Number(g) || 0), 0);
    const unassigned = batchMatchesView ? sumAll - grand : 0;
    el.innerHTML = `<h3>${escapeHtml(L2I18n.t("payout.overviewTitle", "Итого: что отправить каждому лидеру"))}</h3>` +
      `<table class="lp-ov-table"><thead><tr><th>${escapeHtml(L2I18n.t("payout.leaderLabel", "Пати-лидер"))}</th>` +
      `<th class="lp-num">${escapeHtml(L2I18n.t("payout.ovParties", "Раздач"))}</th><th class="lp-num">${escapeHtml(L2I18n.t("payout.ovMembers", "Участников"))}</th>` +
      `<th class="lp-num">${escapeHtml(L2I18n.t("payout.ovTotal", "К отправке"))}</th></tr></thead><tbody>` +
      rows.map(r => `<tr class="lp-ov-row" data-leader="${escapeHtml(r.leader)}"><td>${escapeHtml(r.leader)}${r.coef ? ` <span class="lp-tag-badge lp-leader-badge">×${r.coef}</span>` : ""}</td>` +
        `<td class="lp-num">${r.parties}</td><td class="lp-num">${r.members}</td><td class="lp-num lp-gold">${fmtGold(r.total)}</td></tr>`).join("") +
      `<tr class="lp-ov-sum"><td>${escapeHtml(L2I18n.t("payout.ovSum", "Всего лидерам"))}</td><td></td><td></td><td class="lp-num">${fmtGold(grand)}</td></tr>` +
      (unassigned > 0.5 ? `<tr class="lp-ov-un"><td colspan="3" title="${escapeHtml(L2I18n.t("payout.ovUnassignedTitle", "Эти люди есть в расчёте ДКП, но не найдены на скринах с отмеченным пати-лидером"))}">${escapeHtml(L2I18n.t("payout.ovUnassigned", "Не привязано ни к одному лидеру"))}</td><td class="lp-num">${fmtGold(unassigned)}</td></tr>` : "") +
      `</tbody></table><div class="lp-copy-row"><button class="btn" id="lpOvCopyBtn" type="button">${escapeHtml(L2I18n.t("payout.ovCopy", "📋 Скопировать итоги"))}</button></div>`;
    el.style.display = "";
    el._rows = rows;
  }
  document.getElementById("lpOverview").addEventListener("click", async (e) => {
    const copy = e.target.closest("#lpOvCopyBtn");
    if(copy){
      const rows = document.getElementById("lpOverview")._rows || [];
      const text = rows.map(r => `${r.leader} — ${fmtGold(r.total)}`).join("\n");
      try { await navigator.clipboard.writeText(text); flashCopyBtn(copy, "✓"); } catch(err){ flashCopyBtn(copy, "✗"); }
      return;
    }
    const tr = e.target.closest(".lp-ov-row");
    if(tr && isAdmin){
      const sel = document.getElementById("leaderSelect");
      sel.value = tr.dataset.leader;
      renderForLeader(sel.value || null);
      document.getElementById("lpContent").scrollIntoView({ behavior: "smooth", block: "start" });
    }
  });

  document.getElementById("leaderSelect").addEventListener("change", (e) => renderForLeader(e.target.value));
  document.getElementById("lpCopyBtn").addEventListener("click", (e) => {
    copyNumberedNicknames(currentRows.map(r => r.nickname), e.currentTarget);
  });

  // смена периода пересчитывает список лидеров заново — если выбранный лидер
  // всё ещё встречается в новом периоде, остаёмся на нём, иначе берём первого.
  // Не-админ вообще не выбирает — ему сразу показывается его собственная часть
  async function reload(){
    const prevLeader = isAdmin ? (document.getElementById("leaderSelect").value || null) : null;
    const fromV = document.getElementById("fromDate").value, toV = document.getElementById("toDate").value;
    // пока даты на экране совпадают с датами раздачи, считаем по ТОЧНОМУ списку мероприятий, выбранных
    // в «ДКП» (можно было пропустить, например, осаду); поменял даты руками — обычный фильтр по датам
    const datesMatchBatch = !!dkpPayload && (fromV || "") === (dkpPayload.from || "") && (toV || "") === (dkpPayload.to || "");
    const batchEventIds = datesMatchBatch ? dkpPayload.eventIds : null;
    await loadPayoutStats(fromV, toV, batchEventIds);
    const evHint = document.getElementById("lpEventsHint");
    if(batchEventIds){
      evHint.textContent = L2I18n.t("payout.eventsHint", "Считается по мероприятиям, выбранным в ДКП: {n} шт.").replace("{n}", batchEventIds.length);
      evHint.style.display = "";
    } else {
      evHint.style.display = "none";
    }
    if(isAdmin){
      renderLeaderSelect();
      const nextLeader = (prevLeader && leaderStats.has(prevLeader)) ? prevLeader : (leaderOrder[0] || null);
      document.getElementById("leaderSelect").value = nextLeader || "";
      renderForLeader(nextLeader);
      renderOverview(datesMatchBatch);
    } else {
      const myLeader = findMyLeaderKey();
      renderMyLeaderInfo(myLeader);
      renderPeriodInfo();
      renderForLeader(myLeader);
    }
  }
  document.getElementById("fromDate").addEventListener("change", reload);
  document.getElementById("toDate").addEventListener("change", reload);
  // подстраховка на случай, если в браузере не сработал change у type="date"
  // (например, при ручном вводе цифр без потери фокуса поля) — явная кнопка
  // всегда перечитывает то, что реально стоит в полях, и пересчитывает заново
  document.getElementById("lpApplyBtn").addEventListener("click", reload);

  // список лидеров и сводка строятся из данных через innerHTML (не data-i18n) —
  // при смене языка в шапке (storage-событие) перерисовываем их заново, иначе
  // текст, построенный до переключения, останется на старом языке
  window.addEventListener("storage", (e) => {
    if(e.key !== "l2Lang") return;
    if(isAdmin){
      const sel = document.getElementById("leaderSelect");
      const current = sel.value || null;
      renderLeaderSelect();
      sel.value = current || "";
      renderForLeader(sel.value || null);
    } else {
      const myLeader = findMyLeaderKey();
      renderMyLeaderInfo(myLeader);
      renderPeriodInfo();
      renderForLeader(myLeader);
    }
  });

  // удалить активную раздачу раньше срока (24ч) — сразу у всех в клане пропадёт
  // голда в этом разделе, список «кто кого водил» останется как есть
  document.getElementById("lpDeleteBatchBtn").addEventListener("click", async () => {
    const actionsEl = document.getElementById("lpBatchActions");
    actionsEl.querySelectorAll("button").forEach(b => b.disabled = true);
    await deleteDkpPayload();
    dkpPayload = null;
    renderOverview(false);
    actionsEl.style.display = "none";
    const hintEl = document.getElementById("lpNoGoldHint");
    hintEl.textContent = L2I18n.t("payout.noGoldHint",
      "Голда не показана — нажмите «Раздать» в «ДКП Соло»/«ДКП Пати» сразу после «Разделить дроп».");
    hintEl.style.display = "";
    renderForLeader(document.getElementById("leaderSelect").value || null);
    actionsEl.querySelectorAll("button").forEach(b => b.disabled = false);
  });

  // «Занести в архив» — снимок ТЕКУЩЕЙ активной раздачи (payload) целиком, для
  // всех пати-лидеров сразу, кнопкой, вручную — ничего не пишется в архив само
  // по себе при каждом «Раздать», чтобы тестовые/случайные разделения дропа
  // туда не попадали. leaderStats/leaderOrder могли уехать на другой период,
  // если админ до этого просто листал фильтр дат тут же на странице — пересчитываем
  // заново строго под период самой раздачи, чтобы в архив не утекли чужие данные
  document.getElementById("lpArchiveBtn").addEventListener("click", async () => {
    if(!dkpPayload) return;
    const btn = document.getElementById("lpArchiveBtn");
    const errEl = document.getElementById("lpArchiveError");
    const okEl = document.getElementById("lpArchiveOk");
    errEl.textContent = "";
    okEl.style.display = "none";
    btn.disabled = true;

    await loadPayoutStats(dkpPayload.from, dkpPayload.to, dkpPayload.eventIds);
    const leaders = leaderOrder.map(leader => {
      const { leaderRow, memberRows, total } = computeLeaderRows(leader);
      return {
        leader,
        total,
        leaderGold: leaderRow.gold,
        partyCount: leaderRow.count,
        members: memberRows.map(r => ({ nickname: r.nickname, count: r.count, gold: r.gold, left: r.left })),
      };
    });

    const { error } = await db.from("payout_archive").insert({
      clan_id: profile.clan_id,
      from_date: dkpPayload.from || null,
      to_date: dkpPayload.to || null,
      split_date: dkpPayload.createdAt,
      source: dkpPayload.source,
      archived_by: profile.id,
      data: { leaders, eventIds: dkpPayload.eventIds || null },
    });

    if(error){
      errEl.textContent = L2I18n.t("payout.archiveFailed", "Не удалось занести в архив: ") + error.message;
    } else {
      okEl.style.display = "";
      setTimeout(() => { okEl.style.display = "none"; }, 3000);
      archiveListStale = true;
    }

    // возвращаем на экране то, что админ смотрел до нажатия кнопки (поля
    // дат на странице не трогали — reload() сам пересчитает под них)
    await reload();
    btn.disabled = false;
  });

  // ---------- архив: список прошлых раздач, свёрнутые карточки, удаление ----------
  let archiveEntries = [];
  let archiveListStale = true; // перезагрузить при следующем открытии вкладки «Архив»
  async function loadArchiveList(){
    const { data, error } = await db
      .from("payout_archive")
      .select("id, from_date, to_date, split_date, source, data")
      .order("split_date", { ascending: false });
    archiveEntries = error ? [] : (data || []);
    archiveListStale = false;
  }
  function fmtDateTime(iso){
    const d = new Date(iso);
    const pad2 = n => String(n).padStart(2, "0");
    return `${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.${d.getFullYear()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  }
  function periodLabelOf(entry){
    if(!entry.from_date && !entry.to_date) return L2I18n.t("payout.periodAllTimeShort", "за всё время");
    return `${entry.from_date ? fmtDate(entry.from_date) : "…"} – ${entry.to_date ? fmtDate(entry.to_date) : "…"}`;
  }
  function renderArchiveList(){
    const wrap = document.getElementById("lpArchiveList");
    document.getElementById("lpArchiveEmpty").style.display = archiveEntries.length ? "none" : "";
    wrap.innerHTML = archiveEntries.map(entry => {
      const leaders = (entry.data?.leaders || []).map(l => {
        const rows = [{ nickname: l.leader, gold: l.leaderGold, isLeader: true, left: false }, ...l.members];
        const rowsHtml = rows.map(r => {
          const leaderBadge = r.isLeader ? ` <span class="lp-tag-badge lp-leader-badge">${escapeHtml(L2I18n.t("payout.leaderBadge", "пати-лидер"))}</span>` : "";
          const cross = r.left ? ` <span class="lp-left-cross">✗</span>` : "";
          return `<tr${r.isLeader ? ' class="lp-archive-leader-row"' : ""}><td>${escapeHtml(r.nickname)}${leaderBadge}${cross}</td><td class="lp-num">${fmtGold(r.gold)}</td></tr>`;
        }).join("");
        return `<div class="lp-archive-leader"><h3>${escapeHtml(l.leader)}</h3><table class="lp-archive-table"><tbody>${rowsHtml}${l.total != null ? `<tr class="lp-archive-leader-row"><td>${escapeHtml(L2I18n.t("payout.totalRow", "Итого к отправке"))}</td><td class="lp-num">${fmtGold(l.total)}</td></tr>` : ""}</tbody></table></div>`;
      }).join("");
      const sourceLabel = entry.source === "party" ? L2I18n.t("section.loot_split_party", "ДКП Пати") : entry.source === "solo" ? L2I18n.t("section.loot_split", "ДКП Соло") : "";
      return `<div class="lp-archive-entry" data-id="${entry.id}">` +
        `<div class="lp-archive-head">` +
        `<div class="lp-archive-head-info"><b>${fmtDateTime(entry.split_date)}</b><span class="lp-archive-period">${escapeHtml(periodLabelOf(entry))}</span>` +
        (sourceLabel ? `<span class="lp-archive-source">${escapeHtml(sourceLabel)}</span>` : "") + `</div>` +
        `<div class="lp-archive-head-actions">` +
        `<button type="button" class="btn btn-ghost lp-archive-toggle" data-i18n="payout.archiveExpandBtn">Показать</button>` +
        `<button type="button" class="btn btn-danger lp-archive-delete" data-i18n="payout.archiveDeleteBtn">Удалить</button>` +
        `</div></div>` +
        `<div class="lp-archive-body" style="display:none;">${leaders || ""}</div>` +
        `</div>`;
    }).join("");

    wrap.querySelectorAll(".lp-archive-entry").forEach(card => {
      const body = card.querySelector(".lp-archive-body");
      const toggleBtn = card.querySelector(".lp-archive-toggle");
      toggleBtn.addEventListener("click", () => {
        const open = body.style.display === "none";
        body.style.display = open ? "" : "none";
        toggleBtn.textContent = open ? L2I18n.t("payout.archiveCollapseBtn", "Скрыть") : L2I18n.t("payout.archiveExpandBtn", "Показать");
      });
      card.querySelector(".lp-archive-delete").addEventListener("click", async () => {
        const id = card.dataset.id;
        if(!confirm(L2I18n.t("payout.confirmDeleteArchiveEntry", "Удалить эту раздачу из архива? Это необратимо."))) return;
        await db.from("payout_archive").delete().eq("id", id);
        archiveEntries = archiveEntries.filter(e => e.id !== id);
        renderArchiveList();
      });
    });
  }

  // ---------- вкладки «Раздача»/«Архив» — только у админа ----------
  document.getElementById("lpTabCurrent").addEventListener("click", () => switchTab("current"));
  document.getElementById("lpTabArchive").addEventListener("click", async () => {
    if(archiveListStale) await loadArchiveList();
    renderArchiveList();
    switchTab("archive");
  });
  function switchTab(tab){
    document.getElementById("lpTabCurrent").classList.toggle("active", tab === "current");
    document.getElementById("lpTabArchive").classList.toggle("active", tab === "archive");
    document.getElementById("lpCurrentView").style.display = tab === "current" ? "" : "none";
    document.getElementById("lpArchiveView").style.display = tab === "archive" ? "" : "none";
  }

  dkpPayload = await loadDkpPayload();

  if(isAdmin){
    document.getElementById("lpTabs").style.display = "";
    if(!dkpPayload){
      const hintEl = document.getElementById("lpNoGoldHint");
      hintEl.textContent = L2I18n.t("payout.noGoldHint",
        "Голда не показана — нажмите «Раздать» в «ДКП Соло»/«ДКП Пати» сразу после «Разделить дроп».");
      hintEl.style.display = "";
    } else {
      document.getElementById("lpBatchActions").style.display = "";
      // подставляем период активной раздачи, чтобы «кто кого водил» сразу
      // считалось за те же даты, а не за всё время; менять дальше можно как обычно
      document.getElementById("fromDate").value = dkpPayload.from || "";
      document.getElementById("toDate").value = dkpPayload.to || "";
    }
    await Promise.all([loadCensus(), loadRosterTag(), loadPayoutShowLeft(), loadLeaderCoefs()]);
    await reload();
  } else {
    // обычный пати-лидер не выбирает даты/лидера сам — сразу видит свою часть
    // из активной раздачи; фильтры ему просто ни к чему
    document.getElementById("lpAdminFilters").style.display = "none";
    document.getElementById("lpNoDateHint").style.display = "none";
    if(dkpPayload){
      document.getElementById("fromDate").value = dkpPayload.from || "";
      document.getElementById("toDate").value = dkpPayload.to || "";
      await Promise.all([loadCensus(), loadRosterTag(), loadPayoutShowLeft(), loadLeaderCoefs()]);
      await reload();
    } else {
      document.getElementById("lpContent").style.display = "none";
      const emptyEl = document.getElementById("lpEmpty");
      emptyEl.textContent = L2I18n.t("payout.noActiveBatch", "Сейчас нет активной раздачи от клан-лидера.");
      emptyEl.style.display = "";
    }
  }
})();
</script>
</body>
</html>
