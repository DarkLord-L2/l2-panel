<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Раздача — Кабинет клана</title>
<link rel="stylesheet" href="js/theme.css?v=12" />
<style>
  .lp-wrap{ padding:0 0 24px; }
  .lp-wrap .page-head{ margin-bottom:0; }
  .lp-wrap .card{ padding-top:14px; }

  .lp-filters{ display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin:2px 0 14px; }
  .lp-filters .field{ margin:0; }
  .lp-filters .field.lp-field-leader{ min-width:260px; }
  .lp-filters input[type="date"]{ min-width:150px; }

  .lp-summary{ display:flex; gap:18px; flex-wrap:wrap; margin:0 0 12px; }
  .lp-summary .stat{ font-size:12.5px; color: var(--text-dim); }
  .lp-summary .stat b{ color: var(--text); font-weight:600; }

  /* строки-«карточки» — тот же приём, что в «ДКП Соло»/«ДКП Пати»: border-spacing
     по вертикали разводит строки, скруглённые крайние ячейки делают их отдельными
     блоками; никакого цвета по значению, только жирность/размер для акцента */
  table.lp-table{ border-collapse:separate; border-spacing:0 8px; width:100%; max-width:520px; font-size:13.5px; }
  table.lp-table th{
    padding:0 14px 8px;
    text-align:left; color: var(--text-dim); font-size:11px; font-weight:600;
    letter-spacing:.03em; text-transform:uppercase;
  }
  table.lp-table tbody td{ padding:12px 14px; background: var(--panel-2); border-top:1px solid var(--border-lit); border-bottom:1px solid var(--border-lit); }
  table.lp-table tbody tr td:first-child{ border-left:1px solid var(--border-lit); border-top-left-radius:10px; border-bottom-left-radius:10px; }
  table.lp-table tbody tr td:last-child{ border-right:1px solid var(--border-lit); border-top-right-radius:10px; border-bottom-right-radius:10px; }
  table.lp-table th.lp-num, table.lp-table td.lp-num{ text-align:right; white-space:nowrap; font-variant-numeric: tabular-nums; }
  table.lp-table tbody tr:hover td{ background: var(--panel); border-color: var(--gold-dim); }
  .lp-cnt{ color: var(--text); font-weight:700; font-size:14px; }
  .lp-gold{ color: var(--text); font-weight:700; font-size:14px; }

  .lp-copy-row{ margin:12px 0 0; }

  /* участник, которого нет в последней переписи — уже не в клане; красный крестик
     рядом с ником, никаких других изменений в таблице */
  .lp-left-cross{ color: var(--danger-lit); font-weight:700; margin-left:4px; }

  /* тот же «отдельный список» («Окна» и т.п.), что и в «Участники клана» — свой
     заголовок, ставится/снимается там же; тут просто бейдж рядом с ником для тех,
     кого туда реально добавили (тот же стиль пилюли, что .rw-tag-badge в roster.html) */
  .lp-tag-badge{ display:inline-block; font-size:10.5px; padding:2px 8px; border-radius:999px; border:1px dashed var(--border-lit); color: var(--text-dim); margin-left:6px; }
</style>
</head>
<body>

<div class="lp-wrap" id="wrap" style="display:none;">
  <div class="page-head">
    <h1 data-i18n="payout.title">Раздача</h1>
  </div>

  <section class="card">
    <p class="hint" id="lpMyLeaderInfo" style="margin:0 0 12px; display:none;"></p>
    <p class="hint" id="lpPeriodInfo" style="margin:0 0 12px; display:none;"></p>
    <button class="btn btn-danger" id="lpDeleteBatchBtn" style="display:none; margin:0 0 12px;" data-i18n="payout.deleteBatchBtn">Удалить раздачу</button>

    <div class="lp-filters" id="lpAdminFilters">
      <div class="field">
        <label for="fromDate" data-i18n="payout.fromLabel">С</label>
        <input type="date" id="fromDate" />
      </div>
      <div class="field">
        <label for="toDate" data-i18n="payout.toLabel">По</label>
        <input type="date" id="toDate" />
      </div>
      <button class="btn" id="lpApplyBtn" data-i18n="payout.applyBtn">Показать</button>
      <div class="field lp-field-leader">
        <label for="leaderSelect" data-i18n="payout.leaderLabel">Пати-лидер</label>
        <select id="leaderSelect"></select>
      </div>
    </div>
    <p class="hint" id="lpNoDateHint" style="margin:-4px 0 12px;" data-i18n="payout.noDateHint">Даты не заданы — показывается статистика за всё время.</p>
    <p class="hint" id="lpNoGoldHint" style="margin:-4px 0 12px; display:none;"></p>
    <p class="error-msg" id="lpError"></p>

    <div id="lpContent">
      <div class="lp-summary" id="lpSummary"></div>
      <table class="lp-table">
        <thead>
          <tr><th data-i18n="payout.colNick">Ник</th><th class="lp-num" data-i18n="payout.colTogether">Доли</th><th class="lp-num" data-i18n="payout.colGold">Голда</th></tr>
        </thead>
        <tbody id="lpBody"></tbody>
      </table>
      <div class="lp-copy-row">
        <button class="btn" id="lpCopyBtn" data-i18n="payout.copyBtn" data-i18n-attr="title:payout.copyBtnTitle" title="Скопировать список ников (в порядке таблицы)">📋 Скопировать ники</button>
      </div>
    </div>
    <p class="empty-hint" id="lpEmpty" style="display:none;"></p>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js?v=19"></script>
<script src="js/i18n.js?v=13"></script>
<script>
(async function(){
  const session = await L2Cabinet.requireSession();
  if(!session) return;

  const profile = await L2Cabinet.getProfile();
  if(!profile){
    document.body.innerHTML = '<div class="login-wrap"><div class="card login-card">' +
      '<h1>' + L2I18n.t("shell.profileNotFoundTitle", "⚠ Профиль не найден") + '</h1>' +
      '<p class="hint">' + L2I18n.t("common.contactLeader", "Обратитесь к клан-лидеру.") + '</p></div></div>';
    return;
  }

  const isAdmin = ["glavadmin", "admin"].includes(profile.roles?.key);
  const db = L2Cabinet.client;
  document.getElementById("wrap").style.display = "";

  function escapeHtml(s){
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }

  // перепись иногда пишет ник чуть иначе (кириллица/латиница похожих букв, регистр) —
  // та же схема нормализации, что в «ДКП Соло»/«ДКП Пати»
  const CYR_LOOKALIKES = { "а":"a","в":"b","е":"e","к":"k","м":"m","н":"h","о":"o","р":"p","с":"c","т":"t","у":"y","х":"x","ё":"e","0":"o","l":"i" };
  function normalizeNick(s){
    return String(s || "")
      .toLowerCase()
      .split("").map(ch => CYR_LOOKALIKES[ch] || ch).join("")
      .replace(/[^a-zа-яё0-9]/gi, "");
  }

  // последняя перепись — чтобы пометить красным крестиком тех, кто уже пропал
  // из клана; пусто, если переписи вообще нет — тогда никого не помечаем
  let censusNormSet = new Set();
  // normalizeNick(nickname) -> самая свежая неделя переписи, в которой он вообще
  // встречался — для подсказки «был в переписи от {дата}» у тех, кто пропал
  // из клана давно, а не только на прошлой неделе
  let lastSeenWeekByNorm = new Map();
  async function loadCensus(){
    const { data } = await db.from("census_entries").select("nickname, week_start");
    const weeks = [...new Set((data || []).map(r => r.week_start))].sort();
    const latest = weeks.length ? weeks[weeks.length - 1] : null;
    censusNormSet = latest
      ? new Set((data || []).filter(r => r.week_start === latest).map(r => normalizeNick(r.nickname)))
      : new Set();
    lastSeenWeekByNorm = new Map();
    (data || []).forEach(r => {
      const norm = normalizeNick(r.nickname);
      const prev = lastSeenWeekByNorm.get(norm);
      if(!prev || r.week_start > prev) lastSeenWeekByNorm.set(norm, r.week_start);
    });
  }
  function isLeftClan(nick){ return censusNormSet.size > 0 && !censusNormSet.has(normalizeNick(nick)); }
  function fmtDate(iso){
    if(!iso) return "";
    const [y, m, d] = iso.split("-");
    return `${d}.${m}.${y}`;
  }
  function leftClanTitleOf(nick){
    const lastWeek = lastSeenWeekByNorm.get(normalizeNick(nick));
    if(lastWeek) return L2I18n.t("dkp.leftClanTitleWithDate", "Уже не в клане — был в переписи от {date}").replace("{date}", fmtDate(lastWeek));
    // не просто «пропал из последней переписи», а вообще ни разу не встречался
    // ни в одной неделе — отдельный явный текст, чтобы не выглядело как
    // «подсказка не работает» на фоне остальных строк с датой
    return L2I18n.t("dkp.leftClanTitleNoHistory", "Уже не в клане — в переписи вообще не встречался");
  }

  // «отдельный список» из «Участники клана» (например «Окна» — альт-персонажи) —
  // один список на клан, свой заголовок; тут просто показываем этот заголовок
  // рядом с ником, но только тем, кого туда реально добавили
  let tagLabel = "";
  let tagEnabled = false;
  let taggedNormSet = new Set();
  async function loadRosterTag(){
    const [{ data: settings }, { data: tagged }] = await Promise.all([
      db.from("roster_tag_settings").select("label, enabled").maybeSingle(),
      db.from("roster_tagged_members").select("nickname"),
    ]);
    tagLabel = settings?.label || "";
    tagEnabled = !!settings?.enabled;
    taggedNormSet = new Set((tagged || []).map(r => normalizeNick(r.nickname)));
  }
  function tagBadgeOf(nick){
    return (tagEnabled && taggedNormSet.has(normalizeNick(nick))) ? tagLabel : null;
  }

  // ---- копирование списка ников (та же схема, что в «Налогах»/«Посещаемости») ----
  function flashCopyBtn(btn, symbol){
    if(!btn) return;
    const original = btn.textContent;
    btn.textContent = symbol;
    btn.disabled = true;
    setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1000);
  }
  async function copyNumberedNicknames(names, btn){
    if(!names.length){ flashCopyBtn(btn, "∅"); return; }
    const text = names.map((n, i) => `${i + 1}. ${n}`).join("\n");
    try{
      await navigator.clipboard.writeText(text);
      flashCopyBtn(btn, "✓");
    }catch(e){
      flashCopyBtn(btn, "✗");
    }
  }

  let leaderStats = new Map(); // leaderNick -> { partyCount, members: Map(memberNick -> count) }
  let leaderOrder = [];        // ники лидеров, отсортированные по убыванию partyCount
  let currentRows = [];        // [{nickname, count}], в текущем отображаемом порядке (для копирования)

  // «Раздача»: показывать ли ушедших из клана в списке (Админ-панель → «ДКП») —
  // их голда всё равно всегда делится поровну между оставшимися в клане в том
  // же списке лидера, этот тумблер влияет только на видимость их строки
  let showLeftInPayout = true;
  async function loadPayoutShowLeft(){
    const { data } = await db.from("loot_split_settings").select("show_left_in_payout").eq("clan_id", profile.clan_id).maybeSingle();
    showLeftInPayout = data?.show_left_in_payout ?? true;
  }

  // голда больше не считается на этой странице — её присылает «ДКП Соло»/«ДКП Пати»
  // кнопкой «Раздать» в общую на весь клан таблицу payout_batches (не
  // sessionStorage — тот виден только в браузере того, кто нажал, а тут её должен
  // увидеть КАЖДЫЙ пати-лидер на своём устройстве). Список «кто с каким лидером
  // сколько раз был» — отдельная, независимая от ДКП штука (строится из
  // event_stats/is_party_leader по своему фильтру дат) и работает всегда, даже
  // без активной раздачи — тогда просто колонка «Голда» остаётся пустой
  const PAYOUT_BATCH_MAX_AGE_MS = 24 * 60 * 60 * 1000; // «висит» 24 часа
  let dkpPayload = null; // { from, to, goldByNick: {nickname: gold}, goldByNorm: Map(norm -> gold), source: "solo"|"party" }
  async function loadDkpPayload(){
    const { data } = await db.from("payout_batches").select("from_date, to_date, gold_by_nick, source, created_at").eq("clan_id", profile.clan_id).maybeSingle();
    if(!data || !data.gold_by_nick) return null;
    const ageMs = Date.now() - new Date(data.created_at).getTime();
    if(ageMs > PAYOUT_BATCH_MAX_AGE_MS) return null; // протухла — как будто её и нет
    // ключи gold_by_nick — ники из переписи («ДКП Соло»/«ДКП Пати» считают по ним),
    // а тут ники берутся из сырого распознавания скрина (event_stats) — написание
    // может чуть отличаться (0/O, регистр и т.п.), поэтому сопоставляем по
    // normalizeNick, а не точным совпадением строки
    const goldByNorm = new Map();
    Object.entries(data.gold_by_nick).forEach(([nick, gold]) => goldByNorm.set(normalizeNick(nick), gold));
    return { from: data.from_date, to: data.to_date, goldByNick: data.gold_by_nick, goldByNorm, source: data.source };
  }
  async function deleteDkpPayload(){
    await db.from("payout_batches").delete().eq("clan_id", profile.clan_id);
  }
  // лидер на скрине не распознаётся отдельным ОСР-полем — event-roster.js просто
  // помечает is_party_leader=true у первого валидного ника скрина (лидер пати в игре
  // всегда идёт первой строкой), группируем эти отметки по batch_id
  async function loadPayoutStats(fromStr, toStr){
    const errEl = document.getElementById("lpError");
    errEl.textContent = "";

    // период не обязателен целиком с обеих сторон — открытая граница просто не
    // ограничивает соответствующую сторону (та же логика, что в датных фильтрах
    // «Донатов» в Налогах)
    let eventIdFilter = null;
    if(fromStr || toStr){
      let evQ = db.from("attendance_events").select("id");
      if(fromStr) evQ = evQ.gte("event_date", fromStr);
      if(toStr) evQ = evQ.lte("event_date", toStr);
      const { data: evs, error: evErr } = await evQ;
      if(evErr){ errEl.textContent = L2I18n.t("payout.loadEventsFailed", "Не удалось загрузить мероприятия: ") + evErr.message; return; }
      eventIdFilter = new Set((evs || []).map(e => e.id));
    }

    const { data, error } = await db
      .from("event_stats")
      .select("nickname, batch_id, is_party_leader, removed, event_id")
      .not("batch_id", "is", null);
    if(error){ errEl.textContent = L2I18n.t("payout.loadDataFailed", "Не удалось загрузить данные: ") + error.message; return; }

    const byBatch = new Map();
    (data || []).forEach(r => {
      if(r.removed) return;
      if(eventIdFilter && !eventIdFilter.has(r.event_id)) return;
      if(!byBatch.has(r.batch_id)) byBatch.set(r.batch_id, []);
      byBatch.get(r.batch_id).push(r);
    });

    leaderStats = new Map();
    byBatch.forEach(rows => {
      const leaderRow = rows.find(r => r.is_party_leader);
      if(!leaderRow) return; // скрин загружен до этой фичи — лидер не отмечен, пропускаем
      const leader = leaderRow.nickname;
      if(!leaderStats.has(leader)) leaderStats.set(leader, { partyCount: 0, members: new Map() });
      const entry = leaderStats.get(leader);
      entry.partyCount += 1;
      rows.forEach(r => {
        if(r.nickname === leader) return;
        entry.members.set(r.nickname, (entry.members.get(r.nickname) || 0) + 1);
      });
    });

    leaderOrder = Array.from(leaderStats.keys())
      .sort((a, b) => leaderStats.get(b).partyCount - leaderStats.get(a).partyCount || a.localeCompare(b));
  }

  function renderLeaderSelect(){
    const sel = document.getElementById("leaderSelect");
    sel.innerHTML = leaderOrder
      .map(nick => `<option value="${escapeHtml(nick)}">${escapeHtml(nick)} — ${leaderStats.get(nick).partyCount}${L2I18n.t("payout.payoutsCountSuffix", " раздач")}</option>`)
      .join("");
  }

  // не-админ (обычный пати-лидер) не выбирает лидера сам — ему сразу показывается
  // его собственная часть, если он вообще отмечен лидером хоть одного мероприятия
  // за этот период (сопоставление по нику, устойчивое к разнице в написании)
  function findMyLeaderKey(){
    const norm = normalizeNick(profile.nickname);
    return leaderOrder.find(nick => normalizeNick(nick) === norm) || null;
  }
  function renderMyLeaderInfo(leaderKey){
    const el = document.getElementById("lpMyLeaderInfo");
    el.textContent = leaderKey
      ? L2I18n.t("payout.youAreLeader", "Ты — пати-лидер «{nick}» за этот период.").replace("{nick}", leaderKey)
      : L2I18n.t("payout.youAreNotLeader", "За этот период ты не отмечен лидером ни в одном мероприятии.");
    el.style.display = "";
  }

  // не-админу период раздачи (даты активного payout_batches) показываем только
  // текстом — он не может его менять, поле «С/По» ему вообще не показывается
  function renderPeriodInfo(){
    const el = document.getElementById("lpPeriodInfo");
    const from = document.getElementById("fromDate").value;
    const to = document.getElementById("toDate").value;
    el.textContent = (from || to)
      ? L2I18n.t("payout.periodRange", "Период: {from} — {to}")
        .replace("{from}", from ? fmtDate(from) : "…")
        .replace("{to}", to ? fmtDate(to) : "…")
      : L2I18n.t("payout.periodAllTime", "Период: за всё время.");
    el.style.display = "";
  }

  // голда конкретного ника — только если пришли свежие данные из ДКП, иначе
  // null (не 0 — 0 читалось бы как «посчитано и вышло 0», а тут просто нечем
  // считать); рендерящий код сам решает, показать число или прочерк
  function goldOf(nick){
    if(!dkpPayload) return null;
    const gold = dkpPayload.goldByNorm.get(normalizeNick(nick));
    return gold || 0;
  }
  function fmtGold(gold){
    return gold === null ? "—" : Math.round(gold).toLocaleString(L2I18n.locale());
  }

  function renderForLeader(leader){
    const contentEl = document.getElementById("lpContent");
    const emptyEl = document.getElementById("lpEmpty");
    if(!leader){
      contentEl.style.display = "none";
      const hasDateFilter = !!(document.getElementById("fromDate").value || document.getElementById("toDate").value);
      emptyEl.textContent = hasDateFilter
        ? L2I18n.t("payout.emptyForPeriod", "За выбранный период нет скринов с отмеченным пати-лидером.")
        : L2I18n.t("payout.emptyNoScreens", "Пока нет ни одного скрина с отмеченным пати-лидером — загрузите скрины в «Журнале посещаемости».");
      emptyEl.style.display = "";
      return;
    }
    contentEl.style.display = "";
    emptyEl.style.display = "none";

    const entry = leaderStats.get(leader);
    // сам лидер не входит в entry.members (там только те, кому он раздаёт) —
    // его собственную голду показываем отдельной строкой, только если она есть
    const leaderGold = goldOf(leader);
    document.getElementById("lpSummary").innerHTML =
      `<span class="stat">${L2I18n.t("payout.ledCount", "Раздач под руководством: ")}<b>${entry.partyCount}</b></span>` +
      `<span class="stat">${L2I18n.t("payout.uniqueMembers", "Разных участников: ")}<b>${entry.members.size}</b></span>` +
      (leaderGold !== null ? `<span class="stat">${L2I18n.t("payout.leaderGold", "Себе (лидер): ")}<b>${fmtGold(leaderGold)}</b></span>` : "");

    const allRows = Array.from(entry.members.entries())
      .map(([nickname, count]) => ({ nickname, count, left: isLeftClan(nickname) }))
      .sort((a, b) => b.count - a.count || a.nickname.localeCompare(b.nickname));

    // ушедшие из клана не забирают голду сами — их сумма делится поровну между
    // оставшимися в клане в этом же списке; строка ушедшего (если её вообще
    // показываем) при этом отображает его исходную, ещё не поделённую сумму —
    // просто для справки, сколько ему причиталось бы
    const stayRows = allRows.filter(r => !r.left);
    const redistributePool = allRows.filter(r => r.left).reduce((s, r) => s + (goldOf(r.nickname) || 0), 0);
    const perStayBonus = stayRows.length ? redistributePool / stayRows.length : 0;

    currentRows = showLeftInPayout ? allRows : stayRows;

    const body = document.getElementById("lpBody");
    body.innerHTML = currentRows.map(r => {
      const cross = r.left ? ` <span class="lp-left-cross" title="${escapeHtml(leftClanTitleOf(r.nickname))}">✗</span>` : "";
      const tag = tagBadgeOf(r.nickname);
      const badge = tag ? ` <span class="lp-tag-badge">${escapeHtml(tag)}</span>` : "";
      const base = goldOf(r.nickname);
      const gold = r.left || base === null ? base : base + perStayBonus;
      return `<tr><td>${escapeHtml(r.nickname)}${cross}${badge}</td>` +
        `<td class="lp-num lp-cnt">${r.count}</td>` +
        `<td class="lp-num lp-gold">${fmtGold(gold)}</td></tr>`;
    }).join("");
  }

  document.getElementById("leaderSelect").addEventListener("change", (e) => renderForLeader(e.target.value));
  document.getElementById("lpCopyBtn").addEventListener("click", (e) => {
    copyNumberedNicknames(currentRows.map(r => r.nickname), e.currentTarget);
  });

  // смена периода пересчитывает список лидеров заново — если выбранный лидер
  // всё ещё встречается в новом периоде, остаёмся на нём, иначе берём первого.
  // Не-админ вообще не выбирает — ему сразу показывается его собственная часть
  async function reload(){
    const prevLeader = isAdmin ? (document.getElementById("leaderSelect").value || null) : null;
    await loadPayoutStats(document.getElementById("fromDate").value, document.getElementById("toDate").value);
    if(isAdmin){
      renderLeaderSelect();
      const nextLeader = (prevLeader && leaderStats.has(prevLeader)) ? prevLeader : (leaderOrder[0] || null);
      document.getElementById("leaderSelect").value = nextLeader || "";
      renderForLeader(nextLeader);
    } else {
      const myLeader = findMyLeaderKey();
      renderMyLeaderInfo(myLeader);
      renderPeriodInfo();
      renderForLeader(myLeader);
    }
  }
  document.getElementById("fromDate").addEventListener("change", reload);
  document.getElementById("toDate").addEventListener("change", reload);
  // подстраховка на случай, если в браузере не сработал change у type="date"
  // (например, при ручном вводе цифр без потери фокуса поля) — явная кнопка
  // всегда перечитывает то, что реально стоит в полях, и пересчитывает заново
  document.getElementById("lpApplyBtn").addEventListener("click", reload);

  // список лидеров и сводка строятся из данных через innerHTML (не data-i18n) —
  // при смене языка в шапке (storage-событие) перерисовываем их заново, иначе
  // текст, построенный до переключения, останется на старом языке
  window.addEventListener("storage", (e) => {
    if(e.key !== "l2Lang") return;
    if(isAdmin){
      const sel = document.getElementById("leaderSelect");
      const current = sel.value || null;
      renderLeaderSelect();
      sel.value = current || "";
      renderForLeader(sel.value || null);
    } else {
      const myLeader = findMyLeaderKey();
      renderMyLeaderInfo(myLeader);
      renderPeriodInfo();
      renderForLeader(myLeader);
    }
  });

  // удалить активную раздачу раньше срока (24ч) — сразу у всех в клане пропадёт
  // голда в этом разделе, список «кто кого водил» останется как есть
  document.getElementById("lpDeleteBatchBtn").addEventListener("click", async () => {
    const btn = document.getElementById("lpDeleteBatchBtn");
    btn.disabled = true;
    await deleteDkpPayload();
    dkpPayload = null;
    btn.style.display = "none";
    const hintEl = document.getElementById("lpNoGoldHint");
    hintEl.textContent = L2I18n.t("payout.noGoldHint",
      "Голда не показана — нажмите «Раздать» в «ДКП Соло»/«ДКП Пати» сразу после «Разделить дроп».");
    hintEl.style.display = "";
    renderForLeader(document.getElementById("leaderSelect").value || null);
    btn.disabled = false;
  });

  dkpPayload = await loadDkpPayload();

  if(isAdmin){
    if(!dkpPayload){
      const hintEl = document.getElementById("lpNoGoldHint");
      hintEl.textContent = L2I18n.t("payout.noGoldHint",
        "Голда не показана — нажмите «Раздать» в «ДКП Соло»/«ДКП Пати» сразу после «Разделить дроп».");
      hintEl.style.display = "";
    } else {
      document.getElementById("lpDeleteBatchBtn").style.display = "";
      // подставляем период активной раздачи, чтобы «кто кого водил» сразу
      // считалось за те же даты, а не за всё время; менять дальше можно как обычно
      document.getElementById("fromDate").value = dkpPayload.from || "";
      document.getElementById("toDate").value = dkpPayload.to || "";
    }
    await Promise.all([loadCensus(), loadRosterTag(), loadPayoutShowLeft()]);
    await reload();
  } else {
    // обычный пати-лидер не выбирает даты/лидера сам — сразу видит свою часть
    // из активной раздачи; фильтры ему просто ни к чему
    document.getElementById("lpAdminFilters").style.display = "none";
    document.getElementById("lpNoDateHint").style.display = "none";
    if(dkpPayload){
      document.getElementById("fromDate").value = dkpPayload.from || "";
      document.getElementById("toDate").value = dkpPayload.to || "";
      await Promise.all([loadCensus(), loadRosterTag(), loadPayoutShowLeft()]);
      await reload();
    } else {
      document.getElementById("lpContent").style.display = "none";
      const emptyEl = document.getElementById("lpEmpty");
      emptyEl.textContent = L2I18n.t("payout.noActiveBatch", "Сейчас нет активной раздачи от клан-лидера.");
      emptyEl.style.display = "";
    }
  }
})();
</script>
</body>
</html>
